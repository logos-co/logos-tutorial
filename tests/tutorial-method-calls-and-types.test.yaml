name: 'Tutorial: Method Calls and Supported Types in C++ and Rust'
output: tutorial-method-calls-and-types.md
project_name: logos-api-examples
release: ''
intro: |
  Build two modules that expose the supported parameter and return type families, then call across the C++/Rust boundary with explicit error handling and per-call deadlines. Each language acts as both provider and caller.
what_you_build: C++ and Rust echo modules with runnable type, error and timeout examples.
what_you_learn:
- Map LIDL types to C++ and Rust provider signatures
- Return and inspect a domain error separately from a failed call
- Set synchronous and asynchronous call deadlines in both languages
- Round-trip bytes, arrays, maps, records, nested values and optionals
prerequisites:
- Nix with flakes enabled
- Python 3 for the runtime assertions
- Basic C++ and Rust; no earlier tutorial is required
sections:
- title: The supported type surface
  text: |
    This table describes the Qt-free C++ and Rust **generated provider
    method signatures**.
    Every `echo*` method below takes and returns the indicated type. Containers can
    nest: the examples include bytes inside lists/maps/records, a list and map of
    records, a nested record and an array of arrays.

    | LIDL | C++ provider | Rust provider |
    |---|---|---|
    | `tstr` | `std::string` | `String` |
    | `bstr` | `std::vector<uint8_t>` | `Vec<u8>` |
    | `int` | `int64_t` | `i64` |
    | `uint` | `uint64_t` | `u64` |
    | `float64` | `double` | `f64` |
    | `bool` | `bool` | `bool` |
    | `any` | `nlohmann::json` | `serde_json::Value` |
    | `[tstr]` | `std::vector<std::string>` | `Vec<String>` |
    | `[int]` | `std::vector<int64_t>` | `Vec<i64>` |
    | `[uint]` | `std::vector<uint64_t>` | `Vec<u64>` |
    | `[float64]` | `std::vector<double>` | `Vec<f64>` |
    | `[bool]` | `std::vector<bool>` | `Vec<bool>` |
    | `[any]` | `LogosList` | `Vec<serde_json::Value>` |
    | `{tstr: any}` | `LogosMap` | `BTreeMap<String, serde_json::Value>` |
    | `[bstr]` | `std::vector<std::vector<uint8_t>>` | `Vec<Vec<u8>>` |
    | `{tstr: bstr}` | `std::map<std::string, std::vector<uint8_t>>` | `BTreeMap<String, Vec<u8>>` |
    | `{tstr: int}` | `std::map<std::string, int64_t>` | `BTreeMap<String, i64>` |
    | `{tstr: int}` | `std::unordered_map<std::string, int64_t>` | `BTreeMap<String, i64>` |
    | `[[int]]` | `std::vector<std::vector<int64_t>>` | `Vec<Vec<i64>>` |
    | `Entry` | `Entry` | `Entry` |
    | `[Entry]` | `std::vector<Entry>` | `Vec<Entry>` |
    | `{tstr: Entry}` | `std::map<std::string, Entry>` | `BTreeMap<String, Entry>` |
    | `Batch` | `Batch` | `Batch` |
    | `?tstr` | `std::optional<std::string>` | `Option<String>` |
    | `void` (return only) | `void` | `()` |
    | `result` (return only) | `StdLogosResult` | `Result<serde_json::Value, String>` |

    Rust collection types follow LIDL recursively: `[int]` is `Vec<i64>` and
    `{tstr: [bstr]}` is `BTreeMap<String, Vec<Vec<u8>>>`. Within collections,
    `serde_json::Value` appears where an element is `any`. The generated provider
    validates incoming collection values against
    their LIDL shape before decoding them into these Rust types.

    Rust uses a **committed LIDL contract** here. The Rust-first trait frontend used
    in the [introductory tutorial](tutorial-rust-module.md) can derive supported
    `Vec<T>` and `BTreeMap<String, T>` contracts, but does not derive record
    declarations and rejects optional returns. Declaring the LIDL directly exposes
    the larger supported surface and generates the trait you implement. Record
    **fields** are typed recursively too (for example `Batch.tags: Vec<String>`).

    C++ header-first authoring uses the displayed standard types; an unordered map
    is allowed for method parameters/returns, while record fields use `std::map`.
    Use 64-bit integers, not `int`/`i32`, for a contract that crosses languages.
    `void` and `result` are return-only. Arbitrary C++ classes, pointers, enums,
    non-string map keys and Rust tuples are not additional wire types: express them
    with the supported records/collections instead.

    `?T` has two states. An empty positional optional is JSON `null`; an empty
    optional record field is omitted. A present empty string is still a value.
    `Option<Option<T>>` cannot carry a third state. The tests check both null and
    an empty string, and both an absent and a populated record field.

    Bytes use the tagged JSON form `{"_bytes":"AAH_"}` (unpadded base64url for
    `00 01 ff`), including inside containers. Scalar byte methods and typed record
    fields are encoded by the SDK. Nested `Vec<u8>` values are encoded with the
    same tags automatically. A list of JSON integers is not the canonical byte
    representation.

    Generated **clients** need not have the same collection signatures as providers:
    C++ wrappers use `LogosList`/`LogosMap` for many general collections. Rust
    clients borrow slices and `&BTreeMap` for collection parameters and return
    owned `Vec<T>` and `BTreeMap<String, T>`. Inspect `nix build .#generate`
    when you need the exact generated signature.
- title: The shared calling contract
  step: true
  text: |
    Create a fresh directory (`mkdir logos-api-examples && cd logos-api-examples`).
    Both modules implement the echo API and also call the other module through this
    small interface. Binding by name avoids a build-time dependency cycle; the
    runtime test explicitly loads both providers before invoking either caller.
  steps:
  - title: '`cpp/interfaces/calls.lidl`'
    file:
      path: cpp/interfaces/calls.lidl
      content: |
        module calls {
          version "1.0.0"
          method echoInt(v: int) -> int
          method doVoid() -> void
          method makeResult(ok: bool) -> result
          method slow(ms: int) -> int
        }
  - run: |-
      mkdir -p rust/interfaces
      cp cpp/interfaces/calls.lidl rust/interfaces/calls.lidl
- title: The C++ provider and caller
  step: true
  text: |
    The header is the C++ contract. `LogosMap` and `LogosList` are JSON aliases with
    object/array contracts; `nlohmann::json` declares unrestricted `any`.
  steps:
  - title: '`cpp/flake.nix`'
    file:
      path: cpp/flake.nix
      content: |
        {
          inputs.logos-module-builder.url = "github:logos-co/logos-module-builder{release}";
          outputs = inputs@{ logos-module-builder, ... }:
            logos-module-builder.lib.mkLogosModule {
              src = ./.;
              configFile = ./metadata.json;
              flakeInputs = inputs;
            };
        }
  - title: '`cpp/metadata.json`'
