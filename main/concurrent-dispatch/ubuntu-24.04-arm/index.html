dule-builder#rust\n```\n\nIf the Rust scaffold is new to you, [Writing a Module in Rust](tutorial-rust-module.md) walks through it properly. Everything below is the part that differs."}, {"execs": [{"cmd": "write slow-worker/metadata.json", "kind": "file", "note": "Wrote slow-worker/metadata.json", "status": "pass"}], "md": "### 2.2 metadata.json \u2014 one key is the whole feature\n\n```json\n{\n  \"name\": \"calc_slow\",\n  \"display_name\": \"Slow Worker\",\n  \"version\": \"1.0.0\",\n  \"type\": \"core\",\n  \"interface\": \"cdylib\",\n  \"concurrency\": \"multi\",\n  \"max_workers\": 4,\n  \"category\": \"example\",\n  \"description\": \"A deliberately slow worker that records how many calls overlap\",\n  \"main\": \"calc_slow_plugin\",\n  \"dependencies\": [],\n\n  \"codegen\": { \"rust\": { \"crate\": \"rust-lib\", \"trait\": \"CalcSlowModule\" } },\n\n  \"nix\": {\n    \"packages\": { \"build\": [], \"runtime\": [] },\n    \"external_libraries\": [],\n    \"cmake\": { \"find_packages\": [], \"extra_sources\": [], \"extra_include_dirs\": [], \"extra_link_libraries\": [] }\n  }\n}\n```\n\n`\"concurrency\": \"multi\"` is the line that makes this module concurrent. Its default is `\"single\"`, and a `single` module is completely unchanged by the feature's existence \u2014 it pays no overhead.\n\nThe optional positive integer `\"max_workers\"` caps active handlers; calls beyond it queue on the reusable pool. Left out or `null`, the runtime sizes the bounded pool to available CPU parallelism. We set it to 4 so this experiment's expected peak is deterministic."}, {"execs": [{"cmd": "write slow-worker/rust-lib/src/lib.rs", "kind": "file", "note": "Wrote slow-worker/rust-lib/src/lib.rs", "status": "pass"}], "md": "### 2.3 The module logic\n\n`work` blocks. Around the block it maintains two counters, so the module can report the highest overlap it ever saw:\n\n```\n//! calc_slow \u2014 a worker that blocks, and counts how many callers it serves at once.\n\nuse std::sync::atomic::{AtomicI64, Ordering};\n\n/// `concurrency: \"multi\"` changes this trait's shape: the receiver is `&self`,\n/// not `&mut self`, and the bound is `Send + Sync`. That is not a style\n/// choice \u2014 the generated dispatch shares one instance behind an `Arc`, so\n/// a `&mut self` handler does not compile.\npub trait CalcSlowModule: Send + Sync + 'static {\n    /// Blocks for `ms` milliseconds, then returns `ms`.\n    fn work(&self, ms: i64) -> i64;\n\n    /// The highest number of `work` calls that were ever in flight at once.\n    fn peak(&self) -> i64;\n\n    /// `&self` here too \u2014 in `multi` mode every hook loses `&mut`.\n    fn on_context_ready(&self, _ctx: &RustModuleContext) {}\n}\n\ninclude!(concat!(env!(\"CARGO_MANIFEST_DIR\"), \"/generated/provider_gen.rs\"));\n\n/// Both counters are atomics because `&self` gives no other way to mutate\n/// them. A plain `i64` field here would be a compile error, which is the\n/// point: the thread-safety obligation cannot be forgotten.\n#[derive(Default)]\nstruct SlowWorker {\n    in_flight: AtomicI64,\n    max_seen: AtomicI64,\n}\n\nimpl CalcSlowModule for SlowWorker {\n    fn work(&self, ms: i64) -> i64 {\n        let now = self.in_flight.fetch_add(1, Ordering::SeqCst) + 1;\n        self.max_seen.fetch_max(now, Ordering::SeqCst);\n        std::thread::sleep(std::time::Duration::from_millis(ms.max(0) as u64));\n        self.in_flight.fetch_sub(1, Ordering::SeqCst);\n        ms\n    }\n\n    fn peak(&self) -> i64 {\n        self.max_seen.load(Ordering::SeqCst)\n    }\n}\n\n#[no_mangle]\npub extern \"Rust\" fn logos_module_install() {\n    install::<SlowWorker>();\n}\n```\n\n> **The compiler enforces the contract.** Write `fn work(&mut self, ...)` in a `multi` module and the build fails with `error[E0596]: cannot borrow data in an Arc as mutable`. You cannot opt into concurrency and forget to make your state safe \u2014 retrofitting `multi` onto a module written around `&mut self` is a refactor, not a flag.\n>\n> In C++ (`interface: \"universal\"` or `\"cdylib\"`) **nothing enforces it**. Your impl's methods simply may run concurrently; guard shared members with `std::atomic` or `std::mutex` yourself. The `LogosModuleContext` accessors and the event-emit path are already thread-safe."}, {"execs": [{"cmd": "sh -c 'cd slow-worker && sed -i.bak \"s/^name = .minimal_rust.$/name = \\\"calc_slow\\\"/\" rust-lib/Cargo.toml rust-lib/Cargo.lock && rm -f rust-lib/*.bak && git init -q && git add -A && nix build'", "exit_code": 0, "kind": "run", "note": "", "output": "warning: Git tree '/home/runner/work/_temp/doctest-test-2zyq8dbe/slow-worker' is dirty\nwarning: creating lock file \"/home/runner/work/_temp/doctest-test-2zyq8dbe/slow-worker/flake.lock\": \n\u2022 Added input 'logos-module-builder':\n    'github:logos-co/logos-module-builder/3818566dcc1849f1a6bdb89d8674ca9fe5f6915a?narHash=sha256-u8X0RbZRrceR9iMCnqj72id99PDqS%2BInWAaZKFbIBHU%3D' (2026-10-02)\n\u2022 Added input 'logos-module-builder/logos-cpp-sdk':\n    'github:logos-co/logos-cpp-sdk/3bf5365c5412f89bbbf30e3f46237cd68cff0599?narHash=sha256-uANInDol3mmitMfsNnN5qx4N5XbIiqhViKo6K2nmevA%3D' (2026-10-01)\n\u2022 Added input 'logos-module-builder/logos-cpp-sdk/logos-lidl':\n    'github:logos-co/logos-lidl/9df8e00372a07e073a17096fd92a62d69c5a21cd?narHash=sha256-LwoG/6AN7QwSiOqEiTnx55Mvrc4eTGBomo%2BDBVqG8FQ%3D' (2026-09-15)\n\u2022 Added input 'logos-module-builder/logos-cpp-sdk/logos-lidl/logos-nix':\n    follows 'logos-module-builder/logos-cpp-sdk/logos-nix'\n\u2022 Added input 'logos-module-builder/logos-cpp-sdk/logos-lidl/nixpkgs':\n    follows 'logos-module-builder/logos-cpp-sdk/logos-lidl/logos-nix/nixpkgs'\n\u2022 Added input 'logos-module-builder/logos-cpp-sdk/logos-nix':\n    follows 'logos-module-builder/logos-nix'\n\u2022 Added input 'logos-module-builder/logos-cpp-sdk/logos-protocol':\n    follows 'logos-module-builder/logos-protocol'\n\u2022 Added input 'logos-module-builder/logos-cpp-sdk/nixpkgs':\n    fol ind": "run", "note": "", "output": "wrote: \"/home/runner/work/_temp/doctest-test-2zyq8dbe/fanout-driver/CMakeLists.txt\"\nwrote: \"/home/runner/work/_temp/doctest-test-2zyq8dbe/fanout-driver/flake.nix\"\nwrote: \"/home/runner/work/_temp/doctest-test-2zyq8dbe/fanout-driver/metadata.json\"\nwrote: \"/home/runner/work/_temp/doctest-test-2zyq8dbe/fanout-driver/src/minimal_impl.cpp\"\nwrote: \"/home/runner/work/_temp/doctest-test-2zyq8dbe/fanout-driver/src/minimal_impl.h\"\nwrote: \"/home/runner/work/_temp/doctest-test-2zyq8dbe/fanout-driver/src\"\n", "status": "pass"}], "md": "### 3.1 Scaffold it\n\n```bash\nmkdir fanout-driver && cd fanout-driver\nnix flake init -t github:logos-co/logos-module-builder\n\n# The template ships an example minimal_impl class; this tutorial\n# supplies its own.\nrm -f src/minimal_impl.h src/minimal_impl.cpp\n```"}, {"execs": [{"cmd": "write fanout-driver/metadata.json", "kind": "file", "note": "Wrote fanout-driver/metadata.json", "status": "pass"}], "md": "### 3.2 metadata.json \u2014 a dependency, and no concurrency key\n\n```json\n{\n  \"name\": \"calc_fanout\",\n  \"display_name\": \"Fan-out Driver\",\n  \"version\": \"1.0.0\",\n  \"type\": \"core\",\n  \"category\": \"example\",\n  \"description\": \"An ordinary single-threaded module that drives calc_slow concurrently\",\n  \"main\": \"calc_fanout_plugin\",\n  \"interface\": \"universal\",\n  \"dependencies\": [\"calc_slow\"],\n\n  \"nix\": {\n    \"packages\": { \"build\": [], \"runtime\": [] },\n    \"external_libraries\": [],\n    \"cmake\": { \"find_packages\": [], \"extra_sources\": [], \"extra_include_dirs\": [], \"extra_link_libraries\": [] }\n  }\n}\n```"}, {"execs": [{"cmd": "write fanout-driver/src/calc_fanout_impl.h", "kind": "file", "note": "Wrote fanout-driver/src/calc_fanout_impl.h", "status": "pass"}], "md": "### 3.3 The module logic\n\n```cpp\n#pragma once\n\n#include <cstdint>\n#include <string>\n\n#include <logos_module_context.h>\n\n// An ORDINARY module: no \"concurrency\" key, so its own handlers are\n// dispatched one at a time and it needs no thread-safety. It still drives\n// calc_slow concurrently, because concurrency is a property of the CALLEE.\nclass CalcFanoutImpl : public LogosModuleContext {\npublic:\n    CalcFanoutImpl() = default;\n    ~CalcFanoutImpl() = default;\n\n    /// Fires `n` calls to calc_slow.work(ms) without waiting between them,\n    /// and returns immediately. Replies land later, on this module's own\n    /// event loop.\n    std::string fanOut(int64_t n, int64_t ms);\n\n    /// How many of those replies have come back so far.\n    int64_t repliesSeen() const;\n\nprivate:\n    int64_t m_replies = 0;\n};\n```"}, {"execs": [{"cmd": "write fanout-driver/src/calc_fanout_impl.cpp", "kind": "file", "note": "Wrote fanout-driver/src/calc_fanout_impl.cpp", "status": "pass"}], "md": "```cpp\n#include \"calc_fanout_impl.h\"\n\n#include <string>\n\n// Generated at build time. Defines `LogosModules` with one typed accessor\n// per metadata.json dependency \u2014 here `calc_slow`, a Rust module. Included\n// only in the .cpp, so the header the generator parses stays free of it.\n#include \"logos_sdk.h\"\n\nstd::string CalcFanoutImpl::fanOut(int64_t n, int64_t ms) {\n    for (int64_t i = 0; i < n; ++i) {\n        // The generated async caller returns immediately; the reply is\n        // delivered to the callback on this module's event loop. Because\n        // we never wait, all n calls are in flight at once.\n        modules().calc_slow.workAsync(ms, [this](int64_t) { ++m_replies; });\n    }\n    return \"fired \" + std::to_string(n);\n}\n\nint64_t CalcFanoutImpl::repliesSeen() const {\n    return m_replies;\n}\n```\n\n`workAsync` is the generated async overload \u2014 `<method>Async(args..., callback)`. It returns immediately, so the loop fires all `n` calls before any of them has replied. **The synchronous `work(ms)` would not do this**: it would block the driver's own event loop on each call in turn, and the kind": "run", "note": "", "output": "4\n", "status": "pass"}], "md": "```bash\nlogosctl call calc_fanout repliesSeen\n```"}, {"execs": [], "md": "## Step 5: Take the Key Away\n\nNow the control. Change `\"multi\"` to `\"single\"` in the worker's metadata and nothing else about the experiment \u2014 same driver, same fan-out, same call.\n\nThe trait has to change with it, because the two modes have different shapes: `single` hands your handler a `&mut self`, so the `Send + Sync` bound is no longer required either. That coupling is the feature, not an inconvenience \u2014 the mode you declare is the mode the compiler holds you to."}, {"execs": [{"cmd": "write slow-worker/metadata.json", "kind": "file", "note": "Wrote slow-worker/metadata.json", "status": "pass"}], "md": "### 5.1 Flip the key\n\n```json\n{\n  \"name\": \"calc_slow\",\n  \"display_name\": \"Slow Worker\",\n  \"version\": \"1.0.0\",\n  \"type\": \"core\",\n  \"interface\": \"cdylib\",\n  \"concurrency\": \"single\",\n  \"max_workers\": 4,\n  \"category\": \"example\",\n  \"description\": \"A deliberately slow worker that records how many calls overlap\",\n  \"main\": \"calc_slow_plugin\",\n  \"dependencies\": [],\n\n  \"codegen\": { \"rust\": { \"crate\": \"rust-lib\", \"trait\": \"CalcSlowModule\" } },\n\n  \"nix\": {\n    \"packages\": { \"build\": [], \"runtime\": [] },\n    \"external_libraries\": [],\n    \"cmake\": { \"find_packages\": [], \"extra_sources\": [], \"extra_include_dirs\": [], \"extra_link_libraries\": [] }\n  }\n}\n```"}, {"execs": [{"cmd": "write slow-worker/rust-lib/src/lib.rs", "kind": "file", "note": "Wrote slow-worker/rust-lib/src/lib.rs", "status": "pass"}], "md": "### 5.2 Follow it in the trait\n\nThree receivers become `&mut self`, and the `Sync` bound goes. The atomics can stay exactly as they are \u2014 they are simply no longer load-bearing:\n\n```\n//! calc_slow \u2014 the SINGLE-dispatch control for the same experiment.\n\nuse std::sync::atomic::{AtomicI64, Ordering};\n\n/// `single` is the default mode: handlers run one at a time on the module's\n/// event loop, so the receiver is `&mut self` and no `Sync` is needed.\npub trait CalcSlowModule: Send + 'static {\n    /// Blocks for `ms` milliseconds, then returns `ms`.\n    fn work(&mut self, ms: i64) -> i64;\n\n    /// The highest number of `work` calls that were ever in flight at once.\n    fn peak(&mut self) -> i64;\n\n    fn on_context_ready(&mut self, _ctx: &RustModuleContext) {}\n}\n\ninclude!(concat!(env!(\"CARGO_MANIFEST_DIR\"), \"/generated/provider_gen.rs\"));\n\n#[derive(Default)]\nstruct SlowWorker {\n    in_flight: AtomicI64,\n    max_seen: AtomicI64,\n}\n\nimpl CalcSlowModule for SlowWorker {\n    fn work(&mut self, ms: i64) -> i64 {\n        let now = self.in_flight.fetch_add(1, Ordering::SeqCst) + 1;\n        self.max_seen.fetch_max(now, Ordering::SeqCst);\n        std::thread::sleep(std::time::Duration::from_millis(ms.max(0) as u64));\n        self.in_flight.fetch_sub(1, Ordering::SeqCst);\n        ms\n    }\n\n    fn peak(&mut self) -> i64 {\n        self.max_seen.load(Ordering::SeqCst)\n    }\n}\n\n#[no_mangle]\npub extern \"Rust\" fn logos_module_install() {\n    install::<SlowWorker>();\n}\n```"}, {"execs": [{"cmd": "sh -c 'cd slow-worker && git add -A && nix build' && nix build 'path:./slow-worker#lgx-portable' --out-link worker-lgx", "exit_code": 0, "kind": "run", "note": "", "output": "warning: Git tree '/home/runner/work/_temp/doctest-test-2zyq8dbe/slow-worker' is dirty\nthese 9 derivations will be built:\n  /nix/store/38wdsdhd79lsb4d1lfinwav2ngz63kfc-cargo-vendor-dir.drv\n  /nix/store/ld46syr9qf4i9a0wf4dfy138jcmdyr05-logos-calc_slow-derived-lidl.drv\n  /nix/store/az05cnfmpiwpm37qmll9p12br3z71s5m-logos-calc_slow-lidl.drv\n  /nix/store/8z199fwn3bgylqzapma2i3pws14r3lyg-logos-calc_slow-module-headers-qt-1.0.0.drv\n  /nix/store/gikm68nd5fbwzspbw95wy1fxy0h9425k-logos-calc_slow-rust-scaffold.drv\n  /nix/store/ssl171axan40xvi9x0xziykdyb5p5j87-logos-calc_slow-rust-sr uman --config-dir ./session daemon stop", "exit_code": 0, "kind": "run", "note": "", "output": "Daemon shutdown initiated: Daemon shutting down.\n", "status": "pass"}], "md": "```bash\nlogosctl daemon stop\n```"}, {"execs": [], "md": "## Recap\n\n| | `single` (default) | `multi` |\n|---|---|---|\n| Dispatch | one call at a time, on the event loop | calls queue on a bounded reusable worker pool |\n| Rust receiver | `&mut self` | **`&self`**, bound `Send + Sync` |\n| Rust state | plain fields | interior mutability (`Mutex`, `RwLock`, `Atomic*`) \u2014 enforced by the compiler |\n| C++ | nothing to do | handlers may run concurrently; guard shared members yourself |\n| Measured peak | **1** | **4** |\n\n**Reach for `multi` when a handler blocks** \u2014 a slow network round-trip, a long download \u2014 and one caller waiting should not mean all of them waiting. A module whose methods return promptly gains nothing from it.\n\n**Decide early.** Retrofitting `multi` onto a module written around `&mut self` is a refactor. A module that expects to block is easier to write against `&self` from its first commit.\n\n### How it works, and its limits\n\n`multi` is realized **entirely by the code generator** \u2014 there is no new transport and no change to the provider/host ABI. A `multi` module's generated glue does not block in its dispatch entry point: it queues the handler on a bounded worker pool, returns a small *pending* marker, and pushes the real result back as a completion event when a worker finishes. The consumer side awaits that completion transparently. Because the host merely forwards the marker and the completion, **an existing daemon or app loads and runs a `multi` module unmodified** \u2014 this is logos-protocol **0.2**, an additive minor bump.\n\nThree caveats:\n\n1. A `single` module is unchanged and pays **zero** overhead.\n2. Events your handlers emit are delivered safely, but their order **relative to method replies is not guaranteed**. Do not rely on \"event X always arrives before method Y returns\".\n3. A *caller* built against logos-protocol < 0.2 sees the raw pending marker instead of the result. Rebuild callers against \u2265 0.2 \u2014 which stays compatible with every existing module.\n\nRelated: [Writing a Module in Rust](tutorial-rust-module.md) covers Rust authoring properly; [Composing Modules](tutorial-composing-modules.md) covers the async caller, events and persistence from the C++ side."}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
