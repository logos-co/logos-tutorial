r own build systems."}, {"execs": [{"cmd": "rm -f src/external_lib_impl.h src/external_lib_impl.cpp", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 1.2 Remove the template's example sources\n\nThe `with-external-lib` template ships an example implementation (`src/external_lib_impl.*`). Delete it \u2014 this tutorial supplies its own `src/calc_module_impl.*`:\n\n```bash\nrm -f src/external_lib_impl.h src/external_lib_impl.cpp\n```"}, {"execs": [], "md": "## Step 2: Write the C Library\n\nCreate the C library that your module will wrap. Place the header and implementation in the `lib/` directory."}, {"execs": [{"cmd": "mkdir -p lib", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 2.1 Create the lib directory\n\n```bash\nmkdir -p lib\n```"}, {"execs": [{"cmd": "write lib/libcalc.h", "kind": "file", "note": "Wrote lib/libcalc.h", "status": "pass"}], "md": "### 2.2 Write the C header\n\nCreate `lib/libcalc.h`:\n\n```c\n#ifndef LIBCALC_H\n#define LIBCALC_H\n\n#ifdef __cplusplus\nextern \"C\" {\n#endif\n\n/** Add two integers. */\nint calc_add(int a, int b);\n\n/** Multiply two integers. */\nint calc_multiply(int a, int b);\n\n/** Compute factorial of n (n must be >= 0). Returns -1 on error. */\nint calc_factorial(int n);\n\n/** Compute the nth Fibonacci number (n must be >= 0). Returns -1 on error. */\nint calc_fibonacci(int n);\n\n/** Return the library version string. Caller must NOT free. */\nconst char* calc_version(void);\n\n#ifdef __cplusplus\n}\n#endif\n\n#endif /* LIBCALC_H */\n```\n\nThe `extern \"C\"` block is essential \u2014 it prevents C++ name mangling so the Logos module can find the symbols."}, {"execs": [{"cmd": "write lib/libcalc.c", "kind": "file", "note": "Wrote lib/libcalc.c", "status": "pass"}], "md": "### 2.3 Write the C implementation\n\nCreate `lib/libcalc.c`:\n\n```c\n#include \"libcalc.h\"\n\nint calc_add(int a, int b)\n{\n    return a + b;\n}\n\nint calc_multiply iversal`) pattern** you only hand-write a single C++ class \u2014 `metadata.json`, `CMakeLists.txt`, and `flake.nix` tell the build system the rest, and `logos-cpp-generator` synthesizes the Qt plugin wrapper.\n\nAfter this step your project will look like this:\n\n| File                          | Role                                                              |\n| ----------------------------- | ----------------------------------------------------------------- |\n| `metadata.json`               | Module metadata + nix build settings (note `interface: universal`)|\n| `CMakeLists.txt`              | Lists your impl source files                                      |\n| `flake.nix`                   | Nix build (description, dependency inputs)                        |\n| `src/calc_module_impl.h`      | Plain C++ class declaration \u2014 **no Qt**                           |\n| `src/calc_module_impl.cpp`    | Implementation: each method calls the C library                   |\n\n```\nlogos-calc-module/\n\u251c\u2500\u2500 flake.nix          # Nix build configuration (~10 lines)\n\u251c\u2500\u2500 metadata.json      # Module metadata, build settings, and runtime config\n\u251c\u2500\u2500 CMakeLists.txt     # CMake build file\n\u251c\u2500\u2500 lib/\n\u2502   \u251c\u2500\u2500 libcalc.h      # C library header\n\u2502   \u2514\u2500\u2500 libcalc.c      # C library source (compiled by CMake)\n\u2514\u2500\u2500 src/\n    \u251c\u2500\u2500 calc_module_impl.h     # Plain C++ class (no Qt, no plugin macros)\n    \u2514\u2500\u2500 calc_module_impl.cpp   # Implementation (wrapping logic)\n```\n\n> **Where did the `*_interface.h` / `*_plugin.h` / `*_plugin.cpp` files go?** The older pattern made you hand-write a Qt `QObject` plugin, an abstract interface, and the `Q_INVOKABLE` / `Q_PLUGIN_METADATA` boilerplate. With `interface: universal`, the generator derives all of that from your plain class \u2014 so those three files no longer exist in your source tree. They are emitted into `generated_code/` at build time."}, {"execs": [{"cmd": "write metadata.json", "kind": "file", "note": "Wrote metadata.json", "status": "pass"}], "md": "### 3.1 `metadata.json` \u2014 Module Configuration\n\n> **Edit:** Set `name`, `description`, `main`, add `\"interface\": \"universal\"`, and declare your library under `nix.external_libraries`.\n\nThis is the single source of truth for your module. It is embedded into the generated plugin binary (for runtime metadata via `lm`), read by `logos-module-builder` to configure the Nix build, used by CMake to resolve and link external libraries (via the `nix` section), and used by `nix-bundle-lgx` to generate the LGX manifest.\n\n```json\n{\n  \"name\": \"calc_module\",\n  \"version\": \"1.0.0\",\n  \"type\": \"core\",\n  \"category\": \"general\",\n  \"description\": \"Calculator module wrapping libcalc C library\",\n  \"main\": \"calc_module_plugin\",\n  \"interface\": \"universal\",\n  \"dependencies\": [],\n\n  \"nix\": {\n    \"packages\": {\n      \"build\": [],\n      \"runtime\": []\n    },\n    \"external_libraries\": [\n      {\n        \"name\": \"calc\",\n        \"vendor_path\": \"lib\"\n      }\n    ],\n    \"cmake\": {\n      \"find_packages\": [],\n      \"extra_sources\": [],\n      \"extra_include_dirs\": [\"lib\"],\n      \"extra_link_libraries\": []\n    }\n  }\n}\n```\n\n**Key fields explained:**\n\n| Field                          | What it does                                                                                                                                                                                                       |\n| ------------------------------ | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |\n| `name`                         | Module name \u2014 must be a valid C identifier (used in filenames, method calls)                                                                                                                                       |\n| `main`                         | The generated plugin's name, `<name>_plugin`. You don't write this file; the builder produces `calc_module_plugin.so` / `.dylib`                                                                                   |\n| `interface`                    | `\"universal\"` selects the pure-C++ pattern. The builder parses `src/calc_module_impl.h` into a LIDL contract and generates the Qt plugin glue from it, so you never touch Qt directly                        |\n| `nix.external_libraries`       | Declares C/C++ libraries vendored in the repo. Each entry has a `name` (the CMake target) and `vendor_path` (directory with the source/binary). The build compiles the library and links it into the plugin        |\n| `nix.cmake.extra_include_dirs` | Added to the include path so your C++ code can `#include \"lib/libcalc.h\"`                                                                                                                                          |"}, {"execs": [{"cmd": "write CMakeLists.txt", "kind": "file", "note": "Wrote CMakeLists.txt", "status": "pass"}], "md": "### 3.2 `CMakeLists.txt` \u2014 Build File\n\n> **Edit:** Set `project()` name, `NAME`, the `SOURCES` (your two impl files), and `EXTERNAL_LIBS`.\n\nFor a universal module you list only your plain C++ source files. The generated glue (`generated_code/*.cpp`) is picked up automatically by `LogosModule.cmake` \u2014 you don't reference it here.\n\n```cmake\ncmake_minimum_required(VERSION 3.14)\nproject(CalcModulePlugin LANGUAGES CXX)\n\n# Include the Logos Module CMake helper (provided by logos-module-builder)\nif(DEFINED ENV{LOGOS_MODULE_BUILDER_ROOT})\n    include($ENV{LOGOS_MODULE_BUILDER_ROOT}/cmake/LogosModule.cmake)\nelseif(EXISTS \"${CMAKE_CURRENT_SOURCE_DIR}/cmake/LogosModule.cmake\")\n    include(cmake/LogosModule.cmake)\nelse()\n    message(FATAL_ERROR \"LogosModule.cmake not found\")\nendif()\n\n# Define the module with its external library dependency.\n# Because metadata.json sets `interface: universal`, the builder runs\n# logos-cpp-generator over src/calc_module_impl.h before configuring,\n# and LogosModule.cmake compiles the generated glue automatically.\nlogos_module(\n    NAME calc_module\n    SOURCES\n        src/calc_module_impl.h\n        src/calc_module_impl.cpp\n    EXTERNAL_LIBS\n        calc\n)\n```\n\nYou **must** keep these in sync with `metadata.json`:\n\n- **`NAME`** \u2014 your module name (must match `name` in `metadata.json`, e.g., `calc_module`)\n- **`SOURCES`** \u2014 your impl files (`src/calc_module_impl.h`, `src/calc_module_impl.cpp`)\n- **`EXTERNAL_LIBS`** \u2014 external libraries to link (must match `nix.external_libraries[].name` in `metadata.json`)\n\nThe `if/elseif/else` block above it is boilerplate \u2014 don't change it.\n\n> **Common mistake:** If `NAME` doesn't match `name` in `metadata.json`, the build may succeed but the install phase fails because it looks for `<name>_plugin.so`/`.dylib` based on `metadata.json`.\n\n**How `EXTERNAL_LIBS calc` works:** `logos_module()` searches `lib/` for `libcalc.so` (Linux) / `libcalc.dylib` (macOS), links it to your plugin, and sets up RPATH so the library is found at runtime."}, {"execs": [{"cmd": "write flake.nix", "kind": "file", "note": "Wrote flake.nix", "status": "pass"}], "md": "### 3.3 `flake.nix` \u2014 Nix Build Config\n\nChange `description`. Add flake inputs here if your module depends on other modules or fetches a library from source.\n\n```nix\n{\n  description = \"Calculator module - wraps libcalc C library for Logos\";\n\n  inputs = {\n    logos-module-builder.url = \"github:logos-co/logos-module-builder\";\n  };\n\n  outputs = inputs@{ logos-module-builder, ... }:\n    logos-module-builder.lib.mkLogosModule {\n      src = ./.;\n      configFile = ./metadata.json;\n      flakeInputs = inputs;\n    };\n}\n```\n\nThat's it \u2014 `mkLogosModule` handles all the Nix complexity (fetching Qt, the SDK, the code generators, deriving the LIDL contract from your header, setting up include paths, etc.). `configFile` points to `metadata.json` (the single source of truth) and `flakeInputs = inputs` passes all flake inputs to the builder so that dependencies declared in `metadata.json` are resolved automatically.\n\n> **Naming flake inputs:** When adding module dependencies, the flake input attribute name **must match** the `name` field in that dependency's `metadata.json`. For example, if you depend on a module whose `metadata.json` has `\"name\": \"waku_module\"`, your flake input must be `waku_module.url = \"github:logos-co/logos-waku-module\"`."}, {"execs": [{"cmd": "write src/calc_module_impl.h", "kind": "file", "note": "Wrote src/calc_module_impl.h", "status": "pass"}], "md": "### 3.4 `src/calc_module_impl.h` \u2014 The Module Class\n\nThis is the **only interface you write**, and it's plain C++ \u2014 no `QObject`, no `Q_INVOKABLE`, no plugin macros, no Qt headers at all. Every `public` method becomes a method other modules (and `logosctl`) can call. The code generator parses this header as text to derive the wire signatures, so keep it to the supported types (see the table below).\n\nWe also inherit `LogosModuleContext` so the class can emit events (the `logos_events:` block) and, if needed later, call other modules \u2014 without ever touching the raw `LogosAPI`.\n\n```cpp\n#pragma once\n\n#include <cstdint>\n#include <string>\n\n#include <logos_module_context.h>  // LogosModuleContext base + `logos_events:`\n\n// Include the C library header (extern \"C\" already in the header).\nextern \"C\" {\n    #include \"lib/libcalc.h\"\n}\n\nclass CalcModuleImpl : public LogosModuleContext {\npublic:\n    CalcModuleImpl() = default;\n    ~CalcModuleImpl() = default;\n\n    // \u2500\u2500 Public API \u2014 every method here is callable over IPC \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    // The generator maps C++ types onto the contract automatically:\n    //   int64_t  \u2194 int      std::string \u2194 tstr      bool \u2194 bool\n    //\n    // A doc comment directly above a method becomes that method's\n    // `description` in the module's method introspection \u2014 surfaced\n    // by `lm`, `logosctl module show`, and Basecamp's Methods list.\n    // Use `///` (one or more lines) or a `/** ... */` block; the\n    // comment's line breaks are preserved. (Plain `//` comments like\n    // this block are ignored, so they never leak into the API.)\n\n    /// Adds two integers and returns the sum.\n    int64_t add(int64_t a, int64_t b);\n\n    /// Multiplies two integers and returns the product.\n    int64_t multiply(int64_t a, int64_t b);\n\n    // A multi-line description: consecutive `///` lines keep their breaks.\n    /// Computes the factorial n! of a non-negative integer.\n    /// Defined as n * (n-1) * ... * 1, with 0! = 1.\n    int64_t factorial(int64_t n);\n\n    /// Returns the nth Fibonacci number (0-indexed).\n    int64_t fibonacci(int64_t n);\n\n    // A `/** ... */` block comment works too (line breaks preserved).\n    /**\n     * Returns the version string of the wrapped libcalc C library.\n     * Read straight from the linked native library, not metadata.json.\n     */\n    std::string libVersion();\n\n    /// Looks up the library version and emits it as a `versionReady`\n    /// event instead of returning it. Used by the QML tutorial (Part 2).\n    void libVersionNotify();\n\n    // \u2500\u2500 Events \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    // Declared like Qt signals. The generator emits the body (in\n    // calc_module_events.cpp) that routes the typed args to subscribers\n    // via the host's `eventResponse` mechanism. QML subscribes with\n    // logos.onModuleEvent(\"calc_module\", \"versionReady\").\n    //\n    // A `///` doc comment documents the event too \u2014 it surfaces as the\n    // event's `description` alongside methods (`lm events`, `logosctl\n    // module show`, and Basecamp's Interface screen).\nlogos_events:\n    /// Emitted by libVersionNotify() once the library version is known.\n    /// Carries the version string read from libcalc.\n    void versionReady(const std::string& version);\n};\n```\n\n**Rules for the impl class:**\n\n- It's a normal C++ class. Any `public` method is exposed; `private` members and helpers are not.\n- **Supported parameter/return types** (what the generator can translate):\n\n  | C++ type                    | LIDL contract type | A Qt consumer sees |\n  | --------------------------- | ------------------ | ------------------ |\n  | `void`                      | `void`             | `void`             |\n  | `bool`                      | `bool`             | `bool`             |\n  | `int64_t`                   | `int`              | `qlonglong`        |\n  | `uint64_t`                  | `uint`             | `qulonglong`       |\n  | `double`                    | `float64`          | `double`           |\n  | `std::string`               | `tstr`             | `QString`          |\n  | `std::vector<std::string>`  | `[tstr]`           | `QStringList`      |\n  | `std::vector<uint8_t>`      | `bstr`             | `QByteArray`       |\n  | `LogosMap` / `LogosList`    | `{tstr: any}` / `[any]` (from `<logos_json.h>`) | `QVariantMap` / `QVariantList` |\n  | `StdLogosResult`            | `result`           | `LogosResult` (from `<logos_result.h>`) \u2014 `{ success, value, error }` |\n\n  The **middle** column is the one your module publishes about itself \u2014\n  it is what `lm` prints in Step 5, and what any other language's\n  binding of this contract sees. The right column is what a *C++/Qt*\n  caller of this module compiles against; a Rust or Nim caller gets\n  that language's spelling of the same middle column.\n\n- Use `int64_t` for integers (not `int`) \u2014 that's the type the parser recognizes.\n- **Document methods with `///`.** A doc comment (`///` or `/** \u2026 */`) directly above a method becomes its `description` in the module's introspection, surfaced by `lm`, `logosctl module show`, and Basecamp. Plain `//` comments are ignored, so only intentional docs are exposed \u2014 you'll see this in action in Step 5.\n- Events are declared in a `logos_events:` section. The token is recognized by the generator before preprocessing; under a normal compile it just expands to `public`."}, {"execs": [{"cmd": "write src/calc_module_impl.cpp", "kind": "file", "note": "Wrote src/calc_module_impl.cpp", "status": "pass"}], "md": "### 3.5 `src/calc_module_impl.cpp` \u2014 Implementation\n\nEach method calls the corresponding C function and converts the result. No Qt types appear anywhere \u2014 you work in plain C++ and the generated glue handles the wire conversion.\n\n```cpp\n#include \"calc_module_impl.h\"\n\nint64_t CalcModuleImpl::add(int64_t a, int64_t b)\n{\n    return calc_add(static_cast<int>(a), static_cast<int>(b));\n}\n\nint64_t CalcModuleImpl::multiply(int64_t a, int64_t b)\n{\n    return calc_multiply(static_cast<int>(a), static_cast<int>(b));\n}\n\nint64_t CalcModuleImpl::factorial(int64_t n)\n{\n    return calc_factorial(static_cast<int>(n));\n}\n\nint64_t CalcModuleImpl::fibonacci(int64_t n)\n{\n    return calc_fibonacci(static_cast<int>(n));\n}\n\nstd::string CalcModuleImpl::libVersion()\n{\n    return std::string(calc_version());\n}\n\nvoid CalcModuleImpl::libVersionNotify()\n{\n    // Emit the event declared in `logos_events:`. When the module is\n    // loaded by a host, this reaches every subscriber. When the class\n    // is constructed outside a host (e.g. in unit tests), it is a\n    // safe no-op.\n    versionReady(std::string(calc_version()));\n}\n```\n\n**The wrapping pattern** is always the same:\n\n1. Call the C function (convert `int64_t` \u2192 `int` for libcalc's `int` API)\n2. Convert the C result to a C++ type if needed (e.g., `const char*` \u2192 `std::string`)\n3. Return it \u2014 the generated glue marshals it onto the wire\n\nNotice what you **didn't** write: no `initLogos`, no `Q_INVOKABLE`, no `name()`/`version()` (read from `metadata.json`), no `lidl()` (the canonical interface document), no signal declaration. The generator produces all of it from the header."}, {"execs": [], "md": "## Step 4: Build the Module"}, {"execs": [{"cmd": "write .gitignore", "kind": "file", "note": "Wrote .gitignore", "status": "pass"}], "md": "### 4.1 Initialize the Git repo\n\nNix flakes require a git repository.\n\nBefore staging files, create a `.gitignore` to exclude build artifacts:\n\n```text\n# Nix build output\nresult\nresult-*\n\n# CMake build directory\nbuild/\n```"}, {"execs": [{"cmd": "git init", "exit_code": 0, "kind": "run", "note": "", "output": "hint: Using 'master' as the name for the initial branch. This default branch name\nhint: will change to \"main\" in Git 3.0. To configure the initial branch name\nhint: to use in all of your new repositories, which will suppress this warning,\nhint: call:\nhint:\nhint: \tgit config --global init.defaultBranch <name>\nhint:\nhint: Names commonly chosen instead of 'master' are 'main', 'trunk' and\nhint: 'development'. The just-created branch can be renamed via this command:\nhint:\nhint: \tgit branch -m <name>\nhint:\nhint: Disable this message with \"git config set advice.defaultBranchName false\"\nInitialized empty Git repository in /home/runner/work/_temp/doctest-chain-dq8byh6w/logos-calc-module/.git/\n", "status": "pass"}], "md": "Then initialise the repo:\n\n```bash\ngit init\n```"}, {"execs": [{"cmd": "git add -A", "exit_code": 0, "kind": "run", "note": "  5.1 Build the `lm` tool\n\nThe `lm` CLI inspects compiled module binaries. Build it from the `logos-module` repo:\n\n```bash\nnix build 'github:logos-co/logos-module#lm' --out-link ./lm\n```"}, {"execs": [{"cmd": "./lm/bin/lm metadata result/lib/calc_module_plugin.so", "exit_code": 0, "kind": "run", "note": "", "output": "Plugin Metadata:\n================\nName:         calc_module\nDisplay name: (unset \u2014 falls back to name)\nVersion:      1.0.0\nDescription:  Calculator module wrapping libcalc C library\nAuthor:       \nType:         core\nProtocol:     0.9.0\nDependencies: (none)\n", "status": "pass"}], "md": "### 5.2 View metadata\n\n```bash\n# Linux\n./lm/bin/lm metadata result/lib/calc_module_plugin.so\n\n# macOS\n./lm/bin/lm metadata result/lib/calc_module_plugin.dylib\n```\n\nOutput:\n\n```\nPlugin Metadata:\n================\nName:         calc_module\nDisplay name: (unset \u2014 falls back to name)\nVersion:      1.0.0\nDescription:  Calculator module wrapping libcalc C library\nAuthor:\nType:         core\nProtocol:     0.9.0\nDependencies: (none)\n```"}, {"execs": [{"cmd": "./lm/bin/lm methods result/lib/calc_module_plugin.so", "exit_code": 0, "kind": "run", "note": "", "output": "Plugin Methods:\n===============\n\nint add(int a, int b)\n  Signature: add(int,int)\n  Invokable: yes\n  Description: Adds two integers and returns the sum.\n\nint multiply(int a, int b)\n  Signature: multiply(int,int)\n  Invokable: yes\n  Description: Multiplies two integers and returns the product.\n\nint factorial(int n)\n  Signature: factorial(int)\n  Invokable: yes\n  Description:\n    Computes the factorial n! of a non-negative integer.\n    Defined as n * (n-1) * ... * 1, with 0! = 1.\n\nint fibonacci(int n)\n  Signature: fibonacci(int)\n  Invokable: yes\n  Description: Returns the nth Fibonacci number (0-indexed).\n\ntstr libVersion()\n  Signature: libVersion()\n  Invokable: yes\n  Description:\n    Returns the version string of the wrapped libcalc C library.\n    Read straight from the linked native library, not metadata.json.\n\nvoid libVersionNotify()\n  Signature: libVersionNotify()\n  Invokable: yes\n  Description:\n    Looks up the library version and emits it as a `versionReady`\n    event instead of returning it. Used by the QML tutorial (Part 2).\n\ntstr name()\n  Signature: name()\n  Invokable: yes\n  Description: The module's name, as declared in its metadata.\n\ntstr version()\n  Signature: version()\n  Invokable: yes\n  Description: The module's version, as declared in its metadata.\n\ntstr lidl()\n  Signature: lidl()\n  Invokable: yes\n  Description: The module's canonical LIDL interface document.\n\n", "status": "pass"}], "md": "### 5.3 List methods\n\n```bash\n# Linux\n./lm/bin/lm methods result/lib/calc_module_plugin.so\n\n# macOS\n./lm/bin/lm methods result/lib/calc_module_plugin.dylib\n```\n\nOutput \u2014 each method you declared, with its doc comment as a\n`Description`, plus the three built-ins (`name`, `version`, `lidl`)\nthe generator derives from `metadata.json` and the canonical contract\nso every module answers them without you writing them. A single-line comment renders inline; a\nmulti-line comment (`factorial`'s two `///` lines, `libVersion`'s\n`/** ... */` block, and `libVersionNotify`'s two `///` lines) keeps\nits line breaks:\n\n```\nPlugin Methods:\n===============\n\nint add(int a, int b)\n  Signature: add(int,int)\n  Invokable: yes\n  Description: Adds two integers and returns the sum.\n\nint multiply(int a, int b)\n  Signature: multiply(int,int)\n  Invokable: yes\n  Description: Multiplies two integers and returns the product.\n\nint factorial(int n)\n  Signature: factorial(int)\n  Invokable: yes\n  Description:\n    Computes the factorial n! of a non-negative integer.\n    Defined as n * (n-1) * ... * 1, with 0! = 1.\n\nint fibonacci(int n)\n  Signature: fibonacci(int)\n  Invokable: yes\n  Description: Returns the nth Fibonacci number (0-indexed).\n\ntstr libVersion()\n  Signature: libVersion()\n  Invokable: yes\n  Description:\n    Returns the version string of the wrapped libcalc C library.\n    Read straight from the linked native library, not metadata.json.\n\nvoid libVersionNotify()\n  Signature: libVersionNotify()\n  Invokable: yes\n  Description:\n    Looks up the library version and emits it as a `versionReady`\n    event instead of returning it. Used by the QML tutorial (Part 2).\n\ntstr name()\n  Signature: name()\n  Invokable: yes\n  Description: The module's name, as declared in its metadata.\n\ntstr version()\n  Signature: version()\n  Invokable: yes\n  Description: The module's version, as declared in its metadata.\n\ntstr lidl()\n  Signature: lidl()\n  Invokable: yes\n  Description: The module's canonical LIDL interface document.\n```\n\nThree things to notice:\n\n- **Signatures are in LIDL, not C++** (`int`, `tstr`) even though you wrote `int64_t` / `std::string`. `lm` reports what the module *publishes about itself*, and a module publishes its **contract** \u2014 so `int64_t add(int64_t, int64_t)` shows up as `add(int,int)`. That is the same vocabulary as the `.lidl` the build derived from your header, and it is the only vocabulary in which this question has one right answer: your module is Qt-free, and a reader in Rust or Nim asking the same module the same question gets the same words back. Note `int` here is LIDL's `int`, which is **64-bit** \u2014 each type in the contract maps to exactly one type per language, and integers are 64-bit throughout, so a value that fits your `int64_t` cannot be silently truncated on the way across.\n- **Each `Description` is your doc comment**, carried through the module's method introspection. Plain `//` comments (like the type-mapping note in the header) are deliberately ignored, so only intentional docs surface; an undocumented method simply omits it.\n- **Line breaks are preserved** \u2014 a single-line comment renders inline; a multi-line comment (`factorial`, `libVersion`, `libVersionNotify`) keeps its breaks. The same descriptions appear in `logosctl module show` and Basecamp's Methods list."}, {"execs": [{"cmd": "./lm/bin/lm methods result/lib/calc_module_plugin.so --json", "exit_code": 0, "kind": "run", "note": "", "output": "[\n    {\n        \"description\": \"Adds two integers and returns the sum.\",\n        \"isInvokable\": true,\n        \"name\": \"add\",\n        \"parameters\": [\n            {\n                \"name\": \"a\",\n                \"type\": \"int\"\n            },\n            {\n                \"name\": \"b\",\n                \"type\": \"int\"\n            }\n        ],\n        \"returnType\": \"int\",\n        \"signature\": \"add(int,int)\"\n    },\n    {\n        \"description\": \"Multiplies two integers and returns the product.\",\n        \"isInvokable\": true,\n        \"name\": \"multiply\",\n        \"parameters\": [\n            {\n                \"name\": \"a\",\n                \"type\": \"int\"\n            },\n            {\n                \"name\": \"b\",\n                \"type\": \"int\"\n            }\n        ],\n        \"returnType\": \"int\",\n        \"signature\": \"multiply(int,int)\"\n    },\n    {\n        \"description\": \"Computes the factorial n! of a non-negative integer.\\nDefined as n * (n-1) * ... * 1, with 0! = 1.\",\n        \"isInvokable\": true,\n        \"name\": \"factorial\",\n        \"parameters\": [\n            {\n                \"name\": \"n\",\n                \"type\": \"int\"\n            }\n        ],\n        \"returnType\": \"int\",\n        \"signature\": \"factorial(int)\"\n    },\n    {\n        \"description\": \"Returns the nth Fibonacci number (0-indexed).\",\n        \"isInvokable\": true,\n        \"name\": \"fibonacci\",\n        \"parameters\": [\n            {\n                \"name\": \"n\",\n                \"type\": \"int\"\n            }\n        ],\n        \"returnType\": \"int\",\n        \"signature\": \"fibonacci(int)\"\n    },\n    {\n        \"description\": \"Returns the version string of the wrapped libcalc C library.\\nRead straight from the linked native library, not metadata.json.\",\n        \"isInvokable\": true,\n        \"name\": \"libVersion\",\n        \"returnType\": \"tstr\",\n        \"signature\": \"libVersion()\"\n    },\n    {\n        \"description\": \"Looks up the library version and emits it as a `versionReady`\\nevent instead of returning it. Used by the QML tutorial (Part 2).\",\n        \"isInvokable\": true,\n        \"name\": \"libVersionNotify\",\n        \"returnType\": \"void\",\n        \"signature\": \"libVersionNotify()\"\n    },\n    {\n        \"description\": \"The module's name, as declared in its metadata.\",\n        \"isInvokable\": true,\n        \"name\": \"name\",\n        \"returnType\": \"tstr\",\n        \"signature\": \"name()\"\n    },\n    {\n        \"description\": \"The module's version, as declared in its metadata.\",\n        \"isInvokable\": true,\n        \"name\": \"version\",\n        \"returnType\": \"tstr\",\n        \"signature\": \"version()\"\n    },\n    {\n        \"description\": \"The module's canonical LIDL interface document.\",\n        \"isInvokable\": true,\n        \"name\": \"lidl\",\n        \"returnType\": \"tstr\",\n        \"signature\": \"lidl()\"\n    }\n]\n", "status": "pass"}], "md": "### 5.4 JSON output\n\nFor scripting and CI, use `--json`:\n\n```bash\n# Linux\n./lm/bin/lm methods result/lib/calc_module_plugin.so --json\n\n# macOS\n./lm/bin/lm methods result/lib/calc_module_plugin.dylib --json\n```\n\n```json\n[\n    {\n        \"description\": \"Adds two integers and returns the sum.\",\n        \"isInvokable\": true,\n        \"name\": \"add\",\n        \"parameters\": [\n            { \"name\": \"a\", \"type\": \"int\" },\n            { \"name\": \"b\", \"type\": \"int\" }\n        ],\n        \"returnType\": \"int\",\n        \"signature\": \"add(int,int)\"\n    },\n    ...\n]\n```\n\nThe `description` field is the method's doc comment. A multi-line\ncomment is carried verbatim with embedded `\\n` (e.g. `factorial`:\n`\"Computes the factorial n! of a non-negative integer.\\nDefined as\nn * (n-1) * ... * 1, with 0! = 1.\"`). Methods without a doc comment\nomit the field."}, {"execs": [{"cmd": "./lm/bin/lm events result/lib/calc_module_plugin.so", "exit_code": 0, "kind": "run", "note": "", "output": "Plugin Events:\n==============\n\nvoid versionReady(tstr version)\n  Signature: versionReady(tstr)\n  Description:\n    Emitted by libVersionNotify() once the library version is known.\n    Carries the version string read from libcalc.\n\n", "status": "pass"}], "md": "### 5.5 List events\n\nEvents (your `logos_events:` block) are part of the module's API too, and\nare introspectable the same way \u2014 `lm events` lists each event with its\nsignature and `///` description:\n\n```bash\n# Linux\n./lm/bin/lm events result/lib/calc_module_plugin.so\n\n# macOS\n./lm/bin/lm events result/lib/calc_module_plugin.dylib\n```\n\n```\nPlugin Events:\n==============\n\nvoid versionReady(tstr version)\n  Signature: versionReady(tstr)\n  Description:\n    Emitted by libVersionNotify() once the library version is known.\n    Carries the version string read from libcalc.\n```\n\nEvents have no return type (they're fire-and-forget). Running `lm`\nwith no subcommand prints metadata, methods, **and** events together.\nThe same event docs appear in `logosctl module show` and Basecamp's\nInterface screen."}, {"execs": [], "md": "## Step 6: Test with `logosctl`"}, {"execs": [{"cmd": "nix build 'github:logos-co/logos-logoscore-cli#ctl-bundle-dir' --out-link ./logosctl", "exit_code": 0, "kind": "run", "note": "", "output": "unpacking 'github:logos-co/logos-logoscore-cli/11ccd051256050ae229f9f1598eabd3088d64975' into the Git cache...\ncopying path '/nix/store/fsk259hcgpfwvg876qjpg0wd7a91bm7f-source' from 'https://cache.nix.logos.co/public'...\ncopying path '/nix/store/3kw8cx1399pzk9f3l4i1rajvk9hfd715-source' fro             # (or .so on Linux)\n\u251c\u2500\u2500 assets/lidl/               # The module's interface, in LIDL\n\u251c\u2500\u2500 manifest.json              # Package manifest\n\u251c\u2500\u2500 variant                    # Platform variant identifier\n\u2514\u2500\u2500 ...                        # Runtime libraries bundled by the portable build\n```"}, {"execs": [{"cmd": "./logosctl/bin/logosctl --human --config-dir ./session module load calc_module", "exit_code": 0, "kind": "run", "note": "", "output": "Loaded module: calc_module (v1.0.0)\n", "status": "pass"}], "md": "### 6.4 Load the module\n\n```bash\nlogosctl module load calc_module\n```"}, {"execs": [{"cmd": "./logosctl/bin/logosctl --human --config-dir ./session module show calc_module", "exit_code": 0, "kind": "run", "note": "", "output": "Name:          calc_module\nVersion:       v1.0.0\nStatus:        loaded\nPID:           0\nUptime:        0s\n\nMethods:\n  add(a: int, b: int) -> int\n      Adds two integers and returns the sum.\n  multiply(a: int, b: int) -> int\n      Multiplies two integers and returns the product.\n  factorial(n: int) -> int\n      Computes the factorial n! of a non-negative integer.\n      Defined as n * (n-1) * ... * 1, with 0! = 1.\n  fibonacci(n: int) -> int\n      Returns the nth Fibonacci number (0-indexed).\n  libVersion() -> tstr\n      Returns the version string of the wrapped libcalc C library.\n      Read straight from the linked native library, not metadata.json.\n  libVersionNotify() -> void\n      Looks up the library version and emits it as a `versionReady`\n      event instead of returning it. Used by the QML tutorial (Part 2).\n  name() -> tstr\n      The module's name, as declared in its metadata.\n  version() -> tstr\n      The module's version, as declared in its metadata.\n  lidl() -> tstr\n      The module's canonical LIDL interface document.\n\nEvents:\n  versionReady(version: tstr)\n      Emitted by libVersionNotify() once the library version is known.\n      Carries the version string read from libcalc.\n", "status": "pass"}], "md": "### 6.5 Inspect methods and events\n\n`module show` lists each method **and event** with its signature and the doc-comment description you wrote \u2014 the same docs `lm` showed, here straight from the module's introspection:\n\n```bash\nlogosctl module show calc_module\n```\n\n```\nName:          calc_module\nVersion:       v1.0.0\nStatus:        loaded\n\nMethods:\n  add(a: int, b: int) -> int\n      Adds two integers and returns the sum.\n  multiply(a: int, b: int) -> int\n      Multiplies two integers and returns the product.\n  factorial(n: int) -> int\n      Computes the factorial n! of a non-negative integer.\n      Defined as n * (n-1) * ... * 1, with 0! = 1.\n  fibonacci(n: int) -> int\n      Returns the nth Fibonacci number (0-indexed).\n  libVersion() -> tstr\n      Returns the version string of the wrapped libcalc C library.\n      Read straight from the linked native library, not metadata.json.\n  libVersionNotify() -> void\n      Looks up the library version and emits it as a `versionReady`\n      event instead of returning it. Used by the QML tutorial (Part 2).\n  name() -> tstr\n      The module's name, as declared in its metadata.\n  version() -> tstr\n      The module's version, as declared in its metadata.\n  lidl() -> tstr\n      The module's canonical LIDL interface document.\n\nEvents:\n  versionReady(version: tstr)\n      Emitted by libVersionNotify() once the library version is known.\n      Carries the version string read from libcalc.\n```\n\nMethods and events both show their doc comments (multi-line ones keep\ntheir line breaks). An undocumented method or event still appears, just\nwithout the indented description."}, {"execs": [{"cmd": "./logosctl/bin/logosctl --human --config-dir ./session call calc_module add 3 5", "exit_code": 0, "kind": "run", "note": "", "output": "8\n", "status": "pass"}], "md": "### 6.6 Call methods\n\nNow call them:\n\n```bash\nlogosctl call calc_module add 3 5\n```"}, {"execs": [{"cmd": "./logosctl/bin/logosctl --human --config-dir ./session call calc_module factorial 5", "exit_code": 0, "kind": "run", "note": "", "output": "120\n", "status": "pass"}], "md": "```bash\nlogosctl call calc_module factorial 5\n```"}, {"execs": [{"cmd": "./logosctl/bin/logosctl --human --config-dir ./session call calc_module fibonacci 10", "exit_code": 0, "kind": "run", "note": "", "output": "55\n", "status": "pass"}], "md": "```bash\nlogosctl call calc_module fibonacci 10\n```"}, {"execs": [{"cmd": "./logosctl/bin/logosctl --human --config-dir ./session call calc_module libVersion", "exit_code": 0, "kind": "run", "note": "", "output": "1.0.0\n", "status": "pass"}], "md": "```bash\nlogosctl call calc_module libVersion\n```"}, {"execs": [{"cmd": "./logosctl/bin/logosctl --human --config-dir ./session daemon stop", "exit_code": 0, "kind": "run", "note": "", "output": "Daemon shutdown initiated: Daemon shutting down.\n", "status": "pass"}], "md": "```bash\nlogosctl daemon stop\n```\n\n> For every command and option, see the [Logos CLI reference](https://docs.logos.co/core/reference/logos-cli-reference).\n\n**What happens under the hood:**\n\n1. `logosctl install` unpacks the package into the session's `modules/` directory, and the daemon rescans it\n2. `module load` starts a `logos_host` process that loads `calc_module_plugin` (the generated wrapper around your impl class)\n3. `logos_host` calls `initLogos()` on the generated plugin, providing a `LogosAPI*` for inter-module communication\n4. `call` parses the command: module `calc_module`, method `add`, and the arguments, which become the integers `3` and `5`\n5. `logosctl` sends the call to the daemon, which forwards it to `logos_host` over IPC\n6. The generated glue converts the arguments and invokes `CalcModuleImpl::add(3, 5)`, which calls `calc_add(3, 5)` from libcalc\n7. The result travels back to `logosctl`, which prints it\n\nThe daemon writes its log, including every module's output, to `logs/daemon.log` in the session: `session/logs/daemon.log` here."}, {"execs": [], "md": "## Step 7: Unit-test the Module\n\nBecause your module is a plain C++ class, you can unit-test it **directly** \u2014 no Qt, no running host, no IPC. The [Logos Test Framework](https://github.com/logos-co/logos-test-framework) adds two things on top of that: a tiny test runner (`LOGOS_TEST` / `LOGOS_ASSERT_*`) and **link-time mocking of your C library**, so each test can make `calc_add`, `calc_factorial`, \u2026 return whatever it wants and assert how your wrapper behaves.\n\nYou wire it up by pointing `mkLogosModule` at a `tests/` directory in `flake.nix`, then writing the test files. `nix build .#unit-tests` builds and runs them."}, {"execs": [{"cmd": "write flake.nix", "kind": "file", "note": "Wrote flake.nix", "status": "pass"}], "md": "### 7.1 Enable tests in `flake.nix`\n\nAdd a `tests` block to the `mkLogosModule` call. `mockCLibs` lists the external libraries to replace with link-time mocks (so tests don't need the real `libcalc`):\n\n```nix\n{\n  description = \"Calculator module - wraps libcalc C library for Logos\";\n\n  inputs = {\n    logos-module-builder.url = \"github:logos-co/logos-module-builder\";\n  };\n\n  outputs = inputs@{ logos-module-builder, ... }:\n    logos-module-builder.lib.mkLogosModule {\n      src = ./.;\n      configFile = ./metadata.json;\n      flakeInputs = inputs;\n      tests = {\n        dir = ./tests;\n        mockCLibs = [ \"calc\" ];\n      };\n    };\n}\n```"}, {"execs": [{"cmd": "write tests/CMakeLists.txt", "kind": "file", "note": "Wrote tests/CMakeLists.txt", "status": "pass"}], "md": "### 7.2 `tests/CMakeLists.txt` \u2014 wire up the test binary\n\nThe test harness configures and builds `tests/` as its own CMake project, so it needs a `tests/CMakeLists.txt`. It includes `LogosTest` (provided by the framework) and calls `logos_test()`, listing your impl source, the test sources, and the C-library mock:\n\n```cmake\ncmake_minimum_required(VERSION 3.14)\nproject(CalcModuleTests LANGUAGES CXX)\n\ninclude(LogosTest)\n\nlogos_test(\n    NAME calc_module_tests\n    MODULE_SOURCES\n        ../src/calc_module_impl.cpp\n        mocks/calc_module_events_stub.cpp\n    TEST_SOURCES\n        main.cpp\n        test_calc.cpp\n    MOCK_C_SOURCES\n        mocks/mock_libcalc.cpp\n)\n```\n\n- **`MODULE_SOURCES`** \u2014 your impl `.cpp` (compiled into the test binary, not the real plugin), plus the events stub explained below\n- **`TEST_SOURCES`** \u2014 the runner entry point plus your `test_*.cpp` files\n- **`MOCK_C_SOURCES`** \u2014 the link-time replacement for libcalc, so the real library is never linked\n\n`logos_test()` automatically puts the repo root and `../src` on the include path, so `#include \"calc_module_impl.h\"` and `#include \"lib/libcalc.h\"` both resolve."}, {"execs": [{"cmd": "write tests/mocks/calc_module_events_stub.cpp", "kind": "file", "note": "Wrote tests/mocks/calc_module_events_stub.cpp", "status": "pass"}], "md": "### 7.3 `tests/mocks/calc_module_events_stub.cpp` \u2014 stub the event method\n\nIn a normal build, `logos-cpp-generator` emits `calc_module_events.cpp` containing the body of every `logos_events:` method (e.g. `versionReady`). The test harness runs the generator in a reduced mode that does **not** emit that file, so `libVersionNotify()` \u2014 which calls `versionReady(...)` \u2014 would fail to link. Provide a tiny no-op stub for unit tests:\n\n```cpp\n// Stub bodies for the impl's `logos_events:` methods.\n// In the real build the codegen generates calc_module_events.cpp with\n// bodies that route through LogosModuleContext. The test build skips\n// that codegen, so we provide no-op stubs to satisfy the linker.\n#include \"calc_module_impl.h\"\n\nvoid CalcModuleImpl::versionReady(const std::string&) {}\n```\n\nIf you add more events to `logos_events:`, add a matching no-op line here. (A module with no events doesn't need this stub at all.)"}, {"execs": [{"cmd": "write tests/main.cpp", "kind": "file", "note": "Wrote tests/main.cpp", "status": "pass"}], "md": "### 7.4 Test runner entry point\n\nCreate `tests/main.cpp` \u2014 one line pulls in the framework's `main()`:\n\n```cpp\n#include <logos_test.h>\n\nLOGOS_TEST_MAIN()\n```"}, {"execs": [{"cmd": "write tests/mocks/mock_libcalc.cpp", "kind": "file", "note": "Wrote tests/mocks/mock_libcalc.cpp", "status": "pass"}], "md": "### 7.5 Mock the C library\n\nWhen building tests, the real `libcalc` is **not** linked. Instead you provide functions with the same signatures backed by the framework's mock store. Each one records that it was called and returns a value the test set up. Create `tests/mocks/mock_libcalc.cpp`:\n\n```cpp\n// Link-time replacement for libcalc. Each function records the call\n// and returns whatever the active test configured via mockCFunction().\n#include <logos_clib_mock.h>\n\nextern \"C\" {\n    #include \"lib/libcalc.h\"\n}\n\nextern \"C\" int calc_add(int a, int b) {\n    LOGOS_CMOCK_RECORD(\"calc_add\");\n    return LOGOS_CMOCK_RETURN(int, \"calc_add\");\n}\n\nextern \"C\" int calc_multiply(int a, int b) {\n    LOGOS_CMOCK_RECORD(\"calc_multiply\");\n    return LOGOS_CMOCK_RETURN(int, \"calc_multiply\");\n}\n\nextern \"C\" int calc_factorial(int n) {\n    LOGOS_CMOCK_RECORD(\"calc_factorial\");\n    return LOGOS_CMOCK_RETURN(int, \"calc_factorial\");\n}\n\nextern \"C\" int calc_fibonacci(int n) {\n    LOGOS_CMOCK_RECORD(\"calc_fibonacci\");\n    return LOGOS_CMOCK_RETURN(int, \"calc_fibonacci\");\n}\n\nextern \"C\" const char* calc_version(void) {\n    LOGOS_CMOCK_RECORD(\"calc_version\");\n    return LOGOS_CMOCK_RETURN_STRING(\"calc_version\");\n}\n```\n\n`LOGOS_CMOCK_RECORD(name)` logs the call; `LOGOS_CMOCK_RETURN(type, name)` / `LOGOS_CMOCK_RETURN_STRING(name)` hand back the value the test set with `mockCFunction(...).returns(...)`."}, {"execs": [{"cmd": "write tests/test_calc.cpp", "kind": "file", "note": "Wrote tests/test_calc.cpp", "status": "pass"}], "md": "### 7.6 Write the tests\n\nCreate `tests/test_calc.cpp`. Each `LOGOS_TEST` constructs your impl directly, configures the C-function return values, calls a method, and asserts. `LogosTestContext` resets the mock store between tests:\n\n```cpp\n#include <logos_test.h>\n#include \"calc_module_impl.h\"\n\nLOGOS_TEST(add_forwards_to_calc_add) {\n    auto t = LogosTestContext(\"calc_module\");\n    t.mockCFunction(\"calc_add\").returns(8);\n\n    CalcModuleImpl calc;\n    LOGOS_ASSERT_EQ(calc.add(3, 5), 8);\n    LOGOS_ASSERT(t.cFunctionCalled(\"calc_add\"));\n}\n\nLOGOS_TEST(multiply_forwards_to_calc_multiply) {\n    auto t = LogosTestContext(\"calc_module\");\n    t.mockCFunction(\"calc_multiply\").returns(42);\n\n    CalcModuleImpl calc;\n    LOGOS_ASSERT_EQ(calc.multiply(6, 7), 42);\n    LOGOS_ASSERT(t.cFunctionCalled(\"calc_multiply\"));\n}\n\nLOGOS_TEST(factorial_returns_mocked_value) {\n    auto t = LogosTestContext(\"calc_module\");\n    t.mockCFunction(\"calc_factorial\").returns(120);\n\n    CalcModuleImpl calc;\n    LOGOS_ASSERT_EQ(calc.factorial(5), 120);\n}\n\nLOGOS_TEST(libVersion_converts_cstring_to_string) {\n    auto t = LogosTestContext(\"calc_module\");\n    t.mockCFunction(\"calc_version\").returns(\"1.0.0\");\n\n    CalcModuleImpl calc;\n    LOGOS_ASSERT_EQ(calc.libVersion(), std::string(\"1.0.0\"));\n}\n```\n\nA few things worth calling out:\n\n- The tests construct `CalcModuleImpl` like any class \u2014 no Qt, no host, no `initLogos`. That's the payoff of the pure-C++ pattern.\n- `libVersionNotify()` is safe to call here too: its `versionReady(...)` event resolves to the no-op stub you added, so it won't crash and simply does nothing in the test process.\n- `LOGOS_ASSERT_EQ`, `LOGOS_ASSERT`, `LOGOS_ASSERT_TRUE/FALSE`, `LOGOS_ASSERT_NE/GT/GE/LT` are all available from `<logos_test.h>`."}, {"execs": [{"cmd": "git add tests/ flake.nix", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 7.7 Run the tests\n\nTrack the new files (nix only sees git-tracked files), then build and run:\n\n```bash\ngit add tests/ flake.nix\n```"}, {"execs": [{"cmd": "nix build '.#unit-tests' -L", "exit_code": 0, "kind": "run", "note": "", "output": "warning: Git tree '/home/runner/work/_temp/doctest-chain-dq8byh6w/logos-calc-module' is dirty\nthese 2 derivations will be built:\n  /nix/store/851isrgwp9g7ap2xvb7a4nvjvczib3ih-logos-test-framework-0.1.0.drv\n  /nix/store/ghmpnrly2sxvhmj7zp6v8r68s05ag8gg-logos-calc_module-tests-1.0.0.drv\nbuilding '/nix/store/851isrgwp9g7ap2xvb7a4nvjvczib3ih-logos-test-framework-0.1.0.drv'...\nlogos-test-framework> Running phase: unpackPhase\nlogos-test-framework> unpacking source archive /nix/store/hdzdsprivwzjw92mvp7lm0034ixmk570-3s8i144z6ab90v93a9x7smn99qd9gl1l-source\nlogos-test-framework> source root is 3s8i144z6ab90v93a9x7smn99qd9gl1l-source\nlogos-test-framework> Running phase: patchPhase\nlogos-test-framework> Running phase: updateAutotoolsGnuConfigScriptsPhase\nlogos-test-framework> Running phase: configurePhase\nlogos-test-framework> no configure script, doing nothing\nlogos-test-framework> Running phase: installPhase\nlogos-test-framework> Running phase: fixupPhase\nlogos-test-framework> shrinking RPATHs of ELF executables and libraries in /nix/store/a3kr55lrcv812pwx9m7l8dfix887xavl-logos-test-framework-0.1.0\nlogos-test-framework> checking for references to /build/ in /nix/store/a3kr55lrcv812pwx9m7l8dfix887xavl-logos-test-framework-0.1.0...\nlogos-test-framework> patching script interpreter paths in /nix/store/a3kr55lrcv812pwx9m7l8dfix887xavl-logos-test-framework-0.1.0\nbuilding '/nix/store/ghmpnrly2sxvhmj7zp6v8r68s05ag8gg-logos-calc_module-tests-1.0.0.drv'...\nlogos-calc_module-tests> Running phase: qtPreHook\nlogos-calc_module-tests> Running phase: unpackPhase\nlogos-calc_module-tests> unpacking source archive /nix/store/z2qavp80c07zqlixhp2jd4s3lrc1768b-8diqvjv9sa9k6h54fn1nya73hdg1q832-source\nlogos-calc_module-tests> sour  /nix/store/8fk6wwbqwfp3sz61ffbsid7lds6kphfs-logos-calc_module-tests-1.0.0/bin/calc_module_tests\nlogos-calc_module-tests> shrinking RPATHs of ELF executables and libraries in /nix/store/8fk6wwbqwfp3sz61ffbsid7lds6kphfs-logos-calc_module-tests-1.0.0\nlogos-calc_module-tests> shrinking /nix/store/8fk6wwbqwfp3sz61ffbsid7lds6kphfs-logos-calc_module-tests-1.0.0/bin/.calc_module_tests-wrapped\nlogos-calc_module-tests> shrinking /nix/store/8fk6wwbqwfp3sz61ffbsid7lds6kphfs-logos-calc_module-tests-1.0.0/bin/calc_module_tests\nlogos-calc_module-tests> checking for references to /build/ in /nix/store/8fk6wwbqwfp3sz61ffbsid7lds6kphfs-logos-calc_module-tests-1.0.0...\nlogos-calc_module-tests> patching script interpreter paths in /nix/store/8fk6wwbqwfp3sz61ffbsid7lds6kphfs-logos-calc_module-tests-1.0.0\nlogos-calc_module-tests> stripping (with command strip and flags -S -p) in  /nix/store/8fk6wwbqwfp3sz61ffbsid7lds6kphfs-logos-calc_module-tests-1.0.0/bin\nlogos-calc_module-tests> Running phase: postPatchMkspecs\n", "status": "pass"}], "md": "```bash\nnix build '.#unit-tests' -L\n```\n\nThe build compiles your impl (`src/calc_module_impl.cpp`) against the mock library and the test sources, then runs every `LOGOS_TEST`. A passing run ends with a summary line; a failed assertion prints the file/line and fails the build.\n\n> **From the workspace?** You can also run `ws test logos-calc-module` (after `ws sync-graph` picks up the new tests). See the workspace `CLAUDE.md`."}, {"execs": [], "md": "## Package for Distribution (Optional)\n\nStep 6 built a **portable** package. The other kind, a **local** (`-dev`) package from `nix build '.#lgx'`, keeps its libraries in `/nix/store`, so it only works on a machine with that store. To build the portable package:\n\n```bash\nnix build '.#lgx-portable'\n```\n\nPortable LGX packages are fully self-contained with no `/nix/store` references at runtime. These are the packages that `logosctl` and Basecamp install, and that the [module catalogue](https://github.com/logos-co/logos-modules-release) publishes.\n\nTo create both dev and portable variants (the dev variant works with local `nix build` of basecamp; the portable variant works with standalone basecamp builds), use `--out-link` to avoid overwriting the `result` symlink:\n\n```bash\nnix build '.#lgx' --out-link result-lgx\nnix build '.#lgx-portable' --out-link result-lgx-portable\n```\n\n> For more bundling options (standalone bundler syntax, cross-platform packaging), see the [Developer Guide \u2014 Bundling with nix-bundle-lgx](logos-developer-guide.md#32-bundling-with-nix-bundle-lgx).\n\nTo install a portable package on another machine, as Step 6 did:\n\n```bash\nlogosctl install ./result-lgx-portable/*.lgx -y\n```\n\n> **Note:** Released `logosctl` and Basecamp builds install **portable** `.lgx` packages. Development builds made with `nix build` (`logos-logoscore-cli#ctl`, Basecamp's `.#app`) install **local** (`-dev`) ones. See the [logos-basecamp README](https://github.com/logos-co/logos-basecamp/blob/master/README.md) for details."}, {"execs": [], "md": "## Common Wrapping Patterns\n\nAll of these are plain C++ \u2014 the impl class holds whatever state it needs as private members, and methods use std types. No Qt appears anywhere.\n\n### Wrapping C functions with opaque pointers\n\nMany C libraries use opaque pointers (handles) for state management:\n\n```c\n// C API\ntypedef struct db_ctx db_ctx_t;\ndb_ctx_t* db_open(const char* path);\nint db_get(db_ctx_t* ctx, const char* key, char* buf, int buf_len);\nvoid db_close(db_ctx_t* ctx);\n```\n\nStore the handle as a private member of your impl class:\n\n```cpp\nclass DbModuleImpl : public LogosModuleContext\n{\npublic:\n    bool open(const std::string& path) {\n        m_ctx = db_open(path.c_str());\n        return m_ctx != nullptr;\n    }\n\n    std::string get(const std::string& key) {\n        if (!m_ctx) return {};\n        char buf[4096];\n        int len = db_get(m_ctx, key.c_str(), buf, sizeof(buf));\n        if (len < 0) return {};\n        return std::string(buf, len);\n    }\n\n    ~DbModuleImpl() { if (m_ctx) db_close(m_ctx); }\n\nprivate:\n    db_ctx_t* m_ctx = nullptr;   // private \u2014 not exposed over IPC\n};\n```\n\n### Wrapping C callbacks \u2192 events\n\nC libraries often use callbacks for async operations:\n\n```c\ntypedef void (*event_cb)(int code, const char* msg, void* user_data);\nvoid lib_set_callback(void* ctx, event_cb cb, void* user_data);\n```\n\nUse a static function as the callback, passing `this` as `user_data`, and forward into a declared event:\n\n```cpp\nclass MyImpl : public LogosModuleContext\n{\npublic:\n    void startListening() {\n        lib_set_callback(m_ctx, &MyImpl::c_callback, this);\n    }\n\nlogos_events:\n    void libEvent(int64_t code, const std::string& message);\n\nprivate:\n    static void c_callback(int code, const char* msg, void* user_data) {\n        auto* self = static_cast<MyImpl*>(user_data);\n        self->libEvent(code, std::string(msg ? msg : \"\"));\n    }\n    void* m_ctx = nullptr;\n};\n```\n\nCalling the declared event (`libEvent(...)`) routes the typed args to subscribers \u2014 you never touch Qt signals or `QVariantList` yourself.\n\n### Wrapping C libraries that allocate strings\n\nIf the C library returns allocated strings that must be freed:\n\n```cpp\nstd::string getData() {\n    char* c_str = lib_get_data(m_ctx);   // Library allocates\n    std::string result = c_str ? c_str : \"\";\n    lib_free_string(c_str);              // Library deallocates\n    return result;\n}\n```\n\n### Type conversion reference (C \u2194 impl class)\n\nIn the impl class you work entirely in std/C++ types \u2014 the generated glue handles the Qt/wire side. These are the conversions you write between the C library and your method signatures:\n\n| C type                 | Impl type                  | C \u2192 impl                  | impl \u2192 C                   |\n| ---------------------- | -------------------------- | ------------------------- | -------------------------- |\n| `const char*`          | `std::string`              | `std::string(c_str)`      | `s.c_str()`                |\n| `const char*` (binary) | `std::vector<uint8_t>`     | `{data, data + len}`      | `v.data()`, `v.size()`     |\n| `int`                  | `int64_t`                  | direct (widen)            | `static_cast<int>(n)`      |\n| `bool` / `int`         | `bool`                     | `result != 0`             | direct                     |\n| `void*`                | (store as private member)  | \u2014                         | \u2014                          |\n\n> Use `int64_t` (not `int`) in the public signatures \u2014 that's the integer type the generator recognizes. Narrow to the C library's `int` inside the method, as the calc example does."}, {"execs": [], "md": "## Advanced: Wrapping a Library from a Flake Input\n\nInstead of pre-building the library and placing it in `lib/`, you can have Nix fetch and build it from source. This is useful for libraries hosted on GitHub.\n\n### flake.nix with external library input\n\n```nix\n{\n  description = \"Module wrapping libfoo from GitHub\";\n\n  inputs = {\n    logos-module-builder.url = \"github:logos-co/logos-module-builder\";\n\n    # Fetch the library source (non-flake)\n    libfoo-src = {\n      url = \"github:example/libfoo\";\n      flake = false;\n    };\n  };\n\n  outputs = inputs@{ logos-module-builder, libfoo-src, ... }:\n    logos-module-builder.lib.mkLogosModule {\n      src = ./.;\n      configFile = ./metadata.json;\n      flakeInputs = inputs;\n\n      # Pass the fetched source to the builder\n      externalLibInputs = {\n        foo = libfoo-src;\n      };\n    };\n}\n```\n\n### metadata.json for flake input\n\n```json\n{\n  \"name\": \"foo_module\",\n  \"version\": \"1.0.0\",\n  \"type\": \"core\",\n  \"description\": \"Module wrapping libfoo\",\n  \"main\": \"foo_module_plugin\",\n  \"interface\": \"universal\",\n  \"dependencies\": [],\n\n  \"nix\": {\n    \"packages\": { \"build\": [], \"runtime\": [] },\n    \"external_libraries\": [\n      {\n        \"name\": \"foo\",\n        \"flake_input\": \"github:example/libfoo\",\n        \"build_command\": \"make shared\",\n        \"output_pattern\": \"build/libfoo.*\"\n      }\n    ],\n    \"cmake\": {\n      \"find_packages\": [],\n      \"extra_sources\": [],\n      \"extra_include_dirs\": [\"lib\"],\n      \"extra_link_libraries\": []\n    }\n  }\n}\n```\n\n**Key difference:** The `externalLibInputs` key in flake.nix (`foo`) must match the `name` field in `nix.external_libraries` (`foo`). The builder will:\n\n1. Clone the source from the flake input\n2. Run `build_command` (`make shared`)\n3. Search for output files matching `output_pattern`\n4. Copy the resulting `.so`/`.dylib` and headers to `lib/`\n5. Proceed with the normal module build\n\n### For Go libraries\n\nIf the external library is written in Go with C bindings (`cgo`), set `go_build: true` in the `nix.external_libraries` entry within `metadata.json`:\n\n```json\n{\n  \"nix\": {\n    \"external_libraries\": [\n      {\n        \"name\": \"mygolib\",\n        \"flake_input\": \"github:example/mygolib\",\n        \"go_build\": true,\n        \"output_pattern\": \"libmygolib.*\"\n      }\n    ]\n  }\n}\n```\n\nSetting `go_build: true` enables the Go toolchain and sets `CGO_ENABLED=1`."}, {"execs": [], "md": "## More Types, Call Errors and Package Workflows\n\n[Method Calls and Supported Types in C++ and Rust](tutorial-method-calls-and-types.md)\nadds runnable examples for the full parameter/return type surface, domain\nerrors, call failures and custom synchronous/asynchronous timeouts in both\nlanguages. [Producing, Merging and Signing LGX Packages](tutorial-lgx-packages.md)\ncovers archive creation, variant merging, inspection, extraction, signing\nand publisher trust with `lgx`."}, {"execs": [], "md": "## Real-World Example: logos-libp2p-module\n\nThe [logos-libp2p-module](https://github.com/logos-co/logos-libp2p-module) is a production module that wraps the `nim-libp2p` library (compiled to a C shared library). Key files:\n\n- `**flake.nix**` \u2014 Uses `externalLibInputs` to fetch the nim-libp2p C bindings from a GitHub flake\n- `**metadata.json**` \u2014 Declares `nim_libp2p` as an external library with `go_build: false` in the `nix` section\n- `**src/*_impl.cpp**` \u2014 Wraps ~40 C functions (`libp2p_new`, `libp2p_start`, `libp2p_connect`, `libp2p_dial`, `libp2p_gossipsub_subscribe`, etc.) as plain public methods\n- `**tests/**` \u2014 test suite that exercises every wrapped function with the Logos Test Framework\n\nIt follows the exact same pattern as this tutorial, just at a larger scale."}, {"execs": [], "md": "## Troubleshooting\n\n### A method doesn't show up in `lm` / can't be called\n\nThe generator only exposes `public` methods on the impl class whose parameter and return types it recognizes. If a method is missing:\n\n1. Make sure it's in the `public:` section (not `private:`).\n2. Use supported types only \u2014 notably `int64_t` (not `int`), `std::string` (not `char*` or `QString`), `std::vector<std::string>`, `bool`, `double`, `LogosMap`/`LogosList`, `StdLogosResult`. See the type table in [Step 3](#step-3-configure-the-logos-module).\n3. Keep the signature on as few lines as the parser expects \u2014 one declaration per method.\n\n### Build error: unknown type / generator can't parse a method\n\nThe header parser (`logos-cpp-generator --header-to-lidl`) reads your `*_impl.h` as text. Pulling Qt types or unusual templates into a *public method signature* will confuse it. Keep Qt out of the impl header entirely, and move any helper that needs exotic types into the `private:` section or the `.cpp`.\n\n### Library not found at runtime\n\n```\nCannot load library calc_module_plugin.so: libcalc.so: cannot open shared object file\n```\n\n**Fix:** Ensure `libcalc.so` / `libcalc.dylib` is in the same directory as the plugin. The build system sets RPATH to `$ORIGIN` (Linux) / `@loader_path` (macOS) so the plugin looks for libraries in its own directory.\n\n### Events never reach subscribers\n\nIf you emit an event (e.g. `versionReady(...)`) but a QML view or another module never receives it:\n\n1. The event must be declared in a `logos_events:` section of the impl header, and your class must inherit `LogosModuleContext`.\n2. The event only fires when the module is loaded by a host (`logosctl` or Basecamp). Constructed standalone (unit tests), emission is a safe no-op \u2014 that's expected.\n3. The subscriber must use the exact event name string, e.g. `logos.onModuleEvent(\"calc_module\", \"versionReady\")`.\n\n### `logosctl` cannot find the module\n\n**Check:**\n\n1. It is installed in this session: `logosctl package ls` lists it with the source `user`\n2. The install did not stop at the variant check. `logosctl` installs only the portable variant for its own platform; a `.#lgx` build fails with `Package does not contain variant for platform: \u2026 (package provides: \u2026-dev)`, so build `.#lgx-portable`\n3. You load it by the `name` in `metadata.json` (`calc_module`), not by the package file name\n\n### `nix build .#lib` does nothing or fails silently\n\nSome shells (notably zsh) treat `#` as a comment character. Always quote the flake reference:\n\n```bash\n# Correct\nnix build '.#lib'\n\n# May fail in zsh\nnix build .#lib\n```\n\n### First build is slow\n\nThe first `nix build` downloads Qt 6, the Logos C++ SDK, the code generator, and other dependencies. This is a one-time cost \u2014 subsequent builds use the Nix cache and are fast (usually under 30 seconds).\n\n### Symbol not found errors\n\nIf you get \"undefined symbol\" errors for your C library functions:\n\n1. Verify the `.so`/`.dylib` is in `lib/` before building\n2. Verify the header has `extern \"C\"` guards\n3. Check the symbols are exported: `nm -D lib/libcalc.so | grep calc`"}]}, {"meta": {"name": "Tutorial: Optional Dependencies and the Module Registry", "platform": "Linux (ext=so)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Tutorial: Optional Dependencies and the Module Registry\n\nA module can name what it talks to in three ways, and they differ in **who picks the module** and **who guarantees it is running** \u2014 not in how you call it:\n\n| Field | Module chosen | Loader behaviour | Reached as |\n| --- | --- | --- | --- |\n| `dependencies` | at build time | auto-loaded; a failure to load one fails this module | `modules().<name>` |\n| `optional_dependencies` | at build time | never required, never a load failure | `modules().<name>` |\n| `interface_dependencies` | at **runtime**, by you | never loaded | `modules().bind_<iface>(name)` |\n\n[Composing Modules](tutorial-composing-modules.md) covers the first and [Dependency Interfaces](tutorial-interface-dependencies.md) the third. This tutorial covers the middle one \u2014 and the module you reach for once you have it.\n\n`optional_dependencies` is concrete, so you get the same typed wrapper a required dependency gives you. What you give up is the guarantee: it runs only if it happens to be installed, nothing fails when it is missing, and it is **not bundled** into your package \u2014 which is usually the reason to reach for it, because a required dependency drags its whole runtime closure into every consumer of *your* module, including users who will never install it.\n\nWhat you take on in exchange is having to ask. `modules_state` is the module that answers: a read-only registry of every module the host knows about, and a typed event when one changes state.\n\n**What you'll build:** `calc_observer`, a core module with **two** optional dependencies \u2014 `calc_module` from [Part 1](tutorial-wrapping-c-library.md), and `modules_state`. You run it three times: with `calc_module` never installed, with it installed and running, and with it pulled out from under a live `calc_observer`.\n\n\n**What you'll learn:**\n\n- How `optional_dependencies` differs from `dependencies` \u2014 and how to see that it is not bundled\n- How to tell \"not running\" from \"running, and it said no\" with `object_unavailable`\n- Why an optional call needs a deadline of your own\n- How to read the host's registry with `list_modules`, `module_record` and `is_ready`\n- Why `null` from `module_record` is an answer and not a failure, and how `absent` differs from `unloaded`\n- How to subscribe to `module_state_changed` and watch a dependency disappear without going down with it\n\n## Prerequisites\n\n- Completed [Part 1](tutorial-wrapping-c-library.md) \u2014 you have a working `calc_module` whose shared library is built (`libcalc.so`/`.dylib` in `logos-calc-module/lib/`). No other part is required.\n- Nix with flakes enabled\n- Basic familiarity with C++"}, {"execs": [], "md": "## Step 1: Scaffold the Module Project\n\n`mkdir logos-calc-observer-module && cd logos-calc-observer-module`"}, {"execs": [{"cmd": "nix flake init -t github:logos-co/logos-module-builder", "exit_code": 0, "kind": "run", "note": "", "output": "wrote: \"/home/runner/work/_temp/doctest-chain-dq8byh6w/logos-calc-observer-module/CMakeLists.txt\"\nwrote: \"/home/runner/work/_temp/doctest-chain-dq8byh6w/logos-calc-observer-module/flake.nix\"\nwrote: \"/home/runner/work/_temp/doctest-chain-dq8byh6w/logos-calc-observer-module/metadata.json\"\nwrote: \"/home/runner/work/_temp/doctest-chain-dq8byh6w/logos-calc-observer-module/src/minimal_impl.cpp\"\nwrote: \"/home/runner/work/_temp/doctest-chain-dq8byh6w/logos-calc-observer-module/src/minimal_impl.h\"\nwrote: \"/home/runner/work/_temp/doctest-chain-dq8byh6w/logos-calc-observer-module/src\"\n", "status": "pass"}], "md": "### 1.1 Create the project from the template\n\n```bash\nnix flake init -t github:logos-co/logos-module-builder\n```"}, {"execs": [{"cmd": "rm -f src/minimal_impl.h src/minimal_impl.cpp", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 1.2 Remove the template's example class\n\nThe minimal template ships an example `minimal_impl` class. Delete it \u2014 this tutorial supplies its own `src/` files:\n\n```bash\nrm -f src/minimal_impl.h src/minimal_impl.cpp\n```"}, {"execs": [], "md": "## Step 2: Configure the Module"}, {"execs": [{"cmd": "write metadata.json", "kind": "file", "note": "Wrote metadata.json", "status": "pass"}], "md": "### 2.1 metadata.json \u2014 note the empty `dependencies`\n\n```json\n{\n  \"name\": \"calc_observer\",\n  \"display_name\": \"Calc Observer\",\n  \"version\": \"1.0.0\",\n  \"type\": \"core\",\n  \"category\": \"example\",\n  \"description\": \"Uses optional dependencies and reads the host's module registry\",\n  \"main\": \"calc_observer_plugin\",\n  \"interface\": \"universal\",\n  \"dependencies\": [],\n  \"optional_dependencies\": [\"modules_state\", \"calc_module\"],\n\n  \"nix\": {\n    \"packages\": { \"build\": [], \"runtime\": [] },\n    \"external_libraries\": [],\n    \"cmake\": { \"find_packages\": [], \"extra_sources\": [], \"extra_include_dirs\": [], \"extra_link_libraries\": [] }\n  }\n}\n```\n\n`dependencies` is empty and stays empty. Three things follow from putting both names under `optional_dependencies` instead, and all of them are about lifetime:\n\n- the loader brings one up **only if it is installed**, and never fails a load because one is missing;\n- unloading one **does not** take its dependents down;\n- neither is **bundled** \u2014 consumers of `calc_observer` do not inherit their runtime closures.\n\nA name may not appear in `dependencies` or `interface_dependencies` as well; `modules()` has one member per name, so the build refuses the ambiguity."}, {"execs": [{"cmd": "write CMakeLists.txt", "kind": "file", "note": "Wrote CMakeLists.txt", "status": "pass"}], "md": "### 2.2 CMakeLists.txt\n\n```\ncmake_minimum_required(VERSION 3.14)\nproject(CalcObserverPlugin LANGUAGES CXX)\n\nif(DEFINED ENV{LOGOS_MODULE_BUILDER_ROOT})\n    include($ENV{LOGOS_MODULE_BUILDER_ROOT}/cmake/LogosModule.cmake)\nelseif(EXISTS \"${CMAKE_CURRENT_SOURCE_DIR}/cmake/LogosModule.cmake\")\n    include(cmake/LogosModule.cmake)\nelse()\n    message(FATAL_ERROR \"LogosModule.cmake not found\")\nendif()\n\nlogos_module(\n    NAME calc_observer\n    SOURCES\n        src/calc_observer_impl.h\n        src/calc_observer_impl.cpp\n)\n```"}, {"execs": [{"cmd": "write flake.nix", "kind": "file", "note": "Wrote flake.nix", "status": "pass"}], "md": "### 2.3 flake.nix\n\nEach optional name still needs a flake input \u2014 the **contract** has to come from somewhere. But nothing is *built* from it: only the dependency's published `.lidl` is read. A name that publishes no contract is refused at build time rather than quietly falling back to building it, which would defeat the point.\n\n```nix\n{\n  description = \"calc_observer - optional dependencies and the module registry\";\n\n  inputs = {\n    logos-module-builder.url = \"github:logos-co/logos-module-builder\";\n    modules_state.url = \"github:logos-co/logos-modules-state-module\";\n    calc_module.url = \"path:/path/to/your/calc_module\";\n  };\n\n  outputs = inputs@{ logos-module-builder, ... }:\n    logos-module-builder.lib.mkLogosModule {\n      src = ./.;\n      configFile = ./metadata.json;\n      flakeInputs = inputs;\n    };\n}\n```"}, {"execs": [], "md": "## Step 3: Write the Module"}, {"execs": [{"cmd": "write src/calc_observer_impl.h", "kind": "file", "note": "Wrote src/calc_observer_impl.h", "status": "pass"}], "md": "### 3.1 src/calc_observer_impl.h\n\n```cpp\n#pragma once\n\n#include <cstdint>\n#include <string>\n\n#include <logos_module_context.h>\n\n// A module with two OPTIONAL dependencies. Both names are concrete, so both\n// get the same typed modules().<name> wrapper a required dependency gets \u2014\n// but nothing loads them, nothing fails if they are missing, and neither is\n// bundled into this module's package.\nclass CalcObserverImpl : public LogosModuleContext {\npublic:\n    CalcObserverImpl() = default;\n    ~CalcObserverImpl() = default;\n\n    // \u2500\u2500 An optional dependency you can live without \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n    /// Adds two numbers via calc_module, or says why it could not.\n    std::string tryAdd(int64_t a, int64_t b);\n\n    // \u2500\u2500 Reading the host's own registry \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n    /// How many modules the host knows about, loaded or not.\n    int64_t knownModules();\n\n    /// One module's lifecycle state, or \"absent\" when the host has never\n    /// heard of it.\n    std::string stateOf(const std::string& name);\n\n    /// Whether the host considers a module up and usable.\n    bool ready(const std::string& name);\n\n    /// Subscribes to modules_state's transition event.\n    std::string watchTransitions();\n\n    /// The last transition the subscription saw.\n    std::string lastTransition();\n\nprivate:\n    std::string m_lastTransition = \"(none)\";\n};\n```"}, {"execs": [{"cmd": "write src/calc_observer_impl.cpp", "kind": "file", "note": "Wrote src/calc_observer_impl.cpp", "status": "pass"}], "md": "### 3.2 src/calc_observer_impl.cpp\n\n```cpp\n#include \"calc_observer_impl.h\"\n\n#include \"logos_sdk.h\"\n\nstd::string CalcObserverImpl::tryAdd(int64_t a, int64_t b) {\n    // Bound the call. A module that is not running costs the full protocol\n    // deadline before it fails, and this one is optional by definition.\n    logos::CallError err;\n    int64_t sum = modules().calc_module.add(a, b, &err, /*timeout_ms=*/1500);\n\n    // \"not there\" and \"there, and it said no\" are different answers. Code\n    // that cannot tell them apart eventually treats a sick dependency as a\n    // missing one.\n    if (err.code == \"object_unavailable\")\n        return \"calc_module is not running\";\n    if (!err.ok())\n        return \"calc_module failed: \" + err.code;\n\n    return std::to_string(sum);\n}\n\nint64_t CalcObserverImpl::knownModules() {\n    auto listing = modules().modules_state.list_modules();\n\n    // `partial` is an honest short answer, not a health flag: it is true when\n    // the host's last scan skipped something. A silently short list would be\n    // worse than a flagged one.\n    if (listing.partial)\n        return -1;\n\n    return static_cast<int64_t>(listing.modules.size());\n}\n\nstd::string CalcObserverImpl::stateOf(const std::string& name) {\n    LogosMap record = modules().modules_state.module_record(name);\n\n    // Null is the empty optional \u2014 the host's view does not contain this\n    // module. It is NOT a failed call, and it is the only spelling of\n    // \"absent\": no record ever carries that as a state.\n    if (record.is_null())\n        return \"absent\";\n\n    return record.value(\"state\", \"unknown\");\n}\n\nbool CalcObserverImpl::ready(const std::string& name) {\n    return modules().modules_state.is_ready(name);\n}\n\nstd::string CalcObserverImpl::watchTransitions() {\n    // The optional event parameters arrive as LogosMap, which is how an\n    // absent value stays distinguishable from an empty one.\n    modules().modules_state.onModule_state_changed(\n        [this](const std::string& module,\n               const LogosMap&, const LogosMap&,\n               const std::string& oldState,\n               const std::string& newState,\n               const LogosMap&, uint64_t) {\n            m_lastTransition = module + \": \" + oldState + \" -> \" + newState;\n        });\n    return \"subscribed\";\n}\n\nstd::string CalcObserverImpl::lastTransition() {\n    return m_lastTransition;\n}\n```\n\nThree things about the registry surface are worth pinning down.\n\n**`list_modules()` returns a typed struct**, not JSON \u2014 `modules`, `partial` and `seq`, generated from the contract's record types. `module_record()` returns a `LogosMap` because its return type is an *optional* record, and null is how the empty option crosses the wire.\n\n**The six record states are `unloaded`, `loading`, `loaded`, `ready`, `stopping`, `error`.** There is a seventh, `absent`, which appears **only in events** \u2014 a module that is absent is simply not in the listing, and `module_record` answers null. One spelling for \"not there\", not two.\n\n**Treat an unrecognised state as \"not loaded\", never as an error.** That rule is normative. `record.value(\"state\", \"unknown\")` above returns whatever the host said; a consumer that switched on a closed set and threw would break on the day a new state is introduced."}, {"execs": [], "md": "## Step 4: Build the Module"}, {"execs": [{"cmd": "git init -q && git add -A", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 4.1 Track the files and lock the inputs\n\n```bash\ngit init && git add -A\n```"}, {"execs": [{"cmd": "nix flake update --override-input calc_module path:../logos-calc-module", "exit_code": 0, "kind": "run", "note": "", "output": "warning: Git tree '/home/runner/work/_temp/doctest-chain-dq8byh6w/logos-calc-observer-module' is dirty\nunpacking 'github:logos-co/logos-modules-state-module/c70da49aa56e48f867d50b9ff58679749f09dbcf' into the Git cache...\nwarning: creating lock file \"/home/runner/work/_temp/doctest-chain-dq8byh6w/logos-calc-observer-module/flake.lock\": \n\u2022 Added input 'calc_module':\n    'path:/home/runner/work/_temp/doctest-chain-dq8byh6w/logos-calc-module?lastModified=1791034037&narHash=sha256-l2UnLihjj6e5wVlcTv58jeslgdBEobSWOgNlLhwacbs%3D' (2026-10-03)\n\u2022 Added input 'calc_module/logos-module-builder':\n    'github:logos-co/logos-module-builder/3818566dcc1849f1a6bdb89d8674ca9fe5f6915a?narHash=sha256-u8X0RbZRrceR9iMCnqj72id99PDqS%2BInWAaZKFbIBHU%3D' (2026-10-02)\n\u2022 Added input 'calc_mod
