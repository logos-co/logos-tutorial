put": "", "status": "pass"}], "md": "### 4.2 Get logosctl\n\n`logosctl` runs modules from the command line. If you installed it from its [release](https://github.com/logos-co/logos-logoscore-cli/releases), skip this step. Otherwise build the same portable bundle with Nix and put it on your `PATH`:\n\n```bash\nnix build 'github:logos-co/logos-logoscore-cli#ctl-bundle-dir' --out-link ./logosctl\nexport PATH=\"$PWD/logosctl/bin:$PATH\"\n```"}, {"execs": [{"cmd": "nix build '.#lgx-portable' --out-link obs-lgx", "exit_code": 0, "kind": "run", "note": "", "output": "warning: Git tree '/home/runner/work/_temp/doctest-chain-dq8byh6w/logos-calc-observer-module' is dirty\nthese 4 derivations will be built:\n  /nix/store/0ylnipi5r5dsm5cyvsaakl9ry5n663bc-logos-calc_observer-module-lib-metadata.json.drv\n  /nix/store/f3jrj383c83mpajap909swd0h674f1gz-closure-info.drv\n  /nix/store/3m9navxl92xk3mjrg74khpq40rb90k41-logos-calc_observer-module-lib-bundle-1.0.0.drv\n  /nix/store/4f248n2pqq4xl6as1d9f3dczgds7hf46-logos-calc_observer-module-lib-lgx-1.0.0.drv\nbuilding '/nix/store/0ylnipi5r5dsm5cyvsaakl9ry5n663bc-logos-calc_observer-module-lib-metadata.json.drv'...\nbuilding '/nix/store/f3jrj383c83mpajap909swd0h674f1gz-closure-info.drv'...\nbuilding '/nix/store/3m9navxl92xk3mjrg74khpq40rb90k41-logos-calc_observer-module-lib-bundle-1.0.0.drv'...\nbuilding '/nix/store/4f248n2pqq4xl6as1d9f3dczgds7hf46-logos-calc_observer-module-lib-lgx-1.0.0.drv'...\n", "status": "pass"}], "md": "### 4.3 Package it, and see what is *not* in the box\n\n`logosctl` installs **portable** packages, which carry their own libraries rather than pointing into the Nix store:\n\n```bash\nnix build '.#lgx-portable' --out-link obs-lgx\n```"}, {"execs": [{"cmd": "./logosctl/bin/logosctl --human --config-dir ./session daemon start --detach", "exit_code": 0, "kind": "run", "note": "", "output": "Daemon started (pid 30605)\nLogs: /home/runner/work/_temp/doctest-chain-dq8byh6w/logos-calc-observer-module/./session/logs/daemon.log\n", "status": "pass"}], "md": "This tutorial keeps its packages in a session of its own, so nothing installed for another tutorial mixes in. Point `logosctl` at it in the terminal you use from here on:\n\n```bash\nexport LOGOSCTL_CONFIG_DIR=\"$PWD/session\"\n```\n\n`--detach` returns once the daemon accepts commands. Packages install into the daemon's session, so it has to be running first; `-y` applies the install without asking:\n\n```bash\nlogosctl daemon start --detach\n```"}, {"execs": [{"cmd": "./logosctl/bin/logosctl --human --config-dir ./session install ./obs-lgx/*.lgx -y", "exit_code": 0, "kind": "run", "note": "", "output": "The following changes will be made (install):\n  install    calc_observer 1.0.0\nInstalled: calc_observer\nLoad with: logosctl module load calc_observer\n", "status": "pass"}], "md": "```bash\nlogosctl install ./obs-lgx/*.lgx -y\n```\n\n```text\nThe following changes will be made (install):\n  install    calc_observer 1.0.0\nInstalled: calc_observer\nLoad with: logosctl module load calc_observer\n```\n\nOne package. Installed by name from a catalogue, this table would also list a **required** dependency, because installing a package installs what it needs to run \u2014 and would *offer* an optional one, marked `(optional)`: `-y` accepts it, `--no-optional` declines it. A path ending in `.lgx` skips the catalogue and installs exactly that file. Either way, installing only puts files on disk; an optional dependency's lifetime is something else's business."}, {"execs": [], "md": "## Step 5: Run With the Dependency Missing\n\n`calc_module` is built, but it is not installed in this tutorial's session. Load `calc_observer` anyway."}, {"execs": [{"cmd": "./logosctl/bin/logosctl --json --config-dir ./session module load calc_observer", "exit_code": 0, "kind": "run", "note": "", "output": "{\"dependencies_loaded\":[],\"module\":\"calc_observer\",\"optional_skipped\":[{\"module\":\"calc_module\",\"named_by\":\"calc_observer\",\"reason\":\"not_installed\"}],\"status\":\"ok\",\"version\":\"1.0.0\"}\n", "status": "pass"}], "md": "### 5.1 Load it \u2014 and watch the skip get reported\n\nAsk for `--json`: the human-readable summary names only what the load brought up, and this time the interesting part is what it left out.\n\n```bash\nlogosctl module load calc_observer --json\n```\n\n```json\n{\"dependencies_loaded\":[],\"module\":\"calc_observer\",\"optional_skipped\":[{\"module\":\"calc_module\",\"named_by\":\"calc_observer\",\"reason\":\"not_installed\"}],\"status\":\"ok\",\"version\":\"1.0.0\"}\n```\n\n**`\"status\":\"ok\"`.** A missing optional dependency is not a load failure \u2014 but it is not silent either: the skip is reported, with the reason and who asked for it. A required dependency in the same position would have failed the load outright.\n\nNote `modules_state` is in neither list. It ships with `logosctl`, which loads it when the daemon starts, so it is already there."}, {"execs": [{"cmd": "./logosctl/bin/logosctl --human --config-dir ./session call calc_observer tryAdd 3 4", "exit_code": 0, "kind": "run", "note": "", "output": "calc_module is not running\n", "status": "pass"}], "md": "### 5.2 Ask the module what it can see\n\n```bash\nlogosctl call calc_observer tryAdd 3 4\n```\n\n```text\ncalc_module is not running\n```\n\nThat answer came from `err.code == \"object_unavailable\"` \u2014 and after 1500 ms, not the protocol's full default. The deadline is the point: an absent module is the case that costs you the whole budget."}, {"execs": [{"cmd": "./logosctl/bin/logosctl --human --config-dir ./session call calc_observer stateOf calc_module", "exit_code": 0, "kind": "run", "note": "", "output": "absent\n", "status": "pass"}], "md": "```bash\nlogosctl call calc_observer stateOf calc_module\n```\n\n```text\nabsent\n```\n\n`absent` \u2014 the host has never heard of it. Remember that spelling; it is about to change."}, {"execs": [{"cmd": "./logosctl/bin/logosctl --human --config-dir ./session call calc_observer ready calc_module", "exit_code": 0, "kind": "run", "note": "", "output": "false\n", "status": "pass"}], "md": "```bash\nlogosctl call calc_observer ready calc_module\n```"}, {"execs": [{"cmd": "./logosctl/bin/logosctl --human --config-dir ./session call calc_observer knownModules", "exit_code": 0, "kind": "run", "note": "", "output": "6\n", "status": "pass"}], "md": "```bash\nlogosctl call calc_observer knownModules\n```\n\nThe listing is not empty even now \u2014 the runtime's own modules are in it."}, {"execs": [], "md": "## Step 6: Install the Dependency and Try Again\n\nNothing about `calc_observer` changes. Only its surroundings do."}, {"execs": [{"cmd": "nix build 'path:../logos-calc-module#lgx-portable' --out-link calc-lgx", "exit_code": 0, "kind": "run", "note": "", "output": "these 4 derivations will be built:\n  /nix/store/10v7alcx6i1zn2x3gamgxgd21n1gy9hn-logos-calc_module-module-lib-1.0.0.drv\n  /nix/store/l9kylqkifs1s8m2z6906qdpld0wcj9zp-closure-info.drv\n  /nix/store/2f5lq366p4dpi6jycnj8jliv1bkq1vmq-logos-calc_module-module-lib-bundle-1.0.0.drv\n  /nix/store/8wl0yjr5md3hyg4g5mz3v2p5w1s5vxdq-logos-calc_module-module-lib-lgx-1.0.0.drv\nbuilding '/nix/store/10v7alcx6i1zn2x3gamgxgd21n1gy9hn-logos-calc_module-module-lib-1.0.0.drv'...\nbuilding '/nix/store/l9kylqkifs1s8m2z6906qdpld0wcj9zp-closure-info.drv'...\nbuilding '/nix/store/2f5lq366p4dpi6jycnj8jliv1bkq1vmq-logos-calc_module-module-lib-bundle-1.0.0.drv'...\nbuilding '/nix/store/8wl0yjr5md3hyg4g5mz3v2p5w1s5vxdq-logos-calc_module-module-lib-lgx-1.0.0.drv'...\n", "status": "pass"}], "md": "### 6.1 Install calc_module into the running daemon\n\n```bash\nnix build 'path:../logos-calc-module#lgx-portable' --out-link calc-lgx\n```"}, {"execs": [{"cmd": "./logosctl/bin/logosctl --human --config-dir ./session install ./calc-lgx/*.lgx -y", "exit_code": 0, "kind": "run", "note": "", "output": "The following changes will be made (install):\n  install    calc_module 1.0.0\nInstalled: calc_module\nLoad with: logosctl module load calc_module\n", "status": "pass"}], "md": "```bash\nlogosctl install ./calc-lgx/*.lgx -y\n```\n\nNo restart. The daemon rescans after an install, so the host knows `calc_module` from here on \u2014 but installing does not load it."}, {"execs": [{"cmd": "./logosctl/bin/logosctl --json --config-dir ./session module load calc_observer", "exit_code": 0, "kind": "run", "note": "", "output": "{\"dependencies_loaded\":[\"calc_module\"],\"module\":\"calc_observer\",\"status\":\"ok\",\"version\":\"1.0.0\"}\n", "status": "pass"}], "md": "### 6.2 Load it again\n\n`calc_observer` is still running from Step 5. Loading it again leaves it running and resolves its dependencies afresh \u2014 and this time `calc_module` is installed:\n\n```bash\nlogosctl module load calc_observer --json\n```\n\n```json\n{\"dependencies_loaded\":[\"calc_module\"],\"module\":\"calc_observer\",\"status\":\"ok\",\"version\":\"1.0.0\"}\n```\n\nNo skip list this time. An optional dependency that *is* installed gets loaded along with its dependant \u2014 \"optional\" governs whether it is **required**, not whether it is wanted. (`--no-optional` loads the required dependencies only.)"}, {"execs": [{"cmd": "./logosctl/bin/logosctl --human --config-dir ./session call calc_observer tryAdd 3 4", "exit_code": 0, "kind": "run", "note": "", "output": "7\n", "status": "pass"}], "md": "### 6.3 The same three questions\n\n```bash\nlogosctl call calc_observer tryAdd 3 4\n```"}, {"execs": [{"cmd": "./logosctl/bin/logosctl --human --config-dir ./session call calc_observer stateOf calc_module", "exit_code": 0, "kind": "run", "note": "", "output": "ready\n", "status": "pass"}], "md": "```bash\nlogosctl call calc_observer stateOf calc_module\n```"}, {"execs": [{"cmd": "./logosctl/bin/logosctl --human --config-dir ./session call calc_observer ready calc_module", "exit_code": 0, "kind": "run", "note": "", "output": "true\n", "status": "pass"}], "md": "```bash\nlogosctl call calc_observer ready calc_module\n```\n\n`ready` is the state where the module is loaded **and** has published its object. `loaded` comes earlier \u2014 the host owns the process, but there may be nothing to call yet. That gap is why the predicate is spelled `is_ready` and not `isLoaded`.\n\n> **Read its limit.** `is_ready` answers *the host's* view, not \"a call from me will succeed\" \u2014 that additionally needs a per-caller handshake this module cannot know about, so the predicate goes true a few hundred milliseconds early. Treat a **yes** as reliable and a **no** as a hint, never the other way round."}, {"execs": [{"cmd": "./logosctl/bin/logosctl --human --config-dir ./session call calc_observer stateOf nope", "exit_code": 0, "kind": "run", "note": "", "output": "absent\n", "status": "pass"}], "md": "```bash\nlogosctl call calc_observer stateOf nope\n```\n\nA name the host has never heard of is still `absent`, of course."}, {"execs": [], "md": "## Step 7: Take the Dependency Away Again\n\nThe last thing an optional dependency has to survive is disappearing while you are running."}, {"execs": [{"cmd": "./logosctl/bin/logosctl --human --config-dir ./session call calc_observer watchTransitions", "exit_code": 0, "kind": "run", "note": "", "output": "subscribed\n", "status": "pass"}], "md": "### 7.1 Subscribe to the registry's event\n\n```bash\nlogosctl call calc_observer watchTransitions\n```"}, {"execs": [{"cmd": "./logosctl/bin/logosctl --human --config-dir ./session call calc_observer lastTransition", "exit_code": 0, "kind": "run", "note": "", "output": "(none)\n", "status": "pass"}], "md": "```bash\nlogosctl call calc_observer lastTransition\n```"}, {"execs": [{"cmd": "./logosctl/bin/logosctl --json --config-dir ./session module unload calc_module", "exit_code": 0, "kind": "run", "note": "", "output": "{\"dependents_unloaded\":[],\"module\":\"calc_module\",\"status\":\"ok\"}\n", "status": "pass"}], "md": "### 7.2 Unload calc_module out from under it\n\n```bash\nlogosctl module unload calc_module --json\n```\n\n```json\n{\"dependents_unloaded\":[],\"module\":\"calc_module\",\"status\":\"ok\"}\n```\n\n**`\"dependents_unloaded\":[]`** \u2014 `calc_observer` is still running. `module unload` takes a module's dependents down with it by default, so had this been a required dependency, `calc_observer` would be in that list. That is the whole bargain: you gave up the guarantee, and in return nothing else's lifetime is chained to yours."}, {"execs": [{"cmd": "sleep 2", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nsleep 2\n```"}, {"execs": [{"cmd": "./logosctl/bin/logosctl --human --config-dir ./session call calc_observer lastTransition", "exit_code": 0, "kind": "run", "note": "", "output": "calc_module: stopping -> unloaded\n", "status": "pass"}], "md": "```bash\nlogosctl call calc_observer lastTransition\n```\n\n```text\ncalc_module: stopping -> unloaded\n```\n\nThe typed subscription saw the transition as a **pair** \u2014 where it came from and where it went. A consumer that only cares that something went away reads `new_state`; one that cares whether it was orderly reads both."}, {"execs": [{"cmd": "./logosctl/bin/logosctl --human --config-dir ./session call calc_observer stateOf calc_module", "exit_code": 0, "kind": "run", "note": "", "output": "unloaded\n", "status": "pass"}], "md": "### 7.3 `unloaded` is not `absent`\n\n```bash\nlogosctl call calc_observer stateOf calc_module\n```\n\n```text\nunloaded\n```\n\nCompare that with Step 5, where the same call answered `absent`. **`unloaded` means known and installed but not running; `absent` means the host has never heard of it.** An installer can act on the first and not the second, which is why they are not the same word."}, {"execs": [{"cmd": "./logosctl/bin/logosctl --human --config-dir ./session call calc_observer tryAdd 3 4", "exit_code": 0, "kind": "run", "note": "", "output": "calc_module is not running\n", "status": "pass"}], "md": "```bash\nlogosctl call calc_observer tryAdd 3 4\n```\n\nAnd the call fails the same way it did at the start \u2014 bounded, named, and survivable."}, {"execs": [{"cmd": "./logosctl/bin/logosctl --human --config-dir ./session daemon stop", "exit_code": 0, "kind": "run", "note": "", "output": "Daemon shutdown initiated: Daemon shutting down.\n", "status": "pass"}], "md": "```bash\nlogosctl daemon stop\n```"}, {"execs": [], "md": "## Recap\n\n| | `dependencies` | `optional_dependencies` |\n|---|---|---|\n| Typed wrapper | `modules().<name>` | **the same** |\n| Auto-loaded | yes | only if installed |\n| Missing at load | load fails | `\"status\":\"ok\"` + a reported skip |\n| Unloading it | takes dependents down | dependents keep running |\n| In your `.lgx` | bundled | not bundled |\n\n**Reach for it when the guarantee costs more than it is worth** \u2014 a heavyweight module you can work without, whose closure you do not want to push onto everyone who installs you.\n\n**Pay for it by asking.** Bound every optional call with a deadline of your own, and separate `object_unavailable` from a real failure. When you need a positive answer rather than a fast one, `modules_state` has the host's own view.\n\n### The registry surface\n\n| Call | Answers |\n|---|---|\n| `list_modules()` | every module the host knows, with `partial` and a listing-level `seq` |\n| `module_record(name)` | one record, or **null** \u2014 the empty optional, not a failure |\n| `is_ready(name)` | loaded **and** published, from the host's point of view |\n| `module_state_changed` | every applied transition, as an old/new pair |\n\nIts read surface is open to every module. Its ingest surface \u2014 `note_transition` and `apply_snapshot` \u2014 is not: those write the facts everyone else trusts, so they admit the **host only**. [Caller Identity](tutorial-caller-identity.md) is how a module draws a line like that of its own."}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
