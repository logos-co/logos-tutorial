<script id="report-data" type="application/json">{"generated_platform": "Linux", "summary": {"failed": 0, "passed": 5, "skipped": 0}, "tutorials": [{"meta": {"name": "Tutorial: Method Calls and Supported Types in C++ and Rust", "platform": "Linux (ext=so)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Tutorial: Method Calls and Supported Types in C++ and Rust\n\nBuild two modules that expose the supported parameter and return type families, then call across the C++/Rust boundary with explicit error handling and per-call deadlines. Each language acts as both provider and caller.\n\n**What you'll build:** C++ and Rust echo modules with runnable type, error and timeout examples.\n\n**What you'll learn:**\n\n- Map LIDL types to C++ and Rust provider signatures\n- Return and inspect a domain error separately from a failed call\n- Set synchronous and asynchronous call deadlines in both languages\n- Round-trip bytes, arrays, maps, records, nested values and optionals\n\n## Prerequisites\n\n- Nix with flakes enabled\n- Python 3 for the runtime assertions\n- Basic C++ and Rust; no earlier tutorial is required"}, {"execs": [], "md": "## The supported type surface\n\nThis table describes the Qt-free C++ and Rust **generated provider\nmethod signatures**.\nEvery `echo*` method below takes and returns the indicated type. Containers can\nnest: the examples include bytes inside lists/maps/records, a list and map of\nrecords, a nested record and an array of arrays.\n\n| LIDL | C++ provider | Rust provider |\n|---|---|---|\n| `tstr` | `std::string` | `String` |\n| `bstr` | `std::vector<uint8_t>` | `Vec<u8>` |\n| `int` | `int64_t` | `i64` |\n| `uint` | `uint64_t` | `u64` |\n| `float64` | `double` | `f64` |\n| `bool` | `bool` | `bool` |\n| `any` | `nlohmann::json` | `serde_json::Value` |\n| `[tstr]` | `std::vector<std::string>` | `Vec<String>` |\n| `[int]` | `std::vector<int64_t>` | `Vec<i64>` |\n| `[uint]` | `std::vector<uint64_t>` | `Vec<u64>` |\n| `[float64]` | `std::vector<double>` | `Vec<f64>` |\n| `[bool]` | `std::vector<bool>` | `Vec<bool>` |\n| `[any]` | `LogosList` | `Vec<serde_json::Value>` |\n| `{tstr: any}` | `LogosMap` | `BTreeMap<String, serde_json::Value>` |\n| `[bstr]` | `std::vector<std::vector<uint8_t>>` | `Vec<Vec<u8>>` |\n| `{tstr: bstr}` | `std::map<std::string, std::vector<uint8_t>>` | `BTreeMap<String, Vec<u8>>` |\n| `{tstr: int}` | `std::map<std::string, int64_t>` | `BTreeMap<String, i64>` |\n| `{tstr: int}` | `std::unordered_map<std::string, int64_t>` | `BTreeMap<String, i64>` |\n| `[[int]]` | `std::vector<std::vector<int64_t>>` | `Vec<Vec<i64>>` |\n| `Entry` | `Entry` | `Entry` |\n| `[Entry]` | `std::vector<Entry>` | `Vec<Entry>` |\n| `{tstr: Entry}` | `std::map<std::string, Entry>` | `BTreeMap<String, Entry>` |\n| `Batch` | `Batch` | `Batch` |\n| `?tstr` | `std::optional<std::string>` | `Option<String>` |\n| `void` (return only) | `void` | `()` |\n| `result` (return only) | `StdLogosResult` | `Result<serde_json::Value, String>` |\n\nRust collection types follow LIDL recursively: `[int]` is `Vec<i64>` and\n`{tstr: [bstr]}` is `BTreeMap<String, Vec<Vec<u8>>>`. Within collections,\n`serde_json::Value` appears where an element is `any`. The generated provider\nvalidates incoming collection values against\ntheir LIDL shape before decoding them into these Rust types.\n\nRust uses a **committed LIDL contract** here. The Rust-first trait frontend used\nin the [introductory tutorial](tutorial-rust-module.md) can derive supported\n`Vec<T>` and `BTreeMap<String, T>` contracts, but does not derive record\ndeclarations and rejects optional returns. Declaring the LIDL directly exposes\nthe larger supported surface and generates the trait you implement. Record\n**fields** are typed recursively too (for example `Batch.tags: Vec<String>`).\n\nC++ header-first authoring uses the displayed standard types; an unordered map\nis allowed for method parameters/returns, while record fields use `std::map`.\nUse 64-bit integers, not `in uint8_t>>& v) { return v; }\nstd::map<std::string, int64_t> ApiCppImpl::echoIntMap(const std::map<std::string, int64_t>& v) { return v; }\nstd::unordered_map<std::string, int64_t> ApiCppImpl::echoUnorderedMap(const std::unordered_map<std::string, int64_t>& v) { return v; }\nstd::vector<std::vector<int64_t>> ApiCppImpl::echoNested(const std::vector<std::vector<int64_t>>& v) { return v; }\nEntry ApiCppImpl::echoEntry(const Entry& v) { return v; }\nstd::vector<Entry> ApiCppImpl::echoEntries(const std::vector<Entry>& v) { return v; }\nstd::map<std::string, Entry> ApiCppImpl::echoEntryMap(const std::map<std::string, Entry>& v) { return v; }\nBatch ApiCppImpl::echoBatch(const Batch& v) { return v; }\nstd::optional<std::string> ApiCppImpl::echoOptional(const std::optional<std::string>& v) { return v; }\nvoid ApiCppImpl::doVoid() {}\nStdLogosResult ApiCppImpl::makeResult(bool ok) {\n    if (!ok) return {false, {}, \"deliberate domain error\"};\n    return {true, 42, \"\"};\n}\nint64_t ApiCppImpl::slow(int64_t ms) {\n    std::this_thread::sleep_for(std::chrono::milliseconds(ms > 0 ? ms : 0));\n    return ms;\n}\n\nstd::string ApiCppImpl::checkCalls(const std::string& provider) {\n    auto peer = modules().bind_calls(provider);\n    logos::CallError err;\n    // Zero is a valid answer. Only the error channel tells us if it arrived.\n    auto zero = peer.echoInt(0, &err, 2000);\n    if (!err.ok()) return err.code + \": \" + err.message + \" (\" + err.origin + \")\";\n    if (zero != 0) return \"wrong zero value\";\n\n    // A domain error is a SUCCESSFUL call carrying a failed result value.\n    auto domain = peer.makeResult(false, &err, 2000);\n    if (!err.ok()) return \"call failed: \" + err.message;\n    if (domain.success || domain.error != \"deliberate domain error\")\n        return \"wrong domain error\";\n    auto success = peer.makeResult(true, &err, 2000);\n    if (!err.ok() || !success.success || success.value != 42)\n        return \"wrong success result\";\n\n "version\": \"1.0.0\",\n  \"type\": \"core\",\n  \"category\": \"example\",\n  \"description\": \"Rust types, errors and per-call deadlines\",\n  \"main\": \"api_rust_plugin\",\n  \"interface\": \"cdylib\",\n  \"dependencies\": [],\n  \"interface_dependencies\": [\n    {\n      \"name\": \"calls\",\n      \"file\": \"interfaces/calls.lidl\"\n    }\n  ],\n  \"codegen\": {\n    \"lidl\": \"api_rust.lidl\",\n    \"rust\": {\n      \"crate\": \"rust-lib\",\n      \"staticlib\": \"minimal_rust\"\n    }\n  }\n}\n```"}, {"execs": [{"cmd": "write rust/CMakeLists.txt", "kind": "file", "note": "Wrote rust/CMakeLists.txt", "status": "pass"}], "md": "### 3.3 `rust/CMakeLists.txt`\n\n```\ncmake_minimum_required(VERSION 3.14)\nproject(ApiExample LANGUAGES CXX)\ninclude($ENV{LOGOS_MODULE_BUILDER_ROOT}/cmake/LogosModule.cmake)\nlogos_module(NAME api_rust)\n```"}, {"execs": [{"cmd": "write rust/api_rust.lidl", "kind": "file", "note": "Wrote rust/api_rust.lidl", "status": "pass"}], "md": "### 3.4 `rust/api_rust.lidl`\n\n```\nmodule api_rust {\n  version \"1.0.0\"\ntype Entry {\n  label: tstr\n  payload: bstr\n  ? count: uint\n}\ntype Batch {\n  entry: Entry\n  tags: [tstr]\n}\n  method echoString(v: tstr) -> tstr\n  method echoBytes(v: bstr) -> bstr\n  method echoInt(v: int) -> int\n  method echoUint(v: uint) -> uint\n  method echoDouble(v: float64) -> float64\n  method echoBool(v: bool) -> bool\n  method echoAny(v: any) -> any\n  method echoStringList(v: [tstr]) -> [tstr]\n  method echoIntList(v: [int]) -> [int]\n  method echoUintList(v: [uint]) -> [uint]\n  method echoDoubleList(v: [float64]) -> [float64]\n  method echoBoolList(v: [bool]) -> [bool]\n  method echoList(v: [any]) -> [any]\n  method echoMap(v: {tstr: any}) -> {tstr: any}\n  method echoBytesList(v: [bstr]) -> [bstr]\n  method echoBytesMap(v: {tstr: bstr}) -> {tstr: bstr}\n  method echoIntMap(v: {tstr: int}) -> {tstr: int}\n  method echoUnorderedMap(v: {tstr: int}) -> {tstr: int}\n  method echoNested(v: [[int]]) -> [[int]]\n  method echoEntry(v: Entry) -> Entry\n  method echoEntries(v: [Entry]) -> [Entry]\n  method echoEntryMap(v: {tstr: Entry}) -> {tstr: Entry}\n  method echoBatch(v: Batch) -> Batch\n  method echoOptional(v: ?tstr) -> ?tstr\n  method doVoid() -> void\n  method makeResult(ok: bool) -> result\n  method slow(ms: int) -> int\n  method checkCalls(provider: tstr) -> tstr\n  method startAsync(provider: tstr) -> tstr\n  method asyncStatus() -> tstr\n}\n```"}, {"execs": [{"cmd": "write rust/rust-lib/src/lib.rs", "kind": "file", "note": "Wrote rust/rust-lib/src/lib.rs", "status": "pass"}], "md": "### 3.5 `rust/rust-lib/src/lib.rs`\n\n```\n//! Contract-first Rust: the builder generates the trait and record structs.\ninclude!(concat!(env!(\"CARGO_MANIFEST_DIR\"), \"/generated/provider_gen.rs\"));\n\n#[derive(Default)]\nstruct ApiRust;\n\nimpl ApiRustModule for ApiRust {\n    fn echo_string(&mut self, v: String) -> String { v }\n    fn echo_bytes(&mut self, v: Vec<u8>) -> Vec<u8> { v }\n    fn echo_int(&mut self, v: i64) -> i64 { v }\n    fn echo_uint(&mut self, v: u64) -> u64 { v }\n    fn echo_double(&mut self, v: f64) -> f64 { v }\n    fn echo_bool(&mut self, v: bool) -> bool { v }\n    fn echo_any(&mut self, v: serde_json::Value) -> serde_json::Value { v }\n    fn echo_string_list(&mut self, v: Vec<String>) -> Vec<String> { v }\n    fn echo_int_list(&mut self, v: Vec<i64>) -> Vec<i64> { v }\n    fn echo_uint_list(&mut self, v: Vec<u64>) -> Vec<u64> { v }\n    fn echo_double_list(&mut self, v: Vec<f64>) -> Vec<f64> { v }\n    fn echo_bool_list(&mut self, v: Vec<bool>) -> Vec<bool> { v }\n    fn echo_list(&mut self, v: Vec<serde_json::Value>) -> Vec<serde_json::Value> { v }\n    fn echo_map(&mut self, v: std::collections::BTreeMap<String, serde_json::Value>) -> std::collections::BTreeMap<String, serde_json::Value> { v }\n    fn echo_bytes_list(&mut self, v: Vec<Vec<u8>>) -> Vec<Vec<u8>> { v }\n    fn echo_bytes_map(&mut self, v: std::collections::BTreeMap<String, Vec<u8>>) -> std::collections::BTreeMap<String, Vec<u8>> { v }\n    fn echo_int_map(&mut self, v: std::collections::BTreeMap<String, i64>) -> std::collections::BTreeMap<String, i64> { v }\n    fn echo_unordered_map(&mut self, v: std::collections::BTreeMap<String, i64>) -> std::collections::BTreeMap<String, i64> { v }\n    fn echo_nested(&mut self, v: Vec<Vec<i64>>) -> Vec<Vec<i64>> { v }\n    fn echo_entry(&mut self, v: Entry) -> Entry { v }\n    fn echo_entries(&mut self, v: Vec<Entry>) -> Vec<Entry> { v }\n    fn echo_entry_map(&mut self, v: std::collections::BTreeMap<String, Entry>) -> std::collections::BTreeMap<String, Entry> { v }\n    fn echo_batch(&mut self, v: Batch) -> Batch { v }\n    fn echo_optional(&mut self, v: Option<String>) -> Option<String> { v }\n    fn do_void(&mut self) {}\n    fn make_result(&mut self, ok: bool) -> Result<serde_json::Value, String> {\n        if ok { Ok(serde_json::json!(42)) }\n        else { Err(\"deliberate domain error\".to_string()) }\n    }\n    fn slow(&mut self, ms: i64) -> i64 {\n        std::thread::sleep(std::time::Duration::from_millis(ms.max(0) as u64));\n        ms\n    }\n    fn check_calls(&mut self, provider: String) -> String {\n        check_calls(&provider).unwrap_or_else(|e| e)\n    }\n    fn start_async(&mut self, provider: String) -> String {\n        start_async(&provider);\n        \"started\".to_string()\n    }\n    fn async_status(&mut self) -> String {\n        let state = ASYNC_STATE.lock().unwrap();\n        if state.0 != 3 { \"pending\" }\n        else if state.1 { \"async checks passed\" }\n        else { \"async checks failed\" }.to_string()\n    }\n}\n\nfn check_calls(provider: &str) -> Result<String, String> {\n    use std::time::Duration;\n    let peer = calls::CallsClient::bind(provider);\n    // The outer Result reports a call failure, even if T can be zero or null.\n    let zero = peer.echo_int_with_timeout(0, Duration::from_secs(2))\n        .map_err(|e| format!(\"call failed: {e}\"))?;\n    if zero != 0 { return Err(\"wrong zero value\".into()); }\n\n    // For LIDL `result`, a Rust CLIENT receives the envelope as JSON.\n    // Ok(envelope) does not imply that envelope[\"success\"] is true.\n    let domain = peer.make_result_with_timeout(false, Duration::from_secs(2))\n        .map_err(|e| e.to_string())?;\n    if domain[\"success\"] != false || domain[\"error\"] != \"deliberate domain error\" {\n        return Err(\"wrong domain error\".into());\n    }\n    let success = peer.make_result(true).map_err(|e| e.to_string())?;\n    if success[\"success\"] != true || success[\"value\"] != 42 {\n        return Err(\"wrong success result\".into());\n    }\n    peer.do_void().map_err(|e| e.to_string())?;\n\n    match peer.slow_with_timeout(500, Duration::from_millis(50)) {\n        Err(logos_rust_sdk::LogosError::PluginCallFailed { message, .. }) => {\n            // The SDK carries the protocol's structured error as message JSON.\n            let error: serde_json::Value = serde_json::from_str(&message)\n                .map_err(|e| e.to_string())?;\n            if error[\"code\"] != \"timeout\" { return Err(message); }\n        }\n        other => return Err(format!(\"expected timeout: {other:?}\")),\n    }\n    let completed = peer.slow_with_timeout(10, Duration::from_secs(2))\n        .map_err(|e| e.to_string())?;\n    if completed != 10 { return Err(\"longer deadline failed\".into()); }\n    if peer.echo_int(7).map_err(|e| e.to_string())? != 7 {\n        return Err(\"default call failed\".into());\n    }\n    if !matches!(peer.echo_int_with_timeout(0, Duration::ZERO),\n                 Err(logos_rust_sdk::LogosError::InvalidTimeout { .. })) {\n        return Err(\"zero timeout should be rejected\".into());\n    }\n    Ok(\"sync checks passed\".into())\n}\n\n// The callbacks may run on another thread. Keep shared state behind a mutex.\nstatic ASYNC_STATE: std::sync::Mutex<(usize, bool)> = std::sync::Mutex::new((0, true));\nfn record(ok: bool) {\n    let mut state = ASYNC_STATE.lock().unwrap();\n    state.0 += 1;\n    state.1 &= ok;\n}\nfn start_async(provider: &str) {\n    use std::time::Duration;\n    *ASYNC_STATE.lock().unwrap() = (0, true);\n    let peer = calls::CallsClient::bind(provider);\n    peer.echo_int_async_with_timeout(0, Duration::from_secs(2), |r| {\n        record(matches!(r, Ok(0)));\n    });\n    peer.make_result_async_with_timeout(false, Duration::from_secs(2), |r| {\n        record(r.map(|v| v[\"success\"] == false\n                        && v[\"error\"] == \"deliberate domain error\").unwrap_or(false));\n    });\n    peer.slow_async_with_timeout(500, Duration::from_millis(50), |r| {\n        // Async errors currently retain the message, not the structured code.\n        // This controlled slow call should fail; the sync probe checks the code.\n        record(matches!(r, Err(logos_rust_sdk::LogosError::PluginCallFailed { .. })));\n    });\n}\n\n#[no_mangle]\npub extern \"Rust\" fn logos_module_install() {\n    install::<ApiRust>();\n}\n```"}, {"execs": [], "md": "## Read errors and choose deadlines\n\nThere are two independent outcomes:\n\n| Outcome | C++ generated client | Rust generated client |\n|---|---|---|\n| Call could not complete (timeout, unavailable peer, dispatch failure) | `!err.ok()` or `!asyncResult.ok()` | `Err(LogosError)` |\n| Method ran and refused the operation | `err.ok()` plus `!value.success` | `Ok(envelope)` plus `envelope[\"success\"] == false` |\n| Method ran successfully | `err.ok()` plus a valid value | `Ok(value)` |\n\nC++ uses `peer.echoInt(0, &err, 2000)` for a two-second limit. A missing error\nargument discards failure details. For asynchronous work use\n`echoIntAsyncResult(0, callback, 2000)`; the value-only `echoIntAsync` cannot tell\nfailure from a legitimate zero. The Qt-free value-only async twin has no timeout\nargument. These examples use the Qt-free surface; Qt wrappers use `Timeout`\ninstead of integer milliseconds.\n\nRust uses `echo_int_with_timeout(0, Duration::from_secs(2))` and\n`echo_int_async_with_timeout(0, duration, callback)`. A provider's\n`Result<Value, String>` becomes the LIDL result envelope; it is distinct from\nthe client's `Result<Value, LogosError>` call outcome. The examples inspect both.\nRust synchronous transport errors carry protocol JSON in\n`PluginCallFailed.message`; the sync example parses its `code`. Async failures\ncurrently keep only the human-readable message, so the async example handles\n`PluginCallFailed` without assuming that the structured code survived.\n\nWithout an explicit deadline the protocol default is 20 seconds. C++ values\n`<= 0` select that default. Rust explicit durations must convert to at least\n1 ms and at most `i32::MAX` ms; zero/sub-millisecond durations and values above\nthat range return `InvalidTimeout`. Deadlines apply to one call and do not\nchange later calls on the client.\n\nA timeout does **not cancel** the provider's work. `slow(500)` can still be\nrunning after the 50 ms call has failed, so the next call gets a two-second\nbudget. Do not automatically retry a timed-out operation with side effects.\nThe async examples return to the event loop and are polled from a later call;\nshared callback state is protected by a mutex. Finish one async probe before\nstarting another in the Rust example."}, {"execs": [], "md": "## Step 4: Build both modules"}, {"execs": [{"cmd": "nix build 'github:logos-co/logos-logoscore-cli#ctl-bundle-dir' --out-link ./logosctl", "exit_code": 0, "kind": "run", "note": "", "output": "unpacking 'github:logos-co/logos-logoscore-cli/18c2a24450c9f73627bee71aec91c7b3129e53bd' into the Git cache...\ncopying path '/nix/store/8sa9pwyzb94syjjd4vl9s618sam4g8q2-source' from 'https://cache.nix.logos.co/public'...\ncopying path '/nix/store/ra6i72784l3mq0xpxy3lw9xmg2cmjbap-source' from 'https://cache.nix.logos.co/public'...\ncopying path '/nix/store/hpjy6afi3bm6pj1kgn50i9641p1c73lk-source' from 'https://cache.nix.logos.co/public'...\ncopying path '/nix/ h modules, and compares every `--json` result with its input. The `json:` argument prefix preserves arrays,\nobjects, null and literal strings without scalar coercion. It also checks empty values and optional\npresence, then calls Rust from C++ and C++ from Rust for synchronous and\nasynchronous success, domain errors and timeouts. It stops the daemon even if a\ncheck fails. Python 3 is used only for these assertions.\n\nFor an individual call in a running daemon, the equivalent commands are:\n\n```bash\nlogosctl call api_cpp echoBytes 'json:{\"_bytes\":\"AAH_\"}'\nlogosctl call api_rust echoIntList 'json:[-2,0,3]'\nlogosctl call api_cpp checkCalls api_rust\n```"}, {"execs": [{"cmd": "write check_examples.py", "kind": "file", "note": "Wrote check_examples.py", "status": "pass"}], "md": "### 5.1 `check_examples.py`\n\n```\nimport json\nimport subprocess\nimport time\nfrom pathlib import Path\n\nroot = Path(__file__).resolve().parent\ncli = [str(root / \"logosctl/bin/logosctl\"), \"--json\", \"--config-dir\", str(root / \"session\")]\n\ndef command(*args):\n    result = subprocess.run(cli + list(args), text=True, capture_output=True, timeout=30)\n    if result.returncode:\n        raise RuntimeError(f\"{args}: {result.stdout} {result.stderr}\")\n    lines = [line for line in result.stdout.splitlines() if line.startswith(\"{\")]\n    return json.loads(lines[-1]) if lines else {}\n\ndef call(module, method, *args):\n    reply = command(\"call\", module, method, *args)\n    assert reply.get(\"status\") == \"ok\", reply\n    return reply[\"result\"]\n\ncases = [['echoString', 'hello Logos'],\n ['echoBytes', {'_bytes': 'AAH_'}],\n ['echoInt', -42],\n ['echoUint', 42],\n ['echoDouble', 2.5],\n ['echoBool', False],\n ['echoAny', {'mixed': [1, False, 'text']}],\n ['echoStringList', ['one', 'two']],\n ['echoIntList', [-2, 0, 3]],\n ['echoUintList', [0, 3]],\n ['echoDoubleList', [1.5, 2.5]],\n ['echoBoolList', [True, False]],\n ['echoList', [1, 'text', None]],\n ['echoMap', {'count': 3, 'label': 'sample'}],\n ['echoBytesList', [{'_bytes': 'AAH_'}, {'_bytes': ''}]],\n ['echoBytesMap', {'data': {'_bytes': 'AAH_'}}],\n ['echoIntMap', {'first': -2, 'second': 3}],\n ['echoUnorderedMap', {'first': -2, 'second': 3}],\n ['echoNested', [[1, 2], [], [3]]],\n ['echoEntry', {'label': 'sample', 'payload': {'_bytes': 'AAH_'}, 'count': 7}],\n ['echoEntries', [{'label': 'empty', 'payload': {'_bytes': ''}}]],\n ['echoEntryMap', {'one': {'label': 'first', 'payload': {'_bytes': 'AAH_'}}}],\n ['echoBatch',\n  {'entry': {'label': 'nested', 'payload': {'_bytes': 'AAH_'}}, 'tags': ['tag']}],\n ['echoOptional', None],\n ['echoOptional', ''],\n ['echoOptional', 'present'],\n ['echoInt', 0],\n ['echoString', ''],\n ['echoStringList', []],\n ['echoBytes', {'_bytes': ''}],\n ['echoEntry', {'label': 'absent', 'payload': {'_bytes': ''}}]]\n\n# --detach returns once the daemon accepts commands; packages install\n# into its session, so it starts first.\ncommand(\"daemon\", \"start\", \"--detach\")\ntry:\n    packages = sorted(str(p) for p in root.glob(\"*/result-lgx-portable/*.lgx\"))\n    command(\"install\", *packages, \"-y\")\n    for module in (\"api_cpp\", \"api_rust\"):\n        command(\"module\", \"load\", module)\n    for module in (\"api_cpp\", \"api_rust\"):\n        for method, value in cases:\n            arg = \"json:\" + json.dumps(value, separators=(\",\", \":\"))\n            actual = call(module, method, arg)\n            assert actual == value, (module, method, value, actual)\n        print(f\"{module}: {len(cases)} type round trips passed\")\n    # Each caller runs against the provider written in the OTHER language.\n    for caller, provider in ((\"api_cpp\", \"api_rust\"), (\"api_rust\", \"api_cpp\")):\n        assert call(caller, \"checkCalls\", provider) == \"sync checks passed\"\n        assert call(caller, \"startAsync\", provider) == \"started\"\n        for attempt in range(100):\n            status = call(caller, \"asyncStatus\")\n            if status != \"pending\":\n                break\n            time.sleep(0.1)\n        assert status == \"async checks passed\", (caller, status)\n        print(f\"{caller} -> {provider}: sync and async checks passed\")\nfinally:\n    command(\"daemon\", \"stop\")\n```"}, {"execs": [{"cmd": "python3 check_examples.py", "exit_code": 0, "kind": "run", "note": "", "output": "api_cpp: 31 type round trips passed\napi_rust: 31 type round trips passed\napi_cpp -> api_rust: sync and async checks passed\napi_rust -> api_cpp: sync and async checks passed\n", "status": "pass"}], "md": "```bash\npython3 check_examples.py\n```"}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
