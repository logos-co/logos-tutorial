l-wrapping-c-library.md#24-build-the-shared-library)):\n\n```bash\ncd ../logos-calc-module/lib\ngcc -shared -fPIC -o libcalc.so libcalc.c     # Linux\n# gcc -shared -fPIC -o libcalc.dylib libcalc.c  # macOS\ncd ../../logos-calc-ui\n```\n\nAlso make sure the module itself builds successfully:"}, {"execs": [{"cmd": "cd ../logos-calc-module && git add -A && nix build && cd ../logos-calc-ui", "exit_code": 0, "kind": "run", "note": "", "output": "warning: Git tree '/home/runner/work/_temp/doctest-chain-9z9rppqh/logos-calc-module' is dirty\nthese 4 derivations will be built:\n  /nix/store/256pp7khwldk4gyw1hrjjd239j2vr2b0-logos-calc_module-lidl.drv\n  /nix/store/46gdghjmy20f341f1y0j7hpdyxizdmjj-logos-calc_module-module-lib-1.0.0.drv\n  /nix/store/95fr7820mkzsg2wlvvaci0z86z0k1vnc-logos-calc_module-module-headers-qt-1.0.0.drv\n  /nix/store/lv3zk1bi0djwspsfhkjaqmp5ak9dpplf-logos-calc_module-module.drv\nbuilding '/nix/store/46gdghjmy20f341f1y0j7hpdyxizdmjj-logos-calc_module-module-lib-1.0.0.drv'...\nbuilding '/nix/store/256pp7khwldk4gyw1hrjjd239j2vr2b0-logos-calc_module-lidl.drv'...\nbuilding '/nix/store/95fr7820mkzsg2wlvvaci0z86z0k1vnc-logos-calc_module-module-headers-qt-1.0.0.drv'...\nbuilding '/nix/store/lv3zk1bi0djwspsfhkjaqmp5ak9dpplf-logos-calc_module-module.drv'...\n", "status": "pass"}], "md": "```bash\ncd ../logos-calc-module\ngit add -A\nnix build\ncd ../logos-calc-ui\n```\n\nThe `nix build` produces `result/lib/calc_module_plugin.so` (or `.dylib`), which is the compiled Qt plugin. The `lib/libcalc.so` (or `.dylib`) inside the source tree is the underlying C library that gets linked in during the build."}, {"execs": [{"actions": [{"description": "App title visible: wait for ['Logos Calculator']", "duration_ms": 4, "index": 1, "status": "pass"}, {"description": "All operation buttons visible: wait for ['Add', 'Multiply', 'Factorial', 'Fibonacci']", "duration_ms": 8, "index": 2, "status": "pass"}], "cmd": "nix run . --override-input calc_module path:../logos-calc-module", "kind": "ui_test", "note": "", "output": "\nRunning 1 test(s)...\n\n  \u001b[32m\u2713\u001b[0m Tutorial Part 2: Building a QML UI for Your Logos Module: Option A: Use `--override-input` (quick, no flake.nix edits)\n\n1 passed, 0 failed\n\n", "runner_cmd": "node \"/home/runner/work/_temp/doctest-chain-9z9rppqh/logos-calc-ui/ui-test.mjs\" --verbose", "status": "pass"}], "md": "### 6.2 Option A: Use `--override-input` (quick, no flake.nix edits)\n\nYou can point `calc_module` at your local checkout for a single command, without touching `flake.nix` or its lock \u2014 handy for a one-off run or when the input is set to a `github:` URL:\n\n```bash\nnix run . --override-input calc_module path:../logos-calc-module\n```\n\nThis tells nix to resolve the `calc_module` flake input from your local directory instead of from the remote URL. Any changes you've made to `calc_module` locally (including the built `.so`/`.dylib` in `lib/`) are picked up immediately \u2014 no need to push to GitHub first."}, {"execs": [], "md": "### 6.3 Option B: Lock `path:` once, then run normally\n\nIf you're iterating on both repos side by side, lock `calc_module` to your local checkout once. You can't write `path:../logos-calc-module` directly into `flake.nix` \u2014 Nix evaluates the flake from a sandboxed copy, so a relative `..` escapes it and is rejected. Instead, lock it with an `--override-input` (which resolves to an absolute path and stores it in `flake.lock`):\n\n```bash\nnix flake update --override-input calc_module path:../logos-calc-module\ngit add flake.lock\n```\n\nAfter that, plain `nix run .` uses the locked local path \u2014 no override needed on each command:\n\n```bash\nnix run .\n```\n\nRe-run the `nix flake update --override-input \u2026` line whenever you want to re-point or refresh the lock. Switch to a `github:` URL in `flake.nix` when you're ready to pin to a published version."}, {"execs": [], "md": "### 6.4 Option C: Pin to the remote repo\n\nOnce `calc_module` is published to its own repo (with the `.so`/`.dylib` committed in `lib/`), point the input at it with a `github:` URL instead of the local `path:` \u2014 e.g. `calc_module.url = \"github:your-org/your-calc-module\";`. Then a plain `nix run .` fetches and builds `calc_module` from the remote:\n\n```bash\nnix run .\n```\n\n> **Important:** The remote repo must contain the built `.so`/`.dylib` in `lib/` (or the nix build must produce it). If the shared library is missing, the `calc_module` build will fail with linker errors.\n\nWhichever option you choose, clicking **Add**, **Multiply**, **Factorial**, or **Fibonacci** now calls the real module."}, {"execs": [], "md": "## Step 7: Using the Logos Design System\n\n`logos-basecamp` (and `logos-standalone-app`) has `logos-design-system` on its QML import path. Use its themed components directly \u2014 no extra setup in your module.\n\n```qml\nimport Logos.Theme\nimport Logos.Controls\nimport Logos.Icons        // optional: shared icon assets (LogosIcons.search, .install, .refresh, \u2026)\n```\n\n### Why use it\n\nHardcoding colors, font sizes, or rolling your own button means your module looks subtly different from every other module in basecamp, drifts as the design evolves, and re-implements work the design system already does. Using `Logos.Controls` + `Theme` tokens means your module gets the polished look automatically as the design system is updated \u2014 no churn on your side.\n\n### What's available\n\nRun the storybook to browse every component interactively with live property editors:\n\n```bash\ncd repos/logos-design-system\nnix run                  # or: ws run logos-design-system\n```\n\nThe sidebar splits components into two sections:\n\n- **Controls** \u2014 *designed per Figma, production-ready*. Use these directly. Examples: `LogosButton`, `LogosBadge`, `LogosCheckbox`, `LogosComboBox`, `LogosIconButton`, `LogosPaginator`, `LogosSearchBar`, `LogosTabBar` / `LogosTabButton`, `LogosTable` / `LogosTableColumn`, `LogosText`, `LogosTextField`, `LogosToolTip`.\n- **Controls (not designed)** \u2014 *placeholders with stable APIs but unstyled visuals*. Functional, you can ship with them, and you'll inherit the polished look automatically when each gets its design pass \u2014 no QML changes on your side. Examples: `LogosDialog`, `LogosDrawer`, `LogosFrame`, `LogosGroupBox`, `LogosItemDelegate`, `LogosMenu`, `LogosProgressBar`, `LogosRadioButton`, `LogosScrollBar` / `LogosScrollView`, `LogosSlider`, `LogosSpinBox`, `LogosSpinner`, `LogosStackView`, `LogosSwitch`, `LogosTextArea`, `LogosToolBar`.\n\nEach storybook page exposes a `designed: true/false` flag if you want to see at a glance which it is.\n\n### Replace raw Qt controls with Logos equivalents\n\n```qml\n// Instead of Button:\nLogosButton {\n    text: qsTr(\"Add\")\n    onClicked: callTwoOp(\"add\", inputA.text, inputB.text)\n}\n\n// Instead of TextField:\nLogosTextField {\n    id: inputA\n    placeholderText: qsTr(\"a\")\n}\n\n// Use theme colors instead of hardcoded hex values:\nRectangle {\n    color: Theme.palette.backgroundSecondary\n    Text { color: Theme.palette.text }\n}\n```\n\n### Theme tokens \u2014 avoid hardcoding magic numbers\n\n```qml\n// Palette  \u2014 Theme.palette.*\n//   background, backgroundSecondary, backgroundMuted, surface,\n//   text, textSecondary, textMuted, textTertiary,\n//   border, borderSubtle, primary, success, warning, error, info, hover, pressed, \u2026\n\n// Spacing  \u2014 Theme.spacing.*\n//   tiny, small, medium, large, xlarge, xxlarge,\n//   radiusSmall, radiusMedium, radiusLarge\n\n// Typography  \u2014 Theme.typography.*\n//   pageTitleText (36), titleText (30), panelTitleText (24),\n//   subtitleText (16), primaryText (14), secondaryText (12),\n//   weightRegular (400), weightMedium (500), weightBold (700),\n//   publicSans (font family)\n\n// Icons  \u2014 Logos.Icons.LogosIcons.*\n//   arrowLeft, arrowRight, refresh, install, trash, more, search, \u2026\n```\n\nIf a token you need is missing, file a feature issue \u2014 don't inline a hex literal or a magic number; that just stores up drift.\n\n### Feedback and contributions\n\nFeel free to report bugs, file feature requests, or contribute components / theme tokens upstream \u2014 all welcome at `logos-co/logos-design-system`. The same fix lifts every consumer, so upstreaming is the most impactful path. If you can sketch the public API you'd like to use in a feature request, it makes review and implementation much faster."}, {"execs": [], "md": "## Step 8: Load in `logos-basecamp`"}, {"execs": [{"cmd": "cd ../logos-calc-module && nix build '.#lgx' --out-link result-lgx && nix build '.#lgx-portable' --out-link result-lgx-portable && cd ../logos-calc-ui", "exit_code": 0, "kind": "run", "note": "", "output": "warning: Git tree '/home/runner/work/_temp/doctest-chain-9z9rppqh/logos-calc-module' is dirty\nthis derivation will be built:\n  /nix/store/gxf74bns3jks0lkyzvmn01307wmg2q8k-logos-calc_module-module-lib-lgx-1.0.0.drv\nbuilding '/nix/store/gxf74bns3jks0lkyzvmn01307wmg2q8k-logos-calc_module-module-lib-lgx-1.0.0.drv'...\nwarning: Git tree '/home/runner/work/_temp/doctest-chain-9z9rppqh/logos-calc-module' is dirty\nthese 3 derivations will be built:\n  /nix/store/zvxh8hasyxq77d34644f929166crvckh-closure-info.drv\n  /nix/store/qbhj8bm7hr1bmksnx532d8sszy6ldnbv-logos-calc_module-module-lib-bundle-1.0.0.drv\n  /nix/store/pzk24j1sj67h4xn7ihqmqfk6m3a5cwbb-logos-calc_module-module-lib-lgx-1.0.0.drv\nbuilding '/nix/store/zvxh8hasyxq77d34644f929166crvckh-closure-info.drv'...\nbuilding '/nix/store/qbhj8bm7hr1bmksnx532d8sszy6ldnbv-logos-calc_module-module-lib-bundle-1.0.0.drv'...\nbuilding '/nix/store/pzk24j1sj67h4xn7ihqmqfk6m3a5cwbb-logos-calc_module-module-lib-lgx-1.0.0.drv'...\n", "status": "pass"}, {"cmd": "nix flake update --override-input calc_module path:../logos-calc-module && nix build '.#lgx' --out-link result-lgx && nix build '.#lgx-portable' --out-link result-lgx-portable", "exit_code": sts every method **and event** with the `description` from its doc comment \u2014 the same docs `lm` and `logosctl module show` showed in Part 1, here in the GUI. Multi-line `///` comments render as multiple lines, exactly as written.\n\nThe sidebar labels each UI plugin by its `name` from `metadata.json`, which is why the tab reads `calc_ui`."}, {"execs": [{"cmd": "nix build 'github:logos-co/logos-basecamp#bin-bundle-dir' -o basecamp-portable", "exit_code": 0, "kind": "run", "note": "", "output": "warning: ignoring untrusted flake configuration setting 'extra-substituters'.\nPass '--accept-flake-config' to trust it\nwarning: ignoring untrusted flake configuration setting 'extra-trusted-public-keys'.\nPass '--accept-flake-config' to trust it\nevaluation warning: `mesa.drivers` is deprecated, use `mesa` instead\nthis path will be fetched (0.0 KiB download, 805.2 MiB unpacked):\n  /nix/store/ijz3lg88xd7kv11ig9x020rsbb2d0kyz-logos-basecamp-bundle-0.0.0-dev\ncopying path '/nix/store/ijz3lg88xd7kv11ig9x020rsbb2d0kyz-logos-basecamp-bundle-0.0.0-dev' from 'https://cache.nix.logos.co/public'...\n", "status": "pass"}], "md": "### 8.8 Portable basecamp build (optional)\n\nThe dev build above depends on nix store paths at runtime. For a self-contained portable build that works without nix:\n\n```bash\nnix build 'github:logos-co/logos-basecamp#bin-bundle-dir' -o basecamp-portable\n```\n\n```bash\n# Launch once to preinstall bundled modules\n./basecamp-portable/bin/LogosBasecamp\n```\n\nThe portable build uses a different data directory (`LogosBasecamp` instead of `LogosBasecampDev`). Set `BASECAMP_DIR` to your platform's path:\n\n```bash\n# macOS:\nBASECAMP_DIR=\"$HOME/Library/Application Support/Logos/LogosBasecamp\"\n\n# Linux:\nBASECAMP_DIR=\"$HOME/.local/share/Logos/LogosBasecamp\"\n```\n\nInstall your modules using the **portable** `.lgx` variants:\n\n```bash\n# Install core module (use portable variant)\n./pm/bin/lgpm --modules-dir \"$BASECAMP_DIR/modules\" \\\n  install --file ../logos-calc-module/result-lgx-portable/*.lgx\n\n# Install UI plugin (use portable variant)\n./pm/bin/lgpm --ui-plugins-dir \"$BASECAMP_DIR/plugins\" \\\n  install --file result-lgx-portable/*.lgx\n\n# Launch\n./basecamp-portable/bin/LogosBasecamp\n```\n\n> **Important:** Portable basecamp requires portable `.lgx` variants (`result-lgx-portable`), and the dev build requires dev variants (`result-lgx`). Mixing them will cause loading failures."}, {"execs": [], "md": "### 8.9 Install via logos-basecamp UI\n\nInstead of using `lgpm` on the command line, you can install modules through the basecamp UI:\n\n1. Launch `logos-basecamp`\n2. Go to **Package Manager**\n3. Click **Install from file**\n4. Select `../logos-calc-module/result-lgx/*.lgx` \u2014 installs `calc_module`\n5. Repeat for `result-lgx/*.lgx` \u2014 installs `calc_ui`\n\nA `calc_ui` tab appears in the sidebar (UI plugins are labelled by their `name` from `metadata.json`). Clicking it loads your `Main.qml`."}, {"execs": [], "md": "### 8.10 Hot-reloading QML with `nix build .#ui-dev`\n\nFor QML iteration, build the dev launcher once. After that, QML edits need no rebuild at all:\n\n```bash\nnix build .#ui-dev\n./result/bin/run-logos-standalone-ui\n```\n\nRun from the repo root and the launcher finds your QML source automatically, then watches it. Edit a `.qml` file, save, and the view re-renders in about 200 ms. It reports what it picked up on startup:\n\n```\nrun-logos-standalone-ui: hot-reloading QML from /path/to/logos-calc-ui\n  (export DEV_QML_PATH to override, or LOGOS_QML_HOT_RELOAD=0 to disable)\n```\n\n`ui-dev` is the same wrapper `nix run .` uses \u2014 dependency modules bundled and loaded identically \u2014 exposed as a package so it lands in `./result/bin`. It is a development target and is never bundled into `.lgx` packages.\n\n**What reloads, and what doesn't.**\n\n- **Any `.qml`/`.js` under your view directory**, including files and folders created after launching.\n- **The backend keeps running.** A module's C++ backend lives in a separate `ui-host` process, so its state and connections survive a reload.\n- **QML-side state resets** \u2014 scroll position, text fields, current tab.\n- **A syntax error is recoverable.** It's logged with a line number and the view blanks; the next save that compiles restores it.\n- **C++, `.rep`, `metadata.json` and CMake changes still need a rebuild.** Re-run `nix build .#ui-dev` and relaunch.\n\n**Why not `nix run .`?** It re-evaluates the flake and rehashes the source tree on every invocation. Since `src = ./.` covers every tracked file including `*.qml`, even a one-character QML edit rebuilds the plugin before the app starts. Building `ui-dev` once avoids that entirely.\n\n> **Custom layouts:** the launcher looks for the `view` entry from `metadata.json` under `src/<viewDir>/`, then `<viewDir>/`. If your tree differs, set `DEV_QML_PATH` to the directory holding the entry file and it takes precedence.\n\n> This does not work with `logos-basecamp`. Basecamp loads QML plugins from its own data directory, so source edits are not reflected until you rebuild and reinstall the `.lgx` package."}, {"execs": [], "md": "### 8.11 Testing without any runtime\n\nYou can open `Main.qml` in any QML viewer (e.g., `qml` from Qt) to test the layout.\n\n#### Install\n\nYou'll need to have QML and any included modules (`QtQuick` and submodules `Controls`, and `Layout`).\n\nEg, to simply install on linux (apt package manager):\n\n```bash\nsudo apt install qml-qt6 qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts\n```\n\n#### Viewing the QML\n\nThe `logos` bridge won't be available, so clicking buttons will show \"Logos bridge not available\" -- but you can verify the layout and styling work correctly.\n\n```bash\n# If you have Qt and included modules installed\n# macOS:\nqml Main.qml\n\n# Linux:\nqml6 Main.qml\n```"}, {"execs": [], "md": "## Step 9: UI Integration Tests\n\nYou can add automated UI tests that verify your QML plugin renders correctly. The test infrastructure is built into `logos-module-builder` \u2014 just add `.mjs` test files to a `tests/` directory and you get `nix build .#integration-test` for free.\n\nTests use the [logos-qt-mcp](https://github.com/logos-co/logos-qt-mcp) test framework, which connects to the QML inspector inside `logos-standalone-app` and can find elements, click buttons, verify text, and take screenshots."}, {"execs": [{"cmd": "write tests/ui-tests.mjs", "kind": "file", "note": "Wrote tests/ui-tests.mjs", "status": "pass"}], "md": "### 9.1 Create a test file\n\nCreate `tests/ui-tests.mjs`:\n\n```javascript\nimport { resolve } from \"node:path\";\n\n// CI sets LOGOS_QT_MCP automatically; for interactive use: nix build .#test-framework -o result-mcp\nconst root =\n  process.env.LOGOS_QT_MCP ||\n  new URL(\"../result-mcp\", import.meta.url).pathname;\nconst { test, run } = await import(\n  resolve(root, \"test-framework/framework.mjs\")\n);\n\ntest(\"calc_ui: loads and shows title\", async (app) => {\n  await app.waitFor(\n    async () => {\n      await app.expectTexts([\"Logos Calculator\"]);\n    },\n    { timeout: 15000, interval: 500, description: \"calc_ui to load\" },\n  );\n});\n\ntest(\"calc_ui: add button visible\", async (app) => {\n  await app.expectTexts([\"Add\"]);\n});\n\ntest(\"calc_ui: click add shows validation\", async (app) => {\n  await app.click(\"Add\");\n  await app.waitFor(\n    async () => {\n      await app.expectTexts([\"Enter values for a and b\"]);\n    },\n    { timeout: 5000, interval: 500, description: \"validation message to appear\" },\n  );\n});\n\nrun();\n```"}, {"execs": [{"cmd": "git add tests/", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 9.2 Run the tests\n\n```bash\ngit add tests/\n```"}, {"execs": [{"cmd": "nix flake update --override-input calc_module path:../logos-calc-module && nix build .#integration-test -L", "exit_code": 1, "kind": "run", "note": "exit code 1", "output": "warning: Git tree '/home/runner/work/_temp/doctest-chain-9z9rppqh/logos-calc-ui' is dirty\nwarning: Git tree '/home/runner/work/_temp/doctest-chain-9z9rppqh/logos-calc-ui' is dirty\nerror: flake 'git+file:///home/runner/work/_temp/doctest-chain-9z9rppqh/logos-calc-ui' does not provide attribute 'packages.x86_64-linux.integration-test', 'legacyPackages.x86_64-linux.integration-test' or 'integration-test'\n", "status": "fail"}], "md": "```bash\nnix build .#integration-test -L\n```\n\nThe `integration-test` output launches `logos-standalone-app` with `QT_QPA_PLATFORM=offscreen` (no display needed), connects to the QML inspector, and runs all `.mjs` files in `tests/`.\n\nYou can have multiple test files (e.g., `tests/smoke.mjs`, `tests/interactions.mjs`) \u2014 they are all discovered and run automatically.\n\nTo run tests interactively (against an already-running app):\n\n```bash\nnix build .#test-framework -o result-mcp\nnix run .          # start the app with inspector on :3768\nnode tests/ui-tests.mjs  # in another terminal\n```"}, {"execs": [], "md": "## Calling Another App\n\n`logos.callModule()` calls a module you name. Sometimes you want a\n**capability** instead \u2014 \"somebody sign this\", \"somebody open this chat\" \u2014\nwithout knowing or caring which app provides it. That is an *intent*.\n\n### Requesting\n\nDeclare what you may ask for in `metadata.json`. Entries are **objects**,\nnot strings:\n\n```json\n\"uses\": [ { \"intent\": \"calc.history.show\" } ]\n```\n\nThen ask:\n\n```qml\nlogos.request(\"calc.history.show\", { last: 10 }, function (res) {\n    if (res.ok) console.log(\"shown by\", res.data.provider)\n    else        console.log(\"failed:\", res.error)\n})\n```\n\nYou may only request intents you declared \u2014 an undeclared request comes\nback `not_declared`. The callback fires exactly once and always\nasynchronously, and `res.data` is a real JS object, not a JSON string.\n\n### Providing\n\n```json\n\"provides\": [ { \"intent\": \"calc.history.show\" } ]\n```\n\n```qml\nConnections {\n    target: logos\n    function onIntentRequested(requestId, intent, params, requesterName) {\n        // Show whatever UI you need, then answer. Answering later is\n        // normal \u2014 you are not obliged to respond synchronously.\n        logos.respond(requestId, true, ({ provider: \"calc_ui\" }), \"\")\n    }\n}\n```\n\nDeclaring `provides` without connecting `intentRequested` is the one\nmistake that looks like a hang: the requester waits out the deadline and\ngets `timeout`.\n\n> **Watch the shape.** `\"uses\": [\"calc.history.show\"]` \u2014 a bare string\n> array \u2014 is silently ignored, and the request then fails `not_declared`\n> with nothing pointing at the manifest. Objects, always. Check the shell\n> log for `IntentRegistry:` lines, which name every declaration it skipped.\n\nIf more than one installed app provides the same intent, the shell asks\nthe user which to use and remembers the answer if they tick the box. You\nnever see that list and cannot influence it \u2014 see\n[Intents for App Developers](guide-intents-for-app-developers.md)."}, {"execs": [], "md": "## Known Limitations\n\n### QML-to-C++ type coercion\n\nWhen calling C++ module methods from QML via `logos.callModule()`, arguments are passed through IPC as `QVariant` values. The runtime automatically coerces mismatched types to match the target method signature \u2014 for example, a `double` sent from QML will be converted to `int` if the method expects an integer, and numeric strings will be converted to their numeric types.\n\nThis means you can define your module methods with their natural parameter types and calls from QML will work without manual conversion. In the pure-C++ (`universal`) module from Part 1 that looks like:\n\n```cpp\n// In calc_module_impl.h \u2014 plain C++, no Qt. The generator maps\n// int64_t onto the wire as int; the runtime coerces QML args to match.\nint64_t add(int64_t a, int64_t b);\n```\n\n> **Note:** Type coercion uses `QVariant::convert()`, which rounds (not truncates) when converting `double` to `int` \u2014 e.g., `3.7` becomes `4`.\n\n### QML changes not appearing after rebuild\n\nQt caches compiled QML on disk. If you update your `Main.qml`, rebuild and reinstall the `.lgx`, but the old UI still appears, the cache is stale. Fix by disabling the cache before launching:\n\n```bash\nQML_DISABLE_DISK_CACHE=1 ./basecamp-result/bin/LogosBasecamp\n```\n\n### UI module not loading or basecamp behaving unexpectedly\n\nWhen switching between portable and dev builds of basecamp, or running multiple basecamp instances, the data directory can get into a bad state (stale modules, mixed variants, corrupted preinstall). Clear it and let basecamp re-preinstall on next launch:\n\n```bash\n# Remove basecamp's data directory\n# macOS:\nrm -rf ~/Library/Application\\ Support/Logos/LogosBasecampDev\n\n# Linux:\nrm -rf ~/.local/share/Logos/LogosBasecampDev\n\n# Relaunch \u2014 basecamp will re-preinstall its bundled modules\n./basecamp-result/bin/LogosBasecamp\n```\n\nThen reinstall your custom modules."}, {"execs": [], "md": "## Recap\n\n|                     | Core Module (Part 1)                                   | QML UI Plugin (Part 2)        |\n| ------------------- | ------------------------------------------------------ | ----------------------------- |\n| Language            | C++ (plain `*_impl` class)                             | QML / JavaScript              |\n| Files               | `*_impl.h/.cpp`, `CMakeLists.txt`, `metadata.json`     | `Main.qml`, `metadata.json`   |\n| Compilation         | Yes (CMake \u2192 `.so`)                                    | No (file copy)                |\n| `metadata.type`     | `\"core\"` (`interface: \"universal\"`)                    | `\"ui_qml\"`                    |\n| Test command        | `logosctl install` + `module load` + `call`            | `nix run .`                   |\n| Calls other modules | Via `LogosModuleContext` `modules()` (C++)             | Via `logos.callModule()` (JS) |"}, {"execs": [], "md": "## What's Next\n\n- **Add more methods** to `calc_module` and call them from QML\n- **Use Logos Design System** styled components for consistent look and feel\n- **Build a C++ UI module** for cases where QML sandboxing is too restrictive \u2014 see [Developer Guide](logos-developer-guide.md), Section 7.2"}]}, {"meta": {"name": "Tutorial Part 3: Building a C++ UI Module (Process-Isolated)", "platform": "Linux (ext=so)", "release": "(none)"}, "rows": [{"execs": [], "md": "# Tutorial Part 3: Building a C++ UI Module (Process-Isolated)\n\nThis is Part 3 of the Logos module tutorial series. In [Part 2](tutorial-qml-ui-app.md) you built a QML-only UI plugin. Now you'll build a **ui_qml module with a C++ backend** \u2014 the backend runs in a separate `ui-host` process while the QML view loads in the host app (basecamp / standalone).\n\nYou'll use the **universal authoring model**: set `\"interface\": \"universal\"` in `metadata.json` and write exactly two things \u2014 the `.rep` (your view contract) and a `*Backend` class that implements it. The `*Plugin` and `*Interface` classes, the `initLogos(LogosAPI*)` wiring, and the typed-SDK construction are all generated for you. This is the same model Part 1 used for the `calc_module` core module (`interface: universal`), now applied to a UI module.\n\n**What you'll build:** A `calc_ui_cpp` module with:\n\n- A `.rep` file exercising the **full QtRO surface**, not just slots: value slots and a void slot, `PROP`s of different types (`QString`, `int`) and both modes (`READONLY` and `READWRITE`), and a `SIGNAL` \u2014 the one Qt-typed contract you author\n- A C++ `*Backend` class that derives the generated `SimpleSource` (implements the `.rep`) and `LogosUiPluginContext` (gives `modules()` Qt-typed callers, event subscriptions, and `onContextReady()`)\n- A QML view that drives each surface: `logos.watch()` for slot replies, plain property reads for auto-synced PROPs, a property *write* for the READWRITE memory register, a `Connections` block for the signal, and a label fed by a typed `calc_module` **event subscription**\n- Process isolation: backend crashes can't bring down the host app\n\nYou write only the `.rep` and the `Backend`. The `*Plugin`/`*Interface` classes, the `initLogos`/`setBackend` wiring, and the typed SDK are generated.\n\n\n**Why C++ backend over QML-only?**\n\n|                   | QML-only (Part 2)                                                 | C++ backend (Part 3)                                  |\n| ----------------- | ----------------------------------------------------------------- | ----------------------------------------------------- |\n| Compilation       | None                                                              | CMake + Qt                                            |\n| Process isolation | No (QML runs in-process)                                          | Yes (C++ in separate `ui-host` process)               |\n| Backend calls     | `logos.callModule()` / `logos.callModuleAsync()` to other modules | `modules()` typed SDK in C++ (type-safe, no QVariant) |\n| Type safety       | Args travel as `QVariant`                                         | C++ types preserved                                   |\n| QML \u2194 backend     | Direct bridge                                                     | Qt Remote Objects (typed replica)                     |\n| `.rep` file       | Not needed                                                        | Required \u2014 your view contract, the one file you author |\n| C++ you write     | None                                                              | One `*Backend` class \u2014 no hand-written plugin/interface |\n\n## Prerequisites\n\n- Completed [Part 1](tutorial-wrapping-c-library.md) \u2014 you have a working `calc_module` with the shared library built (`.so` on Linux, `.dylib` on macOS in `logos-calc-module/lib/`)\n- Nix with flakes enabled"}, {"execs": [], "md": "## Architecture\n\n```\n  logos-basecamp / logos-standalone-app\n  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n  \u2502                                             \u2502\n  \u2502   QML View (Main.qml)                      \u2502\n  \u2502     readonly property var backend:          \u2502\n  \u2502       logos.module(\"calc_ui_cpp\")           \u2502\n  \u2502     logos.watch(backend.add(1,2))\u2502\n  \u2502          \u2502                                  \u2502\n  \u2502          \u2502  Qt Remote Objects (socket)      \u2502\n  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n             \u2502\n  ui-host process (separate)\n  \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n  \u2502          \u25bc                                  \u2502\n  \u2502   CalcUiCppBackend (you write this)         \u2502\n  \u2502     : CalcUiCppSimpleSource  (impl .rep)    \u2502\n  \u2502     : LogosUiPluginContext   (modules())    \u2502\n  \u2502     int add(int a, int b) override {        \u2502\n  \u2502       return modules().calc_module.add(a,b);\u2502\n  \u2502     }                                       \u2502\n  \u2502          \u2502                                  \u2502\n  \u2502          \u2502  modules() typed SDK             \u2502\n  \u2502          \u25bc                                  \u2502\n  \u2502   calc_module (loaded in ui-host)           \u2502\n  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\nYou author two files: the `.rep` (your view contract) and the `*Backend` class. Everything else is generated.\n\nThe `.rep` file declares the interface. At build time, Qt's `repc` compiler generates:\n\n- **`CalcUiCppSimpleSource`** \u2014 base class the backend implements\n- **`CalcUiCppReplica`** \u2014 typed replica the QML view uses\n- **`calc_ui_cpp_replica_factory`** \u2014 separate plugin that the host loads to create typed replicas\n\nAnd because `metadata.json` sets `\"interface\": \"universal\"`, the builder also generates the plumbing a classic plugin made you hand-write:\n\n- **`CalcUiCppInterface`** \u2014 the Logos plugin interface (`name()`, `version()`)\n- **`CalcUiCppPlugin`** \u2014 the `Q_OBJECT` plugin with `Q_PLUGIN_METADATA`, `initLogos(LogosAPI*)`, and the `setBackend()` / `enableRemoting()` wiring \u2014 built around your `*Backend`\n\nYour `*Backend` derives `LogosUiPluginContext`. A UI plugin is a view, not a module, so the context carries only the dependency surface: `modules()` typed method callers for your `dependencies`, typed **event subscriptions** (`modules().dep.on<Event>(...)`), and `onContextReady()` (fires when the backend is wired, so subscriptions are live before the view's first call). The dep wrappers are **Qt-typed** (`QString`, `int`, ...) to match the `.rep` slots \u2014 no std<->Qt conversions in the view.\n\nThe `.rep` is more than a list of slots, and this tutorial exercises the whole of it: value slots and a void slot, `PROP`s of different types and both modes (a slot-driven `READONLY` counter, a `READWRITE` memory register QML writes back, an event-fed `READONLY` string), and a `SIGNAL` the backend pushes to the view. The calculator slots *call* `calc_module`; `record()` feeds the PROP + SIGNAL after each call; and `onContextReady()` *subscribes* to `calc_module`'s `versionReady` event to feed the auto-syncing event PROP."}, {"execs": [], "md": "## Step 1: Scaffold\n\nCreate a new directory and initialise it from the C++ backend UI template:\n\n`mkdir logos-calc-ui-cpp && cd logos-calc-ui-cpp`"}, {"execs": [{"cmd": "nix flake init -t github:logos-co/logos-module-builder#ui-qml-backend", "exit_code": 0, "kind": "run", "note": "", "output": "wrote: \"/home/runner/work/_temp/doctest-chain-9z9rppqh/logos-calc-ui-cpp/CMakeLists.txt\"\nwrote: \"/home/runner/work/_temp/doctest-chain-9z9rppqh/logos-calc-ui-cpp/flake.nix\"\nwrote: \"/home/runner/work/_temp/doctest-chain-9z9rppqh/logos-calc-ui-cpp/metadata.json\"\nwrote: \"/home/runner/work/_temp/doctest-chain-9z9rppqh/logos-calc-ui-cpp/src/icons/icon.png\"\nwrote: \"/home/runner/work/_temp/doctest-chain-9z9rppqh/logos-calc-ui-cpp/src/icons\"\nwrote: \"/home/runner/work/_temp/doctest-chain-9z9rppqh/logos-calc-ui-cpp/src/qml/Main.qml\"\nwrote: \"/home/runner/work/_temp/doctest-chain-9z9rppqh/logos-calc-ui-cpp/src/qml\"\nwrote: \"/home/runner/work/_temp/doctest-chain-9z9rppqh/logos-calc-ui-cpp/src/ui_example.rep\"\nwrote: \"/home/runner/work/_temp/doctest-chain-9z9rppqh/logos-calc-ui-cpp/src/ui_example_backend.cpp\"\nwrote: \"/home/runner/work/_temp/doctest-chain-9z9rppqh/logos-calc-ui-cpp/src/ui_example_backend.h\"\nwrote: \"/home/runner/work/_temp/doctest-chain-9z9rppqh/logos-calc-ui-cpp/src\"\n", "status": "pass"}], "md": "```bash\nnix flake init -t github:logos-co/logos-module-builder#ui-qml-backend\n```\n\nThis scaffolds the **universal** UI backend template: a `metadata.json` with `\"interface\": \"universal\"`, an example `.rep` (`src/ui_example.rep`), and a single `*Backend` class (`src/ui_example_backend.h` / `.cpp`) \u2014 no hand-written interface or plugin files. We'll replace the `ui_example` files with our calculator's `.rep` + backend."}, {"execs": [{"cmd": "rm -f src/ui_example.rep src/ui_example_backend.h src/ui_example_backend.cpp", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nrm -f src/ui_example.rep src/ui_example_backend.h src/ui_example_backend.cpp\n```\n\nRemove the example `.rep` and backend \u2014 we replace them with the `calc_ui_cpp` equivalents in the steps below. (There are no `*_interface.h` / `*_plugin.{h,cpp}` files to remove: in the universal model those are generated, not authored.)"}, {"execs": [{"cmd": "git init && git add -A", "exit_code": 0, "kind": "run", "note": "", "output": "hint: Using 'master' as the name for the initial branch. This default branch name\nhint: will change to \"main\" in Git 3.0. To configure the initial branch name\nhint: to use in all of your new repositories, which will suppress this warning,\nhint: call:\nhint:\nhint: \tgit config --global init.defaultBranch <name>\nhint:\nhint: Names commonly chosen instead of 'master' are 'main', 'trunk' and\nhint: 'development'. The just-created branch can be renamed via this command:\nhint:\nhint: \tgit branch -m <name>\nhint:\nhint: Disable this message with \"git config set advice.defaultBranchName false\"\nInitialized empty Git repository in /home/runner/work/_temp/doctest-chain-9z9rppqh/logos-calc-ui-cpp/.git/\n", "status": "pass"}], "md": "```bash\ngit init && git add -A\n```"}, {"execs": [], "md": "## Step 2: `metadata.json`\n\nReplace the template contents with your plugin's details:"}, {"execs": [{"cmd": "write metadata.json", "kind": "file", "note": "Wrote metadata.json", "status": "pass"}], "md": "```json\n{\n  \"name\": \"calc_ui_cpp\",\n  \"version\": \"1.0.0\",\n  \"type\": \"ui_qml\",\n  \"interface\": \"universal\",\n  \"category\": \"tools\",\n  \"description\": \"Calculator C++ UI \u2014 QML view with process-isolated backend for calc_module\",\n  \"main\": \"calc_ui_cpp_plugin\",\n  \"view\": \"qml/Main.qml\",\n  \"icon\": \"icons/calc.png\",\n  \"dependencies\": [\"calc_module\"],\n  \"codegen\": { \"rep\": \"src/calc_ui_cpp.rep\" },\n\n  \"nix\": {\n    \"packages\": {\n      \"build\": [],\n      \"runtime\": []\n    },\n    \"external_libraries\": [],\n    \"cmake\": {\n      \"find_packages\": [],\n      \"extra_sources\": [],\n      \"extra_include_dirs\": [],\n      \"extra_link_libraries\": []\n    }\n  }\n}\n```\n\nCreate the icon directory and add a placeholder icon \u2014 a PNG that is exactly 256\u00d7256, the only size LGX packaging accepts (displayed in the `logos-basecamp` sidebar when the module is loaded):"}, {"execs": [{"cmd": "mkdir -p icons && echo 'iVBORw0KGgoAAAANSUhEUgAAAQAAAAEAAQMAAABmvDolAAAABlBMVEUuzHEuzHEVOa2oAAAAH0lEQVR42u3BAQ0AAADCoPdPbQ43oAAAAAAAAAAAvg0hAAABYOSdlwAAAABJRU5ErkJggg==' | base64 -d > icons/calc.png", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "```bash\nmkdir -p icons\n# Copy any PNG here \u2014 or generate a 256\u00d7256 placeholder:\necho \"iVBORw0KGgoAAAANSUhEUgAAAQAAAAEAAQMAAABmvDolAAAABlBMVEUuzHEuzHEVOa2oAAAAH0lEQVR42u3BAQ0AAADCoPdPbQ43oAAAAAAAAAAAvg0hAAABYOSdlwAAAABJRU5ErkJggg==\" | base64 -d > icons/calc.png\n```\n\nKey fields:\n\n- `\"type\": \"ui_qml\"` \u2014 tells the builder this is a QML view module\n- `\"interface\": \"universal\"` \u2014 selects the universal authoring model: you write the `.rep` + a `*Backend` class, and the `*Plugin`/`*Interface` glue is generated. Without this key, the builder expects the classic hand-written `initLogos(LogosAPI*)` plugin.\n- `\"codegen\": { \"rep\": \"src/calc_ui_cpp.rep\" }` \u2014 names your view contract. (`backend_class` / `backend_header` are also overridable, defaulting to `CalcUiCppBackend` / `calc_ui_cpp_backend.h`.)\n- `\"main\": \"calc_ui_cpp_plugin\"` \u2014 the generated backend Qt plugin library (without extension)\n- `\"view\": \"qml/Main.qml\"` \u2014 the QML entry point\n- `\"dependencies\": [\"calc_module\"]` \u2014 core modules the backend calls via `modules()`"}, {"execs": [], "md": "## Step 3: The `.rep` File\n\nCreate `src/calc_ui_cpp.rep`:"}, {"execs": [{"cmd": "write src/calc_ui_cpp.rep", "kind": "file", "note": "Wrote src/calc_ui_cpp.rep", "status": "pass"}], "md": "```rep\nclass CalcUiCpp\n{\n    // \u2500\u2500 SLOTs \u2014 call-and-return; each reply reaches QML via logos.watch() \u2500\u2500\n    SLOT(int add(int a, int b))\n    SLOT(int multiply(int a, int b))\n    SLOT(int factorial(int n))\n    SLOT(int fibonacci(int n))\n    SLOT(QString libVersion())\n\n    // Void slot \u2014 fire-and-forget. Asks calc_module to (re-)announce\n    // its version as a `versionReady` event; there's no return value\n    // to await, the answer comes back through the PROP below.\n    SLOT(void announceVersion())\n\n    // \u2500\u2500 PROPs \u2014 auto-synced backend \u2192 every QML replica, no polling \u2500\u2500\n    // QString, event-fed: the typed `versionReady` subscription the\n    // backend arms in onContextReady() writes it. Starts empty.\n    PROP(QString versionEvent=\"\" READONLY)\n\n    // int, slot-driven: the backend bumps it after each calculation,\n    // so the view shows a live tally without ever polling.\n    PROP(int computeCount=0 READONLY)\n\n    // int, READWRITE: a memory register the QML view both *reads* and\n    // *writes* (Store / Clear buttons), and the backend may set too.\n    // A write round-trips QML \u2192 replica \u2192 source \u2192 back to every replica.\n    PROP(int memory=0 READWRITE)\n\n    // \u2500\u2500 SIGNAL \u2014 backend \u2192 view push, distinct from a return value \u2500\u2500\n    // Emitted after each calculation. QML catches it with a\n    // Connections block (not logos.watch(), not a PROP read).\n    SIGNAL(computed(QString op, int result))\n}\n```\n\nThis is the **single source of truth** for the remote interface, and the one Qt-typed file you author \u2014 the `.rep` uses Qt types (`QString`, `int`) because that's the Qt Remote Objects wire contract. `repc` generates:\n\n- `rep_calc_ui_cpp_source.h` \u2014 `CalcUiCppSimpleSource` with virtual slots your `*Backend` overrides, a `set<Prop>(...)` setter + change signal for each PROP (`setVersionEvent`, `setComputeCount`, `setMemory`), and the `computed(...)` signal you `emit`\n- `rep_calc_ui_cpp_replica.h` \u2014 `CalcUiCppReplica` with typed methods, the auto-synced `versionEvent` / `computeCount` / `memory` properties, and the `computed` signal the QML view reads, writes, and connects to\n\nOne contract, four kinds of surface \u2014 slots are only the first:\n\n- **SLOT** return values arrive as `QRemoteObjectPendingReply` \u2014 `logos.watch()` turns them into JS Promises in QML. `add`/`multiply`/\u2026 return values; `announceVersion()` is a **void** slot (fire-and-forget, no reply to watch).\n- **PROP** auto-syncs from the backend to every QML replica with no polling. We use three, of two types and two modes: `versionEvent` (QString, READONLY, fed by a module-**event subscription** in Step 5), `computeCount` (int, READONLY, bumped by each slot), and `memory` (int, **READWRITE** \u2014 QML assigns `backend.memory = \u2026` and the new value round-trips through the backend source and back to the view).\n- **SIGNAL** is a backend \u2192 view push that is neither a return value nor a synced property: `computed(op, result)` fires after each calculation and the QML view catches it with a `Connections` block."}, {"execs": [], "md": "## Step 4: `CMakeLists.txt`"}, {"execs": [{"cmd": "write CMakeLists.txt", "kind": "file", "note": "Wrote CMakeLists.txt", "status": "pass"}], "md": "```cmake\ncmake_minimum_required(VERSION 3.14)\nproject(CalcUiCppPlugin LANGUAGES CXX)\n\nif(DEFINED ENV{LOGOS_MODULE_BUILDER_ROOT})\n    include($ENV{LOGOS_MODULE_BUILDER_ROOT}/cmake/LogosModule.cmake)\nelse()\n    message(FATAL_ERROR \"LogosModule.cmake not found. Set LOGOS_MODULE_BUILDER_ROOT.\")\nendif()\n\n# Derive the module name from metadata.json \u2014 single source of truth.\nfile(READ \"${CMAKE_CURRENT_SOURCE_DIR}/metadata.json\" METADATA_JSON)\nstring(JSON MODULE_NAME GET ${METADATA_JSON} name)\n\nlogos_module(\n    NAME ${MODULE_NAME}\n    REP_FILE src/calc_ui_cpp.rep\n    SOURCES\n        src/calc_ui_cpp_backend.h\n        src/calc_ui_cpp_backend.cpp\n    INCLUDE_DIRS\n        src\n)\n```\n\nYou list only your two authored sources \u2014 the `*Backend` header and implementation. `REP_FILE` points at **your** `.rep`; the generated `*Plugin` glue in `generated_code/` is compiled automatically. `REP_FILE` tells `logos_module()` to:\n\n1. Run `repc` to generate the source/replica headers\n2. Generate the `*Plugin` / `*Interface` wrapper around your `*Backend` (because `metadata.json` sets `\"interface\": \"universal\"`)\n3. Build a separate `calc_ui_cpp_replica_factory` shared library"}, {"execs": [], "md": "## Step 5: C++ Backend\n\nNow write the backend \u2014 the **only** C++ you author. It's a single class that derives:\n\n- **`CalcUiCppSimpleSource`** \u2014 generated by `repc` from your `.rep`; you override its slots. The QML replica receives each return value via Qt Remote Objects.\n- **`LogosUiPluginContext`** \u2014 gives `modules()` (Qt-typed callers + event subscriptions for your `dependencies`) and `onContextReady()`. A UI plugin is a view, not a module, so that is all the context carries.\n\nThere is no `*_interface.h` and no `*_plugin.{h,cpp}` to write \u2014 the builder generates the `*Plugin` (`Q_OBJECT`, `Q_PLUGIN_METADATA`, `initLogos`, `setBackend()`/`enableRemoting()`) and `*Interface` (`name()`, `version()`) around this class."}, {"execs": [{"cmd": "write src/calc_ui_cpp_backend.h", "kind": "file", "note": "Wrote src/calc_ui_cpp_backend.h", "status": "pass"}], "md": "### 5.1 `src/calc_ui_cpp_backend.h`\n\n```cpp\n#pragma once\n\n#include \"rep_calc_ui_cpp_source.h\"\n#include \"logos_ui_plugin_context.h\"\n\n// The whole hand-written backend. Derives:\n//   - CalcUiCppSimpleSource \u2014 generated from calc_ui_cpp.rep; override its\n//     slots (the QML replica gets each return value via Qt Remote Objects).\n//   - LogosUiPluginContext \u2014 supplies modules() (Qt-typed callers + typed event\n//     subscriptions for \"dependencies\") and onContextReady(). A UI plugin is a\n//     view, not a module, so that is all the context carries.\n// The *Plugin / *Interface classes (Q_PLUGIN_METADATA, initLogos wiring,\n// QtRO registration) are generated around it.\nclass CalcUiCppBackend : public CalcUiCppSimpleSource,\n                         public LogosUiPluginContext\n{\npublic:\n    // Slots from calc_ui_cpp.rep \u2014 each delegates to calc_module.\n    int add(int a, int b) override;\n    int multiply(int a, int b) override;\n    int factorial(int n) override;\n    int fibonacci(int n) override;\n    QString libVersion() override;\n\n    // Tells calc_module to emit its `versionReady` event.\n    void announceVersion() override;\n\n    // Fires once when ui-host hands the plugin its LogosAPI \u2014 the\n    // typed dependency surface is live, so we arm the event\n    // subscription here (before the view's first call).\n    void onContextReady() override;\n\nprivate:\n    // Feeds the non-slot surfaces of the .rep after each calculation:\n    // bumps the computeCount PROP (setComputeCount, generated) and\n    // emits the `computed` SIGNAL. The READWRITE `memory` PROP is\n    // driven from QML, so the backend doesn't have to touch it.\n    void record(const QString& op, int result);\n};\n```\n\nNo `Q_OBJECT`, no `Q_PLUGIN_METADATA`, no `initLogos`, no `name()`/`version()` \u2014 the universal builder generates all of that. You only declare the `.rep` slot overrides (plus any private helpers of your own, like `record`).\n\nBeyond the call-and-return slots, the backend drives the rest of the `.rep` surface:\n\n- **PROPs** \u2014 each gets a generated `set<Prop>()` setter on the `SimpleSource`. The backend calls `setComputeCount(...)` (and could call `setMemory(...)`); `memory` is READWRITE, so QML can write it too.\n- **SIGNAL** \u2014 `computed(...)` is declared on the `SimpleSource`, so the backend just `emit`s it.\n- **Event subscriptions** \u2014 `LogosUiPluginContext` gives typed `modules().dep.on<Event>(...)` and the `onContextReady()` hook. `onContextReady()` subscribes to `calc_module`'s `versionReady` event and pipes the payload into the `versionEvent` PROP, which Qt Remote Objects auto-syncs to the view. Arm subscriptions in `onContextReady()` (not the constructor) so they're live the moment the backend is wired."}, {"execs": [{"cmd": "write src/calc_ui_cpp_backend.cpp", "kind": "file", "note": "Wrote src/calc_ui_cpp_backend.cpp", "status": "pass"}], "md": "### 5.2 `src/calc_ui_cpp_backend.cpp`\n\n```cpp\n#include \"calc_ui_cpp_backend.h\"\n\n// Generated umbrella: LogosModules (behind modules()) from\n// metadata.json#dependencies \u2014 typed wrappers + typed event accessors.\n#include \"logos_sdk.h\"\n\nint CalcUiCppBackend::add(int a, int b)\n{\n    int result = modules().calc_module.add(a, b);\n    record(\"add\", result);\n    return result;\n}\n\nint CalcUiCppBackend::multiply(int a, int b)\n{\n    int result = modules().calc_module.multiply(a, b);\n    record(\"multiply\", result);\n    return result;\n}\n\nint CalcUiCppBackend::factorial(int n)\n{\n    int result = modules().calc_module.factorial(n);\n    record(\"factorial\", result);\n    return result;\n}\n\nint CalcUiCppBackend::fibonacci(int n)\n{\n    int result = modules().calc_module.fibonacci(n);\n    record(\"fibonacci\", result);\n    return result;\n}\n\nQString CalcUiCppBackend::libVersion()\n{\n    // A UI plugin is Qt-typed: modules().calc_module's wrapper returns QString\n    // (api-style qt), matching the .rep slot \u2014 no conversion needed.\n    return modules().calc_module.libVersion();\n}\n\nvoid CalcUiCppBackend::record(const QString& op, int result)\n{\n    // PROP: bump the slot-driven counter. setComputeCount() is the\n    // generated setter; Qt Remote Objects syncs the new value to every\n    // replica, so the view's \"Computations\" label updates with no polling.\n    setComputeCount(computeCount() + 1);\n\n    // SIGNAL: a backend \u2192 view push, distinct from the return value the\n    // QML side gets via logos.watch(). `computed` is declared on the\n    // generated SimpleSource, so we just emit it; the typed replica\n    // re-emits it and the view's Connections block catches it.\n    emit computed(op, result);\n}\n\nvoid CalcUiCppBackend::announceVersion()\n{\n    // Fire-and-forget call into calc_module: it looks up the library\n    // version and emits it as a `versionReady` event. We don't read a\n    // return value here \u2014 the event comes back through the subscription\n    // armed in onContextReady() below.\n    modules().calc_module.libVersionNotify();\n}\n\nvoid CalcUiCppBackend::onContextReady()\n{\n    // Typed module-event subscription. `versionReady` is calc_module's\n    // event (Part 1's `logos_events:` block); the generated wrapper\n    // exposes it as on<Event> + a Qt-typed callback (QString, because a\n    // UI plugin is api-style qt). Push each payload into the versionEvent\n    // PROP \u2014 Qt Remote Objects then auto-syncs it to the QML replica.\n    modules().calc_module.onVersionReady([this](const QString& version) {\n        setVersionEvent(version);\n    });\n}\n```\n\nKey points:\n\n- Each value slot delegates straight to `calc_module` via `modules().calc_module.<method>(...)` \u2014 the generated typed SDK, type-safe with no `QVariant` \u2014 then calls `record()` to drive the PROP + SIGNAL surfaces before returning. Slot return values travel back to the QML replica via Qt Remote Objects.\n- `modules().calc_module.libVersion()` returns `QString` even though Part 1's `calc_module` declares it `std::string`. A UI plugin is Qt-typed (api-style `qt`), so the generated `modules().<dep>` wrapper exposes Qt types (`QString`, `int`, ...) that match the `.rep` slots directly \u2014 the std<->Qt conversion happens inside the generated wrapper, not in your view code.\n- **PROP vs. SIGNAL vs. return value \u2014 three ways to get data to the view.** `record()` shows two of them side by side: `setComputeCount(...)` writes a **PROP** that Qt Remote Objects auto-syncs (the view reads `backend.computeCount` with no polling), while `emit computed(...)` fires a **SIGNAL** the view catches in a `Connections` block. Both are independent of the slot's `logos.watch()` return value. The READWRITE `memory` PROP is the fourth path \u2014 there the *view* writes and the value syncs back.\n- **Event subscription vs. method call.** `announceVersion()` makes `calc_module` *emit*; `onContextReady()` *subscribes* to that emission. The callback is Qt-typed (`const QString&`) and `setVersionEvent(...)` is the generated PROP setter \u2014 the value reaches QML with no polling and no return value to await. Arm the subscription in `onContextReady()`, never the constructor: `modules()` isn't wired until the framework calls it.\n- No `initLogos`, no manual `LogosModules` construction \u2014 `modules()` is wired by the generated plugin before any slot runs or any event arrives."}, {"execs": [], "md": "## Step 6: QML View\n\nCreate `src/qml/Main.qml`:"}, {"execs": [{"cmd": "write src/qml/Main.qml", "kind": "file", "note": "Wrote src/qml/Main.qml", "status": "pass"}], "md": "```qml\nimport QtQuick\nimport QtQuick.Controls\nimport QtQuick.Layouts\n\nItem {\n    id: root\n\n    property string result: \"\"\n    property string errorText: \"\"\n\n    // Last payload from the backend's `computed` SIGNAL (see Connections below).\n    property string lastSignal: \"(none)\"\n\n    // Typed replica of the backend running in ui-host (generated from calc_ui_cpp.rep).\n    readonly property var backend: logos.module(\"calc_ui_cpp\")\n\n    // The ui-host backend connects asynchronously, so the replica isn't\n    // immediately usable. Track readiness reactively: isViewModuleReady()\n    // is a Q_INVOKABLE (not a property), so we re-check it on the\n    // onViewModuleReadyChanged signal and once at startup \u2014 never via a\n    // plain property binding, which would not re-evaluate.\n    property bool ready: false\n\n    Connections {\n        target: logos\n        function onViewModuleReadyChanged(moduleName, isReady) {\n            if (moduleName === \"calc_ui_cpp\")\n                root.ready = isReady && root.backend !== null\n        }\n    }\n    Component.onCompleted: {\n        root.ready = root.backend !== null && logos.isViewModuleReady(\"calc_ui_cpp\")\n    }\n\n    // SIGNAL from the .rep: the backend emits `computed(op, result)` after\n    // each calculation. The typed replica re-emits it, so we catch it with\n    // a Connections block \u2014 no logos.watch(), no property read. This is the\n    // backend \u2192 view push path, distinct from the slot return value above.\n    Connections {\n        target: root.backend\n        function onComputed(op, result) {\n            root.lastSignal = op + \" = \" + result\n        }\n    }\n\n    // logos.watch() delivers the result of a replica slot call via callbacks.\n    // No QtRemoteObjects import needed \u2014 the bridge handles it.\n    function callCalc(method, args) {\n        if (!root.ready) {\n            root.errorText = \"Backend not ready\"\n            return\n        }\n        root.errorText = \"\"\n        root.result = \"...\"\n        logos.watch(backend[method].apply(backend, args),\n            function(value) { root.result = String(value) },\n            function(error) { root.errorText = String(error) }\n        )\n    }\n\n    ColumnLayout {\n        anchors.fill: parent\n        anchors.margins: 24\n        spacing: 16\n\n        Text {\n            text: \"Logos Calculator (C++ backend)\"\n            font.pixelSize: 20\n            color: \"#ffffff\"\n            Layout.alignment: Qt.AlignHCenter\n        }\n\n        // Reactive backend-connection indicator.\n        Text {\n            text: root.ready ? \"Connected\" : \"Connecting to backend...\"\n            color: root.ready ? \"#56d364\" : \"#f0883e\"\n            font.pixelSize: 12\n            Layout.alignment: Qt.AlignHCenter\n        }\n\n        RowLayout {\n            spacing: 12\n            Layout.fillWidth: true\n\n            TextField {\n                id: inputA\n                placeholderText: \"a\"\n                Layout.preferredWidth: 80\n                validator: IntValidator {}\n            }\n\n            TextField {\n                id: inputB\n                placeholderText: \"b\"\n                Layout.preferredWidth: 80\n                validator: IntValidator {}\n            }\n\n            Button {\n                text: \"Add\"\n                enabled: root.ready\n                onClicked: root.callCalc(\"add\", [parseInt(inputA.text) || 0, parseInt(inputB.text) || 0])\n            }\n\n            Button {\n                text: \"Multiply\"\n                enabled: root.ready\n                onClicked: root.callCalc(\"multiply\", [parseInt(inputA.text) || 0, parseInt(inputB.text) || 0])\n            }\n        }\n\n        RowLayout {\n            spacing: 12\n            Layout.fillWidth: true\n\n            TextField {\n                id: inputN\n                placeholderText: \"n\"\n                Layout.preferredWidth: 80\n                validator: IntValidator { bottom: 0 }\n            }\n\n            Button {\n                text: \"Factorial\"\n                enabled: root.ready\n                onClicked: root.callCalc(\"factorial\", [parseInt(inputN.text) || 0])\n            }\n\n            Button {\n                text: \"Fibonacci\"\n                enabled: root.ready\n                onClicked: root.callCalc(\"fibonacci\", [parseInt(inputN.text) || 0])\n            }\n\n            Button {\n                text: \"libcalc version\"\n                enabled: root.ready\n                onClicked: root.callCalc(\"libVersion\", [])\n            }\n\n            Button {\n                // Fires the event path: asks calc_module to emit\n                // versionReady. No logos.watch() \u2014 the result comes\n                // back through the versionEvent PROP, not a return value.\n                text: \"Announce version (event)\"\n                enabled: root.ready\n                onClicked: root.backend.announceVersion()\n            }\n        }\n\n        Rectangle {\n            Layout.fillWidth: true\n            height: 56\n            color: root.errorText.length > 0 ? \"#3d1a1a\" : \"#1a2d1a\"\n            radius: 8\n\n            Text {\n                anchors.centerIn: parent\n                text: root.errorText.length > 0 ? root.errorText\n                        : (root.result.length > 0 ? root.result : \"Enter values and press a button\")\n                color: root.errorText.length > 0 ? \"#f85149\" : \"#56d364\"\n                font.pixelSize: 15\n            }\n        }\n\n        // Slot-driven PROP: bumped by the backend's record() after each\n        // calculation. A plain property read \u2014 auto-syncs, no polling.\n        Text {\n            text: \"Computations: \" + ((root.ready && root.backend) ? root.backend.computeCount : 0)\n            color: \"#cdd6f4\"\n            font.pixelSize: 14\n            Layout.alignment: Qt.AlignHCenter\n        }\n\n        // SIGNAL payload, captured by the Connections block above.\n        Text {\n            text: \"Last op (signal): \" + root.lastSignal\n            color: \"#94e2d5\"\n            font.pixelSize: 14\n            Layout.alignment: Qt.AlignHCenter\n        }\n\n        // READWRITE PROP: the memory register. The label *reads*\n        // backend.memory; the buttons *write* it. A write round-trips\n        // QML \u2192 replica \u2192 backend source \u2192 back to every replica, so the\n        // label updates once the new value syncs home.\n        RowLayout {\n            spacing: 12\n            Layout.alignment: Qt.AlignHCenter\n\n            Text {\n                text: \"Memory: \" + ((root.ready && root.backend) ? root.backend.memory : 0)\n                color: \"#cdd6f4\"\n                font.pixelSize: 14\n            }\n\n            Button {\n                text: \"Store (MS)\"\n                enabled: root.ready\n                onClicked: root.backend.memory = parseInt(root.result) || 0\n            }\n\n            Button {\n                text: \"Clear (MC)\"\n                enabled: root.ready\n                onClicked: root.backend.memory = 0\n            }\n        }\n\n        // Event-fed label: the versionEvent PROP auto-syncs from the\n        // backend's typed versionReady subscription. No polling \u2014 it\n        // updates the moment calc_module emits.\n        Text {\n            readonly property string ev: (root.ready && root.backend) ? root.backend.versionEvent : \"\"\n            text: \"Version event: \" + (ev.length > 0 ? ev : \"(none yet)\")\n            color: \"#f9e2af\"\n            font.pixelSize: 15\n            Layout.alignment: Qt.AlignHCenter\n        }\n\n        Item { Layout.fillHeight: true }\n    }\n}\n```\n\nKey patterns \u2014 one for each surface the `.rep` exposes:\n\n- `logos.module(\"calc_ui_cpp\")` \u2014 gets the typed replica (auto-synced properties, callable slots, connectable signals)\n- **SLOT return value:** `logos.watch(backend.add(1, 2), ...)` \u2014 the reply as a JS Promise.\n- **READONLY PROP (slot-driven):** `backend.computeCount` is read directly in a binding. The backend bumps it via `setComputeCount(...)` after each calculation, and Qt Remote Objects auto-syncs it \u2014 the label re-evaluates with no polling.\n- **READWRITE PROP:** `backend.memory` is both read (the \"Memory:\" label) and **written** (`backend.memory = ...` in the Store/Clear buttons). Assigning the property on the replica pushes the value to the backend source; it syncs back to every replica, so the label updates once the write lands.\n- **SIGNAL:** `Connections { target: root.backend; function onComputed(op, result) { ... } }` catches the backend's `computed` push. No return value, no property \u2014 a one-shot event the view reacts to.\n- **Event-fed PROP:** `backend.versionEvent` is read directly \u2014 no `logos.watch()`, no polling. The \"Announce version\" button calls the void `announceVersion()` slot (which makes `calc_module` emit `versionReady`); the backend's subscription catches the event and writes the PROP, and Qt Remote Objects pushes the new value straight into this label. This is the event path, distinct from the call-and-return slots above.\n- **Readiness:** the backend lives in a separate `ui-host` process and connects asynchronously, so the replica isn't usable the instant the view loads. `logos.isViewModuleReady(\"calc_ui_cpp\")` reports the current state and the `onViewModuleReadyChanged` signal fires when it changes. Because `isViewModuleReady()` is a `Q_INVOKABLE` method (not a property), don't bind it directly \u2014 a `readonly property bool ready: logos.isViewModuleReady(...)` would never re-evaluate. Use the `Connections` + `Component.onCompleted` pattern shown above, and gate the buttons with `enabled: root.ready`.\n- The `logos` object is injected by the host at runtime \u2014 no `QtRemoteObjects` import needed"}, {"execs": [], "md": "## Step 7: Use the Logos Design System in your QML\n\nThe QML you load above runs inside the host (`logos-basecamp` / `logos-standalone-app`), which already has `logos-design-system` on the QML import path. Use its themed components rather than rolling your own visuals \u2014 your module gets the polished look automatically as the design system evolves.\n\n```qml\nimport Logos.Theme\nimport Logos.Controls\nimport Logos.Icons        // optional shared icon assets\n\nLogosButton {\n    text: qsTr(\"Add\")\n    onClicked: root.callCalc(\"add\", [parseInt(inputA.text) || 0,\n                                     parseInt(inputB.text) || 0])\n}\n\nLogosTextField {\n    id: inputA\n    placeholderText: qsTr(\"a\")\n}\n\nRectangle {\n    color: Theme.palette.backgroundSecondary\n    radius: Theme.spacing.radiusSmall\n    LogosText { text: qsTr(\"Result\"); color: Theme.palette.text }\n}\n```\n\n**Discover what's available** by running the storybook:\n\n```bash\ncd repos/logos-design-system && nix run\n```\n\nThe sidebar splits components into:\n\n- **Controls** \u2014 designed per Figma, production-ready (`LogosButton`, `LogosBadge`, `LogosCheckbox`, `LogosComboBox`, `LogosIconButton`, `LogosPaginator`, `LogosSearchBar`, `LogosTabBar`, `LogosTable`, `LogosText`, `LogosTextField`, `LogosToolTip`, \u2026).\n- **Controls (not designed)** \u2014 placeholders with stable APIs but unstyled visuals (`LogosDialog`, `LogosDrawer`, `LogosScrollView`, `LogosSpinner`, `LogosTextArea`, `LogosSwitch`, \u2026). You can ship with them; they'll get the polished look applied later without you having to change your QML.\n\n**Theme tokens** (use these instead of hex literals or magic font sizes):\n\n- `Theme.palette.*` \u2014 `background`, `backgroundSecondary`, `surface`, `text`, `textSecondary`, `border`, `primary`, `success`, `warning`, `error`, `info`, `hover`, `pressed`, \u2026\n- `Theme.spacing.*` \u2014 `tiny`, `small`, `medium`, `large`, `xlarge`, `xxlarge`, `radiusSmall`, `radiusMedium`, `radiusLarge`\n- `Theme.typography.*` \u2014 `pageTitleText` (36), `titleText` (30), `panelTitleText` (24), `subtitleText` (16), `primaryText` (14), `secondaryText` (12); `weightRegular` / `weightMedium` / `weightBold`; `publicSans`\n- `Logos.Icons.LogosIcons.*` \u2014 `arrowLeft`, `arrowRight`, `refresh`, `install`, `trash`, `more`, `search`, \u2026\n\n**Feedback and contributions**\n\nFeel free to report bugs, file feature requests, or contribute components / theme tokens upstream \u2014 all welcome at `logos-co/logos-design-system`. The same fix lifts every consumer, so upstreaming is the most impactful path. If you can sketch the public API you'd like to use in a feature request, it makes review and implementation much faster."}, {"execs": [], "md": "## Step 8: `flake.nix`\n\nThe template already wires everything up. Update the description and point `calc_module` at your dependency:"}, {"execs": [{"cmd": "write flake.nix", "kind": "file", "note": "Wrote flake.nix", "status": "pass"}], "md": "```nix\n{\n  description = \"Calculator C++ UI plugin for Logos - QML view with process-isolated backend for calc_module\";\n\n  inputs = {\n    logos-module-builder.url = \"github:logos-co/logos-module-builder\";\n\n    # Points at your local calc_module checkout. This is a placeholder \u2014\n    # you lock it to your actual path in the next step with\n    # `nix flake update --override-input` (see \"Lock and build\" below).\n    calc_module.url = \"path:/path/to/your/calc_module\";\n  };\n\n  outputs = inputs@{ logos-module-builder, calc_module, ... }:\n    logos-module-builder.lib.mkLogosQmlModule {\n      src = ./.;\n      configFile = ./metadata.json;\n      flakeInputs = inputs;\n    };\n}\n```\n\nThe `calc_module` input attribute name must match the dependency name in `metadata.json`.\n\nThe placeholder `path:/path/to/your/calc_module` is **not** meant to be edited by hand \u2014 Nix won't let a `flake.nix` input use a relative path like `../logos-calc-module` (it's evaluated from a sandboxed copy, so `..` escapes it). Instead you point it at your real checkout **once** via `--override-input` in the next step, which records the resolved absolute path in `flake.lock`. After that, plain `nix run` / `nix build` use the locked path with no override needed.\n\n- **`path:`** (used here) \u2014 a local directory on disk. Best for developing `calc_module` and its UI side by side, no net
