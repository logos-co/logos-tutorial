Vq5OTk7Ozs0mSfPnLX87n8+fPnx8bG9u5c+dbb7311FNPTU5Ojo6Olkql6+8dHh6+fm23/VwTExMrV678qN8GAAAAAHdvYmJinndT1z9et3z58savJyDXV7Pf//73n/vc5xZxMQAAAABL1okTJ/bv33+rd29/BtYSce3cLgAAAAAW2Pxl5r8CVu30qCVizoe96VFfAAAAACyA+cvMfwWs2jnoS8ScgPXOO+8Ui8XFWgwAAADAklUsFnt7e+e5YOnuwJpT6wqFwmuvvbZYiwEAAABYsl577bVCoTDPBUt3B9aNH/YnP/lJHMeLshgAAACApSmO4x//+MfzX/NfAWt2draR6wnLjR/27NmzL7300qIsBgAAAGBpeumll86dOzf/NanOzs7r/1+2bFkqlWrkqoKQJMnExMSNrzc1Nb355pubNm1a+CUBAAAALDUDAwN79+4tl8vzX5ae8/8SeYbuVh+zXC5/5zvfGR8fX+D1AAAAACw14+Pj3/72t29br6IbA1apVGrMksIyz8c8d+7cCy+8oGEBAAAANM74+PgLL7zw73//+04unhuwqtXqfd+wSqXS/MfVDw4O7t279/Tp0wu2JAAAAIClY2Bg4Gtf+9rg4OAdXp9pb2+f89Ls7Gwul0un57at+0OlUikWi7e9bGJi4he/+EU2m922bVsmk1mAhQEAAADc9+I4/tnPfvajH/3o8uXLd37XTQJW9H8N6/47zb1arRaLxSRJ7uTiSqXypz/96de//nU+n//Upz6Vy+UavTwAAACA+1WxWPzlL3/5gx/84He/+12lUvlI9879FcJrMplMPp+/n/Zh1erVR/2Catrb25988snt27dv2rRp/fr1y5Yta2pqqvsKAQAAAO4b5XJ5YmLizJkzAwMDR48e7e3tLRQK/7+hbhmwoihKp9P5fP7+eICu9uTg/EdfAQAAABCg+TZYVavVQqFwH5zpXiqVCoWCegUAAABwL8re9oqZmZlyudzc3HzPnYqVJEkcx7f9zUEAAAAAQnb7gBVFUbVanZ6enp6ezuVy2Ww2nU6n0+lUKhVaz0qSJEmSarVarVZnZ2fjOF7sFQEAAABwt+4oYF0Tx7EqBAAAAMBCun9+ZBAAAACA+9L/AITGFwo6T9r+AAAAAElFTkSuQmCC)\n\nEvery surface the `.rep` declares is now proven end to end from one click:\n\n- **SLOT return value** \u2014 the result `8` comes from `calc_module.add(3, 5)`, the call-and-return path (QML replica \u2192 Qt Remote Objects \u2192 ui-host backend \u2192 typed SDK \u2192 `calc_module`), delivered via `logos.watch()`.\n- **READONLY PROP (slot-driven)** \u2014 `Computations: 1` is the `computeCount` PROP: the same `add` call ran `setComputeCount(...)` in the backend's `record()`, and Qt Remote Objects synced it to the view with no polling.\n- **SIGNAL** \u2014 `Last op (signal): add = 8` is the `computed` signal the backend `emit`ted; the QML `Connections` block caught it. It carried the op name *and* the result, neither of which is a property or a return value.\n- **READWRITE PROP** \u2014 `Memory: 0` \u2192 `Memory: 8` proves the *write* direction: the Store button assigned `backend.memory = 8` in QML, which pushed to the backend source and synced back to the label. Properties aren't read-only mirrors; QML can drive them too.\n- **Event-fed PROP** \u2014 `Version event: 1.0.0` is the event path: clicking *Announce version* called `calc_module.libVersionNotify()`, which emitted `versionReady(\"1.0.0\")`; the backend's `modules().calc_module.onVersionReady(...)` subscription \u2014 armed in `onContextReady()` \u2014 caught it and wrote the `versionEvent` PROP, which Qt Remote Objects synced into the view. The label was `(none yet)` until the event fired, so seeing the version proves the typed subscription delivered."}, {"execs": [], "md": "## Step 10: Hot-reloading QML with `nix build .#ui-dev`\n\nFor QML iteration, build the dev launcher once. After that, QML edits need no rebuild at all:\n\n```bash\nnix build .#ui-dev\n./result/bin/run-logos-standalone-ui\n```\n\nRun from the repo root and the launcher finds your QML source automatically, then watches it. Edit a `.qml` file, save, and the view re-renders in about 200 ms. It reports what it picked up on startup:\n\n```\nrun-logos-standalone-ui: hot-reloading QML from /path/to/logos-calc-ui-cpp/src/qml\n  (export DEV_QML_PATH to override, or LOGOS_QML_HOT_RELOAD=0 to disable)\n```\n\n`ui-dev` is the same wrapper `nix run .` uses \u2014 dependency modules bundled and loaded identically \u2014 exposed as a package so it lands in `./result/bin`. It is a development target and is never bundled into `.lgx` packages.\n\n**What reloads, and what doesn't.**\n\n- **Any `.qml`/`.js` under your view directory**, including files and folders created after launching.\n- **The backend keeps running.** A module's C++ backend lives in a separate `ui-host` process, so its state and connections survive a reload.\n- **QML-side state resets** \u2014 scroll position, text fields, current tab.\n- **A syntax error is recoverable.** It's logged with a line number and the view blanks; the next save that compiles restores it.\n- **C++, `.rep`, `metadata.json` and CMake changes still need a rebuild.** Re-run `nix build .#ui-dev` and relaunch.\n\n**Why not `nix run .`?** It re-evaluates the flake and rehashes the source tree on every invocation. Since `src = ./.` covers every tracked file including `*.qml`, even a one-character QML edit rebuilds the plugin before the app starts. Building `ui-dev` once avoids that entirely.\n\n> **Custom layouts:** the launcher looks for the `view` entry from `metadata.json` under `src/<viewDir>/`, then `<viewDir>/`. If your tree differs, set `DEV_QML_PATH` to the directory holding the entry file and it takes precedence.\n\n> This does not work with `logos-basecamp`. Basecamp loads QML plugins from its own data directory, so source edits are not reflected until you rebuild and reinstall the `.lgx` package."}, {"execs": [], "md": "## Step 11: How the Pieces Connect\n\n1. `nix build` \u2192 generates the `*Plugin`/`*Interface` glue around your `CalcUiCppBackend`, compiles the C++ plugin + replica factory, bundles QML view\n2. `nix run` \u2192 launches `logos-standalone-app` which:\n   - Loads `calc_module` (dependency)\n   - Spawns a `ui-host` child process with `calc_ui_cpp_plugin.so`\n   - The generated plugin calls `initLogos()` \u2192 wires `modules()` and `onContextReady()` \u2192 `setBackend(<your CalcUiCppBackend>)` \u2192 `enableRemoting(host)`\n   - Backend is now accessible over a local socket\n3. Host app loads `calc_ui_cpp_replica_factory.dylib` \u2192 creates a typed replica\n4. QML gets the replica via `logos.module(\"calc_ui_cpp\")`\n5. `backend.add(1, 2)` \u2192 Qt Remote Objects sends call to ui-host \u2192 your backend's `add()` runs `modules().calc_module.add(1, 2)` \u2192 returns result"}, {"execs": [], "md": "## Step 12: UI Integration Tests\n\nAdd automated UI tests using the [logos-qt-mcp](https://github.com/logos-co/logos-qt-mcp) test framework. Just create `.mjs` files in `tests/` and `logos-module-builder` auto-wires `nix build .#integration-test`.\n\nTests connect to the QML inspector inside `logos-standalone-app` and can find elements, click buttons, verify text, and take screenshots."}, {"execs": [{"cmd": "write tests/ui-tests.mjs", "kind": "file", "note": "Wrote tests/ui-tests.mjs", "status": "pass"}], "md": "### 12.1 Create a test file\n\nCreate `tests/ui-tests.mjs`:\n\n```javascript\nimport { resolve } from \"node:path\";\n\n// CI sets LOGOS_QT_MCP automatically; for interactive use: nix build .#test-framework -o result-mcp\nconst root =\n  process.env.LOGOS_QT_MCP ||\n  new URL(\"../result-mcp\", import.meta.url).pathname;\nconst { test, run } = await import(\n  resolve(root, \"test-framework/framework.mjs\")\n);\n\ntest(\"calc_ui_cpp: loads and shows title\", async (app) => {\n  await app.waitFor(\n    async () => {\n      await app.expectTexts([\"Logos Calculator (C++ backend)\"]);\n    },\n    { timeout: 15000, interval: 500, description: \"UI to load\" },\n  );\n});\n\ntest(\"calc_ui_cpp: operation buttons visible\", async (app) => {\n  await app.expectTexts([\"Add\", \"Multiply\", \"Factorial\", \"Fibonacci\"]);\n});\n\nrun();\n```"}, {"execs": [{"cmd": "git add tests/", "exit_code": 0, "kind": "run", "note": "", "output": "", "status": "pass"}], "md": "### 12.2 Run the tests\n\n```bash\ngit add tests/\n```"}, {"execs": [{"cmd": "nix flake update --override-input calc_module path:../logos-calc-module && nix build .#integration-test -L", "exit_code": 1, "kind": "run", "note": "exit code 1", "output": "warning: Git tree '/home/runner/work/_temp/doctest-chain-9z9rppqh/logos-calc-ui-cpp' is dirty\nwarning: Git tree '/home/runner/work/_temp/doctest-chain-9z9rppqh/logos-calc-ui-cpp' is dirty\nerror: flake 'git+file:///home/runner/work/_temp/doctest-chain-9z9rppqh/logos-calc-ui-cpp' does not provide attribute 'packages.x86_64-linux.integration-test', 'legacyPackages.x86_64-linux.integration-test' or 'integration-test'\n", "status": "fail"}], "md": "```bash\n# Hermetic CI test\nnix build .#integration-test -L\n```\n\nThe `integration-test` output launches `logos-standalone-app` with `QT_QPA_PLATFORM=offscreen` (no display needed), connects to the QML inspector, and runs all `.mjs` files in `tests/`.\n\nTo run tests interactively (against an already-running app):\n\n```bash\nnix build .#test-framework -o result-mcp\nnix run .                     # app with inspector on :3768\nnode tests/ui-tests.mjs       # in another terminal\n```"}, {"execs": [], "md": "## Comparison: .rep Interface Patterns\n\nYou declare each pattern in the `.rep` and implement it in your `*Backend` (which derives the generated `SimpleSource` + `LogosUiPluginContext`). There is no hand-written plugin \u2014 the `*Plugin`/`*Interface` glue is generated. Every row but **Model** is live in this tutorial's `.rep` (\u2713), and the UI test in Step 9 drives each one:\n\n| Pattern              | .rep declaration                          | Backend C++ (`CalcUiCppBackend`)                                            | QML usage                                                                  |\n| -------------------- | ----------------------------------------- | -------------------------------------------------------------------------- | -------------------------------------------------------------------------- |\n| **Return value** \u2713   | `SLOT(int add(int a, int b))`             | `int add(...) override { return ...; }`                                    | `logos.watch(backend.add(1,2), cb)`                                        |\n| **Void slot** \u2713      | `SLOT(void announceVersion())`            | `void announceVersion() override { ... }`                                  | `backend.announceVersion()` (fire-and-forget, no `watch`)                  |\n| **READONLY PROP** \u2713  | `PROP(int computeCount=0 READONLY)`       | `setComputeCount(computeCount()+1)` (inherited setter)                     | `backend.computeCount` (auto-syncs, read-only)                             |\n| **READWRITE PROP** \u2713 | `PROP(int memory=0 READWRITE)`            | `setMemory(...)` \u2014 or let QML write it                                     | `backend.memory` (read) / `backend.memory = 8` (write, round-trips)        |\n| **Signal** \u2713         | `SIGNAL(computed(QString op, int result))`| `emit computed(\"add\", 8)`                                                  | `Connections { target: backend; function onComputed(op, result) {...} }`  |\n| **Event-fed PROP** \u2713 | `PROP(QString versionEvent=\"\" READONLY)`  | `onContextReady()`: `modules().dep.on<Event>([this](...){ setVersionEvent(...); })` | `backend.versionEvent` (auto-syncs, no polling)                   |\n| **Model**            | (use Q_PROPERTY on backend)               | `Q_PROPERTY(QAbstractItemModel* items ...)`                               | `logos.model(\"calc_ui_cpp\", \"items\")`                                      |\n\nThe last live row uses the `LogosUiPluginContext` surface \u2014 Qt-typed `modules()` callers and event subscriptions armed in `onContextReady()`: `versionEvent` is a PROP fed by the `modules().calc_module.onVersionReady(...)` subscription, and the *Announce version* button drives it. **Model** is the one pattern shown but not built here \u2014 for a `QAbstractItemModel*` Q_PROPERTY remoted via `logos.model()`, see [Next Steps](#next-steps)."}, {"execs": [], "md": "## Offering a Capability to Other Apps\n\nA `.rep` interface is how *your* QML talks to *your* backend. It is\nprivate \u2014 no other app can see it, and that is deliberate.\n\nWhen you want another app to be able to use something you do, declare an\n**intent** instead. Unlike a `.rep` method, an intent is addressed by\ncapability rather than by app name, so a caller never has to know you\nexist.\n\nIn `metadata.json` \u2014 entries are **objects**, not strings:\n\n```json\n\"provides\": [ { \"intent\": \"calc.evaluate\" } ]\n```\n\nHandle it in your QML view, exactly like any other signal:\n\n```qml\nConnections {\n    target: logos\n    function onIntentRequested(requestId, intent, params, requesterName) {\n        // Your backend is still reached the normal way \u2014 via the replica.\n        // The intent is just how the request arrived.\n        var result = backend.evaluate(params.expression)\n        logos.respond(requestId, true, ({ value: result }), \"\")\n    }\n}\n```\n\nAnswering later is fine and usually right: show whatever UI you need,\nlet the user decide, then call `logos.respond`. What you must not do is\ndeclare `provides` and never connect `intentRequested` \u2014 the requester\nthen waits out the deadline and gets `timeout`.\n\nBecause `provides` is copied into the signed `.lgx` manifest, a catalog\ncan see what your package offers before it is installed. `uses` is not\ncopied: what you can *do* is public, what you want to *call* is not.\n\nFull API and error codes: [Developer Guide](logos-developer-guide.md)\n\u00a78.5. App-author walkthrough:\n[Intents for App Developers](guide-intents-for-app-developers.md)."}, {"execs": [], "md": "## Next Steps\n\n- This tutorial already exercises slots, PROPs of different types and modes, and a signal \u2014 extend them with more state for your own UI\n- Add an **enum** to the `.rep` (`ENUM Status { Idle, Busy }` \u2014 no parentheses, unlike `SLOT`/`PROP`/`SIGNAL`) \u2014 the factory registers it under the `Logos.<ModuleName>` QML URI, so `import Logos.CalcUiCpp` then `CalcUiCpp.Busy` works in bindings\n- Use `logos.model()` for list views backed by a `QAbstractItemModel*` Q_PROPERTY \u2014 the **Model** row above, the one `.rep` pattern this tutorial doesn't build\n- Package as `.lgx` for distribution: `nix build .#lgx`\n- **Use the Logos Design System** in your QML \u2014 see [the design system step](#use-the-logos-design-system-in-your-qml). Browse components in the storybook (`cd repos/logos-design-system && nix run`); file issues at `logos-co/logos-design-system`.\n- See [logos-package-manager-ui](https://github.com/logos-co/logos-package-manager-ui) for a production example"}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
